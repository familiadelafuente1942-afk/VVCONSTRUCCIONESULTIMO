name: obras-diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de obras de la app general (nombres y fechas, sin montos)
        run: |
          K=sb_publishable_13lg1fm-zw7UHvCkVPdFFQ_07TSH4i5; U=https://bxhjgxzvayszfqwlwinq.supabase.co/rest/v1/bco_storage
          g(){ curl -s "$U?key=eq.$1&select=value,updated_at&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K"; }
          g vv_obras > o.json; g vv_obras_del > d.json; g vv_obras__ts > t.json
          curl -s "$U?key=like.respaldo_obras:*&select=key,value" -H "apikey: $K" -H "Authorization: Bearer $K" > r.json
          curl -s "$U?key=like.vv_bak__vv_obras__*&select=key,value" -H "apikey: $K" -H "Authorization: Bearer $K" > b.json
          python3 - <<'PY'
          import json,datetime
          def L(f):
            try: return json.load(open(f))
            except Exception as e: return []
          o=L('o.json'); d=L('d.json'); t=L('t.json')
          obras=json.loads(o[0]['value']) if o and o[0].get('value') else []
          print('NUBE vv_obras',len(obras),'actualizado',o[0].get('updated_at') if o else None,'ts',t[0]['value'] if t else None)
          for x in obras: print('  OBRA',x.get('id'),'|',x.get('nombre') or x.get('name'),'|',x.get('estado',''))
          tum=json.loads(d[0]['value']) if d and d[0].get('value') else {}
          print('TUMBAS',len(tum))
          for k,v in sorted(tum.items(),key=lambda kv:kv[1])[-25:]: print('  DEL',k,datetime.datetime.utcfromtimestamp(v/1000).isoformat() if isinstance(v,(int,float)) else v)
          ids={x.get('id') for x in obras}
          for f,lab in (('r.json','RESPALDO'),('b.json','BAK')):
            for r in sorted(L(f),key=lambda r:r['key']):
              try: arr=json.loads(r['value'])
              except: continue
              falt=[ (x.get('id'),x.get('nombre') or x.get('name')) for x in arr if x.get('id') not in ids]
              print(lab,r['key'],'obras',len(arr),'faltan hoy',falt)
          PY
