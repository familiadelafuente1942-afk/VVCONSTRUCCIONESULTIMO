name: web-vv-fotos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar las fotos de la web vieja de V+V
        run: |
          set -e
          mkdir -p public/web/img
          B="https://ee49b3883c.clvaw-cdnwnd.com/c2ebebd1ca6c6bfa12bfd005fcf362fd"
          bajar(){ curl -sSL --fail -A "Mozilla/5.0" -o "public/web/img/$1" "$B/$2?ph=ee49b3883c" && echo "ok $1" || echo "FALLO $1"; }
          bajar portada.jpg "200000530-8961c8961e/WhatsApp%20Image%202021-08-03%20at%2014.26.10.jpeg"
          bajar nosotros.jpg "200000488-cccabcccaf/image-crop-200000484.jpeg"
          bajar porfolio.jpg "200000489-8ba7e8ba83/image-crop-200000487.jpeg"
          bajar mayling.jpg "200001205-2518625189/Imagen%20de%20WhatsApp%202024-07-08%20a%20las%2011.13.08_9e33793d.jpeg"
          bajar albanueva.jpg "200001207-9725e97261/Imagen%20de%20WhatsApp%202024-07-08%20a%20las%2011.23.37_96f05a29.jpeg"
          bajar pacheco.jpg "200001211-432f6432f9/Imagen%20de%20WhatsApp%202024-07-08%20a%20las%2011.40.27_4ae1656d.jpeg"
          bajar corea.jpg "200001209-c8e83c8e86/Imagen%20de%20WhatsApp%202024-07-08%20a%20las%2011.28.06_3d0bc00d.jpeg"
          bajar particulares.jpg "200000005-0c8540c856/IMG_4600.JPG"
          bajar barrios.jpg "200000055-10b9910b9b/edificio-uso-mixto-chile.jpg"
          bajar edificios.jpg "200000051-d2d3fd2d41/IMG_0135.jpg"
          bajar remodelaciones.jpg "200000054-0513b0513d/WhatsApp%20Image%202020-07-16%20at%2008.35.49.jpeg"
          bajar naves.jpg "200000052-b2ed6b2ed8/IMG_0137.jpg"
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in public/web/img/*.jpg; do convert "$f" -auto-orient -resize '1600x1600>' -quality 80 -strip "$f" || true; done
          ls -la public/web/img
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/web/img
          git commit -m "Web V+V: fotos de la web anterior" || echo "sin cambios"
          git push
