name: web-vv-fotos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar las fotos de la web vieja de V+V
        run: |
          set -e
          mkdir -p public/web/img
          B="https://ee49b3883c.clvaw-cdnwnd.com/c2ebebd1ca6c6bfa12bfd005fcf362fd"
          bajar(){ curl -sSL --fail -A "Mozilla/5.0" -o "public/web/img/$1" "$B/$2?ph=ee49b3883c" && echo "ok $1" || echo "FALLO $1"; }
          bajar e22-1.jpg "200000471-e3a27e3a29/IMG_0878.JPG"
          bajar e22-2.jpg "200000151-df7fedf801/IMG_1531.JPG"
          bajar e22-3.jpg "200000135-560d9560dc/IMG_0560.JPG"
          bajar terralagos-1.jpg "200001197-44a4044a43/KSKS.jpg"
          bajar terralagos-2.jpg "200001195-9b59f9b5a2/JEJEW.jpg"
          bajar terralagos-3.jpg "200001199-30b4530b49/JSKS.jpg"
          yt(){ curl -sSL --fail -o "public/web/img/$1" "https://img.youtube.com/vi/$2/hqdefault.jpg" && echo "ok $1" || echo "FALLO $1"; }
          yt video-e22.jpg lDGgzu1nnvM
          yt video-g5.jpg m85tuLKKw_A
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in public/web/img/e22-*.jpg public/web/img/terralagos-*.jpg public/web/img/video-*.jpg; do convert "$f" -auto-orient -resize '1600x1600>' -quality 80 -strip "$f" || true; done
          ls -la public/web/img
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/web/img
          git commit -m "Web V+V: fotos de la web anterior" || echo "sin cambios"
          git push
