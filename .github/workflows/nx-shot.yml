name: nx-shot
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cronogramas recuperados vistos en la app publicada (solo lectura)
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1280,height:900}});const er=[];p.on('pageerror',e=>er.push(e.message));
          await p.route('**/api/nexo2',async r=>{if(r.request().method()!=='POST')return r.continue();return r.fulfill({json:{ok:false,error:'solo lectura'}})});
          await p.goto('https://nexoentorno.vercel.app/nexo2.html',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForTimeout(15000);await p.reload({waitUntil:'domcontentloaded'});await p.waitForTimeout(15000);
          const r=await p.evaluate(()=>['o2','o3','o4','o7269','o4541','o7688'].map(id=>{const o=OBRAS.find(x=>x.id===id);if(!o)return id+' no está';let fin='';try{fin=fmt(finObra(o))}catch(e){fin='error'}return `${id} ${o.nombre} · sinCrono ${o.sinCrono} · tareas ${o.tasks.length} · con avance ${o.tasks.filter(t=>t.real).length} · tarjetas ${o.cards.length} · fin ${fin}`}));
          r.forEach(l=>console.log('OBRA',l));
          for(const [rol,u] of [['jefe',{rol:'jefe',name:'Facundo'}],['auditor',{rol:'auditor',name:'Auditoría'}],['direccion',{rol:'direccion',name:'Dirección'}]]){
            await p.evaluate(([u])=>{S.u=u;S.mias=['o3'];S.audObras=['o3'];S.obra='o3';S.tab='obra';S.otab='crono';try{draw()}catch(e){}},[u]);await p.waitForTimeout(1500);
            const tx=await p.evaluate(()=>{const g=document.querySelector('#gwrap');return (g?g.innerText:document.body.innerText).slice(0,300).replace(/\s+/g,' ')});console.log('VISTA',rol,'·',tx.slice(0,200));
            if(rol==='jefe')await p.screenshot({path:'golf293_jefatura.png'});}
          console.log('ERRORES',er.slice(0,5));await b.close()})();
          JS
          node t.cjs
      - uses: actions/upload-artifact@v4
        with: { name: captura, path: golf293_jefatura.png, retention-days: 1 }
