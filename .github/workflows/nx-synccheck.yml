name: nx-synccheck
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Probar la sincronización de NEXO 2 con los datos reales (sin escribir en la nube, sin montos)
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1180,height:820}});const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text().slice(0,200))});
          const posts=[];let last=null,lastT=0;
          await p.route('**/api/nexo2',async r=>{const q=r.request();if(q.method()!=='POST'){if(!last)return r.continue();const g=await (await fetch('https://nexoentorno.vercel.app/api/nexo2',{cache:'no-store'})).json();g.cfg={t:lastT,v:last};return r.fulfill({json:g})}let j={};try{j=JSON.parse(q.postData()||'{}')}catch(e){}
            if(j.key==='cfg'&&typeof j.v==='string'){let dif=[];try{const A=last?JSON.parse(last):null,B=JSON.parse(j.v);const walk=(a,b,pa,d)=>{if(dif.length>12)return;if(JSON.stringify(a)===JSON.stringify(b))return;if(d>5||typeof a!=='object'||typeof b!=='object'||!a||!b){dif.push(pa);return}new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>walk(a[k],b[k],pa+'.'+k,d+1))};if(A)walk(A,B,'cfg',0)}catch(e){dif=['err '+e.message]}
              let av='';try{const B=JSON.parse(j.v);const L=B.avisos||[];const z=L[L.length-1];av=z?(z.to+' | '+String(z.txt||'').replace(/\d/g,'#').slice(0,90)+' | '+String(z.id).slice(0,6)):''}catch(e){}lastT=j.t;posts.push({t:Date.now(),kb:Math.round(j.v.length/1000),dif:[...dif,'ULTIMO_AVISO: '+av]});last=j.v;return r.fulfill({json:{ok:true,t:j.t}})}
            return r.fulfill({json:{ok:false,error:'bloqueado en la prueba'}})});
          await p.goto('https://nexoentorno.vercel.app/nexo2.html',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForTimeout(40000);
          const st=await p.evaluate(()=>{const S=window.__sync||{};const i=document.querySelector('.nxi');return {est:S.est,ocupado:S.ocupado,ind:i&&i.textContent,online:navigator.onLine}});
          console.log('ESTADO',JSON.stringify(st));console.log('POSTS',posts.length);posts.forEach((x,k)=>console.log('POST',k,'kb',x.kb,'cambia',x.dif.join(' ')));console.log('ERRORES',JSON.stringify(errs.slice(0,15)));await b.close()})();
          JS
          node t.js
