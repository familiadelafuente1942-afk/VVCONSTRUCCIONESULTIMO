name: nx-raw
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Estado del registro cfg (solo lectura, sin montos)
        run: |
          curl -s 'https://nexoentorno.vercel.app/api/nexo2' -o c.json
          python3 - <<'PY'
          import json
          j=json.load(open('c.json'));print('CLAVES_GET',list(j.keys()))
          c=j['cfg'];v=c['v'];print('CFG t',c['t'],'largo v',len(v),'bytes utf8',len(v.encode()))
          C=json.loads(v);print('TOP',[(k,len(json.dumps(C[k],ensure_ascii=False,separators=(',',':')).encode())) for k in C])
          def info(id,e):
            sz=lambda x:len(json.dumps(x,ensure_ascii=False,separators=(',',':')).encode())
            print('OBRA',id,e.get('nombre',''),'total',sz(e),'resp',sz(e.get('resp',[])),'n_resp',len(e.get('resp',[]) or []),'baseOv',sz(e['baseOv']) if 'baseOv' in e else '-','ov',sz(e.get('ov',{})),'ov.r',len((e.get('ov') or {}).get('r') or {}),'tpl',e.get('tpl'),'sinCrono',e.get('sinCrono','(no)'),'cg',e.get('cg'),'cgu',e.get('cgu'),'mod2',bool(e.get('mod2')),'plantilla',(e.get('mod2') or {}).get('plantilla'))
          for id,e in (C.get('mod') or {}).items():info(id,e)
          for e in C.get('nuevas') or []:info(e.get('id'),e)
          PY
