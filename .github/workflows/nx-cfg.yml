name: nx-cfg
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Estado de la configuración de NEXO 2 (obras, sin montos)
        run: |
          curl -s https://nexoentorno.vercel.app/api/nexo2 > c.json
          python3 - <<'PY'
          import json,datetime
          d=json.load(open('c.json')); c=d.get('cfg') or {}
          v=c.get('v') or ''
          print('CFG_T',c.get('t'),datetime.datetime.utcfromtimestamp((c.get('t') or 0)/1000).isoformat(),'TAMANO_KB',len(v)//1000)
          o=json.loads(v) if v else {}
          print('CLAVES',sorted(o.keys()))
          for x in o.get('nuevas',[]) or []: print('NUEVA',x.get('id'),'|',x.get('nombre'),'| tpl' if x.get('tpl') else '','| kb',len(json.dumps(x))//1000)
          for k,ch in (o.get('mod') or {}).items(): print('MOD',k,'|',ch.get('nombre',''),'| claves',len(ch),'| kb',len(json.dumps(ch))//1000)
          print('DEL',o.get('del'),'DELN',o.get('delN'))
          for src in [('mod',k,ch) for k,ch in (o.get('mod') or {}).items()]+[('nueva',x.get('id'),x) for x in (o.get('nuevas') or [])]:
            ov=(src[2] or {}).get('ov') or {}
            for k2,dv in (ov.get('dc') or {}).items(): print('DOC',src[1],'|',dv.get('n'),'| rev',dv.get('v'),'|',dv.get('e'),'|',dv.get('p'),'|',dv.get('f'),'| nube' if dv.get('u') else '| sin archivo en nube')
            if ov.get('xdc'): print('DOC_BORRADOS',src[1],len(ov.get('xdc')))
            for ck,cv in (ov.get('c') or {}).items():
              for ik,iv in (cv.get('i') or {}).items():
                if isinstance(iv,list) and len(iv)>8 and (iv[8]=='manual' or (iv[1] or 0)>1795000000000): print('PEDIDO',src[1],'| card',cv.get('tp'),'| enviada',cv.get('e'),'| tarea',cv.get('tk'),'| estado',iv[0],'| resp',iv[3],'| origen',iv[8],'|',str(iv[5])[:90])
            for pk,pv in (ov.get('p') or {}).items():
              if pv.get('m'): print('SLOT_MANUAL',src[1],'|',pv.get('n'),'|',pv.get('f'))
          print('AVISOS',len(o.get('avisos') or []))
          big=sorted(((k,len(json.dumps(val))) for k,val in o.items()),key=lambda t:-t[1])[:8]; print('MAS_PESADO',big)
          PY
