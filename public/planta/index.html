<script>
/* ===================== NEXO · PLANTA =====================
   Gestión industrial genérica: del ingreso del pedido a la expedición.
   Un solo documento sincronizado entre equipos (unión por registro: nunca se pisan los cambios de otro equipo). */
const API='/api/nexo2',APP='industria',LSK='planta_db',LSU='planta_yo';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>Math.round(Number(n)||0).toLocaleString('es-AR');
const num=v=>Number(String(v==null?'':v).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0;
const hoy=()=>new Date(Date.now()-3*36e5).toISOString().slice(0,10);
const fD=f=>f?f.split('-').reverse().join('/'):'—';
const fT=t=>t?new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'';
const dias=f=>f?Math.round((Date.parse(f+'T12:00:00-03:00')-Date.parse(hoy()+'T12:00:00-03:00'))/864e5):null;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(4,'0');

/* ---------- íconos (gemas de vidrio) ---------- */
const IC={inicio:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',pedidos:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="17" x2="13" y2="17"/>',prod:'<path d="M2 20h20V9l-6 4V9l-6 4V5H2z"/>',inc:'<path d="M12 3l9.5 16.5h-19z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',mas:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',caja:'<path d="M21 16V8l-9-5-9 5v8l9 5z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/>',camion:'<rect x="1" y="6" width="14" height="10"/><path d="M15 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',carro:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',ok:'<polyline points="4 12 10 18 20 6"/>',lupa:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',volver:'<polyline points="15 18 9 12 15 6"/>',agregar:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/>',cam:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/>',lapiz:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',calidad:'<path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
const gi=n=>`<span class="gi">${svg(n)}</span>`;

/* ---------- etapas del pedido ---------- */
const ET=[['ingreso','Ingreso','Ventas'],['plan','Planificación','Gerencia'],['prod','Producción','Producción'],['cal','Calidad','Calidad'],['dep','Depósito','Depósito'],['exp','Expedición','Expedición'],['ent','Entregado','—']];
const etIdx=k=>ET.findIndex(e=>e[0]===k);
const SECT=['Gerencia','Ventas','Compras','Producción','Calidad','Depósito','Expedición'];
const MOTIVOS={insumo:'Falta insumo / materia prima',maquina:'Máquina parada / falla',personal:'Falta de personal',calidad:'Problema de calidad',cliente:'Cambio del cliente',otro:'Otro motivo'};

/* ---------- datos ---------- */
const VACIO=()=>({_t:0,cfg:{u:0,empresa:'Mi empresa',pin:''},seq:{ped:0,inc:0,rem:0,com:0},pedidos:[],incid:[],stock:[],compras:[],clientes:[],productos:[],lineas:[],del:{}});
let DB=VACIO();try{const x=JSON.parse(localStorage.getItem(LSK)||'null');if(x&&x.pedidos)DB=Object.assign(VACIO(),x)}catch(e){}
let YO=null;try{YO=JSON.parse(localStorage.getItem(LSU)||'null')}catch(e){}
const COLS=['pedidos','incid','stock','compras','clientes','productos','lineas'];
function unir(a,b){/* une b dentro de a por registro: el cambio más nuevo (u) gana; lo borrado (del) no vuelve */
 const out=Object.assign(VACIO(),a);out.del=Object.assign({},a.del||{},b.del||{});
 for(const c of COLS){const m=new Map();for(const r of (a[c]||[]))m.set(r.id,r);for(const r of (b[c]||[])){const x=m.get(r.id);if(!x||(r.u||0)>(x.u||0))m.set(r.id,r)}out[c]=[...m.values()].filter(r=>!out.del[r.id])}
 for(const k of ['ped','inc','rem','com'])out.seq[k]=Math.max((a.seq||{})[k]||0,(b.seq||{})[k]||0);
 out.cfg=((b.cfg||{}).u||0)>((a.cfg||{}).u||0)?b.cfg:a.cfg;out._t=Math.max(a._t||0,b._t||0);return out}
const toca=r=>{r.u=Date.now();return r};
function guardarLocal(){try{localStorage.setItem(LSK,JSON.stringify(DB))}catch(e){toast('No se pudo guardar en este equipo','bad')}}
let _sy=0,SYNC={ok:0,err:'',pend:false};try{SYNC.pend=localStorage.getItem('planta_pend')==='1'}catch(e){}
const marcaPend=v=>{SYNC.pend=v;try{localStorage.setItem('planta_pend',v?'1':'0')}catch(e){}};
function save(){DB._t=Date.now();guardarLocal();marcaPend(true);clearTimeout(_sy);_sy=setTimeout(sync,700);estado()}
async function post(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,app:APP})});let j={};try{j=await r.json()}catch(e){}return {s:r.status,j}}
let _syncing=false;
async function sync(push){if(_syncing)return;_syncing=true;try{
 const g=await post({op:'pc_get'});if(g.s!==200)throw new Error('sin conexión');
 const rem=g.j.doc&&g.j.doc.v?JSON.parse(g.j.doc.v):null;const antes=JSON.stringify(DB);
 if(rem)DB=unir(DB,rem);
 const cambioRemoto=JSON.stringify(DB)!==antes;
 if(SYNC.pend||!rem){DB._t=Date.now();const p=await post({op:'pc_put',v:JSON.stringify(DB),t:DB._t});
  if(p.s===409&&p.j.doc){DB=unir(DB,JSON.parse(p.j.doc.v));DB._t=Date.now();await post({op:'pc_put',v:JSON.stringify(DB),t:DB._t})}else if(p.s!==200)throw new Error(p.j.error||'error al guardar')}
 marcaPend(false);SYNC.ok=Date.now();SYNC.err='';guardarLocal();if(cambioRemoto)redibujar()}
 catch(e){SYNC.err=e.message||'sin conexión'}finally{_syncing=false;estado()}}
function redibujar(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)){_redPend=true;return}if(!$('.modal'))draw()}
let _redPend=false;document.addEventListener('focusout',()=>setTimeout(()=>{if(_redPend&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){_redPend=false;if(!$('.modal'))draw()}},300));
setInterval(()=>{if(document.visibilityState==='visible')sync()},10000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
window.addEventListener('online',()=>sync());
function estado(){const e=$('#estado');if(!e)return;if(!navigator.onLine||SYNC.err){e.textContent='Sin conexión · lo cargado se guarda en este equipo y se sube solo';e.style.color='var(--warn)';return}e.style.color='var(--mut)';e.textContent=SYNC.pend?'Actualizando…':SYNC.ok?'Actualizado hace '+Math.max(0,Math.round((Date.now()-SYNC.ok)/1000))+' s':'Actualizando…'}
setInterval(estado,1000);
let _tt;function toast(t,c){const e=$('#toast');e.textContent=t;e.style.background=c==='bad'?'var(--bad)':'var(--ok)';e.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>e.style.display='none',3500)}
const hist=(r,tx)=>{(r.hist=r.hist||[]).push({t:Date.now(),por:YO?YO.nombre+' ('+YO.sector+')':'',tx})};

/* ---------- archivos y fotos (al servidor; en la base solo queda el enlace) ---------- */
async function subir(file,pref){let blob=file,name=file.name||'archivo';
 if(/^image\//.test(file.type)&&!/gif/.test(file.type)){try{const img=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=r.result};r.onerror=ko;r.readAsDataURL(file)});const M=1500,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));name='foto.jpg'}catch(e){}}
 const u=await post({op:'bar_up_url',pref:pref||'adj',name,size:blob.size});if(u.s!==200||!u.j.up)throw new Error(u.j.error||'No se pudo subir');
 const x=await fetch(u.j.up,{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});if(!x.ok)throw new Error('No se pudo subir');return u.j.pub||u.j.url}
async function subirFotos(files,arr,max){const fs=[...files].slice(0,(max||10)-arr.length);toast('Subiendo '+fs.length+' foto'+(fs.length>1?'s':'')+'…');for(const f of fs){try{arr.push(await subir(f,'fot'))}catch(e){toast(e.message,'bad');break}}}
const fotosHtml=(arr,del)=>(arr||[]).length?`<div class="fotos">${arr.map((u,k)=>`<div style="position:relative"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>${del?`<button data-fdel="${del}:${k}" aria-label="Quitar foto" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#c8463e;color:#fff;font-weight:700;line-height:22px;padding:0">✕</button>`:''}</div>`).join('')}</div>`:'';

/* ---------- semáforo de cada pedido ---------- */
function incAb(p){return DB.incid.filter(i=>i.ped===p.id&&i.estado!=='cerrada')}
function sem(p){if(p.etapa==='ent')return ['var(--ok)','Entregado'];const d=dias(p.entrega),ab=incAb(p);
 if(d!==null&&d<0)return ['var(--bad)','Atrasado '+(-d)+' día'+(d===-1?'':'s')];
 if(ab.some(i=>!i.resp||!i.resp.length))return ['var(--bad)','Incidencia sin respuesta'];
 if(ab.length)return ['var(--warn)','Incidencia abierta'];
 if(d!==null&&d<=2&&etIdx(p.etapa)<4)return ['var(--warn)','Entrega en '+d+' día'+(d===1?'':'s')];
 return ['var(--ok)','En término']}
const prodHecho=p=>(p.avance||[]).reduce((s,a)=>s+num(a.cant),0);
const prodTotal=p=>(p.items||[]).reduce((s,i)=>s+num(i.cant),0);
const pedNom=p=>'Pedido N° '+p.num+(p.cliente?' · '+p.cliente:'');

/* ---------- navegación ---------- */

const go=(tab,sub,id)=>{V.tab=tab;V.sub=sub||null;V.id=id||null;draw();scrollTo(0,0)};
function nav(){const ia=DB.incid.filter(i=>i.estado!=='cerrada'&&!(i.resp||[]).length).length;const mios=YO?misPend().length:0;
 const b=[['inicio','Inicio','inicio',mios],['pedidos','Pedidos','pedidos',0],['prod','Producción','prod',0],['inc','Incidencias','inc',ia],['mas','Más','mas',0]];
 return `<nav class="nav">${b.map(([k,t,i,n])=>`<button data-tab="${k}" class="${V.tab===k?'on':''}">${svg(i)}${t}${n?`<span class="bdg">${n}</span>`:''}</button>`).join('')}</nav><button id="ia" aria-label="Planta IA">IA</button>`}
function misPend(){if(!YO)return[];const s=YO.sector;if(s==='Gerencia')return DB.pedidos.filter(p=>p.etapa==='plan');return DB.pedidos.filter(p=>p.etapa!=='ent'&&(ET[etIdx(p.etapa)]||[])[2]===s).concat(s==='Compras'?[]:[])}

 $('#app').innerHTML=T()+nav();ligar()}

function vIngreso(){return `<div style="text-align:center;margin:30px 0 10px"><img src="/planta/icon-192.png" alt="" style="width:76px;height:76px;border-radius:18px"><div class="eyebrow" style="margin-top:14px">Nexo · Planta</div><h1 style="margin-top:6px">Del pedido a la expedición</h1><p class="mut">Cada sector carga lo suyo desde el celular y la gerencia ve todo en tiempo real.</p></div>
 <div class="card"><label style="margin-top:0">Tu nombre</label><input id="yo-n" placeholder="Ej: Martín" autocomplete="name"><label>¿En qué sector trabajás?</label><select id="yo-s">${SECT.map(s=>`<option>${s}</option>`).join('')}</select><div id="yo-pinw" style="display:none"><label>Clave de gerencia</label><input id="yo-p" type="password" inputmode="numeric" placeholder="${DB.cfg.pin?'La clave de gerencia':'Elegí una clave para gerencia'}"></div><div class="err" id="yo-e"></div><button class="btn gold full" style="margin-top:14px" id="yo-ok">Entrar</button></div>`}

function vInicio(){const P=DB.pedidos,cur=P.filter(p=>p.etapa!=='ent'),atr=cur.filter(p=>(dias(p.entrega)??1)<0),semana=cur.filter(p=>{const d=dias(p.entrega);return d!==null&&d>=0&&d<=7}),ia=DB.incid.filter(i=>i.estado!=='cerrada'),bajo=DB.stock.filter(s=>s.min&&num(s.cant)<num(s.min)),mios=misPend();
 const porEt=ET.slice(0,6).map(e=>[e[1],cur.filter(p=>p.etapa===e[0]).length]);
 return `<div class="top"><div><div class="eyebrow">${esc(DB.cfg.empresa)}</div><h1>Hola, ${esc(YO.nombre)}</h1><div class="mut sm">${esc(YO.sector)} · ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
 <div class="g2"><div class="kpi" data-go="pedidos:curso"><b>${cur.length}</b><span>Pedidos en curso</span></div><div class="kpi" data-go="pedidos:atr"><b style="color:${atr.length?'var(--bad)':'var(--ok)'}">${atr.length}</b><span>Atrasados</span></div><div class="kpi" data-go="inc"><b style="color:${ia.length?'var(--warn)':'var(--ok)'}">${ia.length}</b><span>Incidencias abiertas</span></div><div class="kpi" data-go="pedidos:semana"><b>${semana.length}</b><span>Se entregan esta semana</span></div></div>
 ${mios.length?`<h2 style="margin:18px 0 4px">Tu bandeja · ${esc(YO.sector)}</h2><div class="mut sm">Pedidos que esperan algo de tu sector.</div>${mios.map(cardPed).join('')}`:''}
 ${atr.length?`<h2 style="margin:18px 0 4px">Atrasados</h2>${atr.map(cardPed).join('')}`:''}
 ${ia.length?`<h2 style="margin:18px 0 4px">Incidencias abiertas</h2>${ia.slice(0,5).map(cardInc).join('')}`:''}
 ${bajo.length?`<h2 style="margin:18px 0 4px">Stock bajo el mínimo</h2><div class="card">${bajo.map(s=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(s.nombre)}</span><b style="color:var(--bad)">${N(s.cant)} / mín ${N(s.min)} ${esc(s.unidad||'')}</b></div>`).join('')}</div>`:''}
 ${cur.length?`<h2 style="margin:18px 0 4px">Pedidos por etapa</h2><div class="card">${torta(porEt)}</div>`:''}
 ${!P.length?`<div class="card"><h3>Empezá cargando un pedido</h3><p class="mut sm">Entrá a <b>Pedidos</b> y tocá “Nuevo pedido”. Podés subir la orden de compra del cliente (PDF o foto) y la IA la carga sola.</p><button class="btn gold full" data-act="nuevo-ped">${gi('agregar')}Nuevo pedido</button><button class="btn full" style="margin-top:8px" data-act="demo">Cargar datos de ejemplo (para probar)</button></div>`:''}`}

function torta(datos){const tot=datos.reduce((s,d)=>s+d[1],0)||1,C=['#b8915a','#6fa8e0','#4fa86f','#e0894f','#9b7fd1','#d9605a'];let a=0;const seg=datos.map((d,i)=>{const f=d[1]/tot;if(!d[1])return '';const a0=a;a+=f;if(f>=.999)return `<circle cx="50" cy="50" r="40" fill="${C[i]}"/>`;const p=t=>[50+40*Math.sin(2*Math.PI*t),50-40*Math.cos(2*Math.PI*t)];const [x0,y0]=p(a0),[x1,y1]=p(a);return `<path d="M50 50L${x0} ${y0}A40 40 0 ${f>.5?1:0} 1 ${x1} ${y1}z" fill="${C[i]}"/>`}).join('');
 return `<div class="row" style="gap:16px;flex-wrap:nowrap"><svg viewBox="0 0 100 100" style="width:120px;height:120px;flex:none">${seg}<circle cx="50" cy="50" r="22" fill="var(--bg)"/><text x="50" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" font-family="Playfair Display,Georgia,serif">${tot}</text></svg><div class="f1">${datos.map((d,i)=>`<div class="row sm" style="justify-content:space-between;flex-wrap:nowrap;padding:2px 0"><span><i class="sem" style="background:${C[i]};margin-right:6px"></i>${d[0]}</span><b>${d[1]}</b></div>`).join('')}</div></div>`}

function cardPed(p){const [c,t]=sem(p),tot=prodTotal(p),h=prodHecho(p),e=ET[etIdx(p.etapa)];
 return `<div class="card click" data-ped="${p.id}" style="border-left:4px solid ${c}!important"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>N° ${esc(p.num)} · ${esc(p.cliente||'Sin cliente')}</b><span class="pill" style="color:${c}">${esc(t)}</span></div>
 <div class="mut sm" style="margin-top:2px">${esc((p.items||[]).map(i=>N(i.cant)+' '+(i.unidad||'')+' '+i.prod).join(' · ').slice(0,120))}</div>
 <div class="steps">${ET.slice(0,6).map((x,i)=>`<i class="${i<etIdx(p.etapa)||p.etapa==='ent'?'ok':i===etIdx(p.etapa)?'ac':''}"></i>`).join('')}</div>
 <div class="row sm" style="justify-content:space-between"><span><b>${esc(e?e[1]:'')}</b>${p.etapa==='prod'&&tot?' · '+Math.round(h/tot*100)+'% producido':''}</span><span class="mut">Entrega ${fD(p.entrega)}</span></div></div>`}
function cardInc(i){const p=DB.pedidos.find(x=>x.id===i.ped),r=(i.resp||[]).length,c=i.estado==='cerrada'?'var(--mut)':r?'var(--ok)':'var(--bad)';
 return `<div class="card click" data-inc="${i.id}" style="border:2px solid ${c}!important"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>N° ${esc(i.num)} · ${esc(i.titulo)}</b><span class="pill" style="color:${c}">${i.estado==='cerrada'?'Cerrada':r?'Respondida':'Sin respuesta'}</span></div><div class="mut sm">${esc(MOTIVOS[i.tipo]||i.tipo)} · ${esc(i.sector||'')}${p?' · '+esc(pedNom(p)):''} · ${fT(i.t)}</div></div>`}

function vPedidos(){if(V.sub==='nuevo')return vPedForm();if(V.id)return vPedido();
 const F={curso:['En curso',p=>p.etapa!=='ent'],atr:['Atrasados',p=>p.etapa!=='ent'&&(dias(p.entrega)??1)<0],semana:['Esta semana',p=>{const d=dias(p.entrega);return p.etapa!=='ent'&&d!==null&&d>=0&&d<=7}],...Object.fromEntries(ET.map(e=>[e[0],[e[1],p=>p.etapa===e[0]]])),todos:['Todos',()=>true]};
 const q=V.q.toLowerCase(),L=DB.pedidos.filter((F[V.f]||F.curso)[1]).filter(p=>!q||JSON.stringify([p.num,p.cliente,p.oc,p.items]).toLowerCase().includes(q)).sort((a,b)=>String(a.entrega||'9').localeCompare(String(b.entrega||'9')));
 return `<div class="top"><h1>Pedidos</h1></div><button class="btn gold full" data-act="nuevo-ped">${gi('agregar')}Nuevo pedido</button>
 <input id="q" placeholder="Buscar por cliente, número, producto…" value="${esc(V.q)}" style="margin-top:10px">
 <div class="chips" style="margin-top:8px">${Object.entries(F).map(([k,v])=>`<button class="chip ${V.f===k?'on':''}" data-f="${k}">${v[0]} ${DB.pedidos.filter(v[1]).length}</button>`).join('')}</div>
 ${L.length?L.map(cardPed).join(''):'<p class="mut">No hay pedidos en esta vista.</p>'}`}

let FP=null;
function vPedForm(){const f=FP;return `<button class="btn sm" data-act="volver">${gi('volver')}Volver</button><h1 style="margin-top:10px">${f.id?'Editar pedido N° '+esc(f.num):'Nuevo pedido'}</h1>
 ${!f.id?`<label class="btn full" style="margin-top:12px;cursor:pointer" id="oc-lbl">📄 Leer la orden de compra del cliente (PDF o foto)<input type="file" accept="application/pdf,image/*" id="oc-f" hidden></label><div class="mut xs" style="margin-top:4px">La IA completa cliente, productos, cantidades y fecha. Revisalo antes de guardar.</div>`:''}
 <label>Cliente</label><input id="pf-cli" list="dl-cli" value="${esc(f.cliente)}" placeholder="Nombre del cliente"><datalist id="dl-cli">${DB.clientes.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist>
 <div class="g2"><div><label>N° de orden del cliente</label><input id="pf-oc" value="${esc(f.oc)}" placeholder="Opcional"></div><div><label>Prioridad</label><select id="pf-pri">${['Normal','Alta','Urgente'].map(x=>`<option${f.prioridad===x?' selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="g2"><div><label>Fecha del pedido</label><input type="date" id="pf-fe" value="${esc(f.fecha)}"></div><div><label>Fecha de entrega comprometida</label><input type="date" id="pf-en" value="${esc(f.entrega)}"></div></div>
 <h3 style="margin-top:16px">Productos</h3>
 ${f.items.map((it,i)=>`<div class="card" style="padding:10px"><div class="row" style="flex-wrap:nowrap"><input class="f1" data-it="prod" data-i="${i}" list="dl-prod" value="${esc(it.prod)}" placeholder="Producto / artículo"><button class="btn sm" data-itdel="${i}" aria-label="Quitar">✕</button></div><div class="g2" style="margin-top:8px"><input data-it="cant" data-i="${i}" inputmode="numeric" class="miles" value="${it.cant?N(it.cant):''}" placeholder="Cantidad"><input data-it="unidad" data-i="${i}" value="${esc(it.unidad)}" placeholder="Unidad (u, kg, m…)"></div><input data-it="det" data-i="${i}" value="${esc(it.det||'')}" placeholder="Detalle: medida, color, especificación" style="margin-top:8px"></div>`).join('')}
 <datalist id="dl-prod">${DB.productos.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist>
 <button class="btn full" data-act="it-add">${gi('agregar')}Agregar producto</button>
 <label>Observaciones</label><textarea id="pf-obs" placeholder="Condiciones, embalaje, lugar de entrega…">${esc(f.obs||'')}</textarea>
 ${f.archivo?`<div class="sm" style="margin-top:8px">📎 <a href="${esc(f.archivo.u)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(f.archivo.n)}</a></div>`:''}
 <div class="err" id="pf-e"></div><button class="btn gold full" style="margin-top:14px" data-act="ped-ok">${f.id?'Guardar cambios':'Cargar pedido'}</button>`}
function leerPF(){const f=FP;if(!f)return;const g=id=>{const e=$(id);return e?e.value:''};if($('#pf-cli')){f.cliente=g('#pf-cli').trim();f.oc=g('#pf-oc').trim();f.prioridad=g('#pf-pri');f.fecha=g('#pf-fe');f.entrega=g('#pf-en');f.obs=g('#pf-obs')}

 return `<button class="btn sm" data-act="volver">${gi('volver')}Volver</button>
 <div class="card" style="border-left:4px solid ${c}!important"><div class="row" style="justify-content:space-between"><div class="eyebrow">Pedido N° ${esc(p.num)}${p.prioridad&&p.prioridad!=='Normal'?' · '+esc(p.prioridad):''}</div><span class="pill" style="color:${c}">${esc(t)}</span></div><h1 style="margin-top:6px">${esc(p.cliente||'Sin cliente')}</h1>
 <div class="mut sm">${p.oc?'OC '+esc(p.oc)+' · ':''}Pedido ${fD(p.fecha)} · <b style="color:var(--ink)">Entrega ${fD(p.entrega)}</b></div>
 <table class="t" style="margin-top:8px"><tr><th>Producto</th><th class="n">Cantidad</th></tr>${(p.items||[]).map(i=>`<tr><td>${esc(i.prod)}${i.det?`<div class="mut xs">${esc(i.det)}</div>`:''}</td><td class="n">${N(i.cant)} ${esc(i.unidad||'')}</td></tr>`).join('')}</table>
 ${p.obs?`<p class="sm">${esc(p.obs)}</p>`:''}${p.archivo?`<div class="sm">📎 <a href="${esc(p.archivo.u)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(p.archivo.n)}</a></div>`:''}
 <div class="steps">${ET.slice(0,6).map((x,i)=>`<i class="${i<k||p.etapa==='ent'?'ok':i===k?'ac':''}" title="${x[1]}"></i>`).join('')}</div>

 <h2 style="margin:16px 0 4px">Historial</h2><div class="hist">${(p.hist||[]).slice().reverse().map(x=>`<div><b>${esc(x.tx)}</b><div class="mut xs">${fT(x.t)} · ${esc(x.por||'')}</div></div>`).join('')}</div>
 ${YO.sector==='Gerencia'?`<button class="btn full rojo" style="margin-top:18px" data-act="ped-del">Borrar pedido</button>`:''}`}
const sec=(titulo,ico,activa,hecha,body)=>`<div class="card" style="${activa?'box-shadow:inset 0 0 0 2px var(--gold),0 12px 26px -12px var(--g-sh)!important':''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3 class="row" style="gap:8px">${gi(ico)}${titulo}</h3>${hecha?'<span class="pill" style="color:var(--ok)">✓ Listo</span>':activa?'<span class="pill" style="color:var(--gold)">Ahora</span>':'<span class="pill mut">Pendiente</span>'}</div>${body}</div>`;
function secPlan(p){const k=etIdx(p.etapa),o=p.op||{},act=p.etapa==='ingreso'||p.etapa==='plan';
 const mats=(p.mats||[]);
 return sec('Planificación','lapiz',act,k>1,act?`<div class="g2"><div><label>Línea / máquina</label><input id="op-li" list="dl-li" value="${esc(o.linea||'')}" placeholder="Ej: Línea 2"><datalist id="dl-li">${DB.lineas.map(l=>`<option value="${esc(l.nombre)}">`).join('')}</datalist></div><div><label>Turno</label><select id="op-tu">${['Mañana','Tarde','Noche','Todo el día'].map(x=>`<option${o.turno===x?' selected':''}>${x}</option>`).join('')}</select></div></div>

 <datalist id="dl-mp">${DB.stock.filter(s=>s.tipo==='mp').map(s=>`<option value="${esc(s.nombre)}">`).join('')}</datalist>
 <button class="btn sm" data-act="mt-add">${gi('agregar')}Agregar material</button> ${mats.some(m=>{const s=DB.stock.find(x=>x.nombre===m.mp);return m.mp&&(!s||num(s.cant)<num(m.cant))})?`<button class="btn sm rojo" data-act="mt-comprar">${gi('carro')}Pedir lo que falta a Compras</button>`:''}
 <button class="btn gold full" style="margin-top:12px" data-act="plan-ok">Liberar a producción</button>`:`<div class="sm">${esc(o.linea||'Sin línea')} · ${esc(o.turno||'')} · ${fD(o.inicio)} → ${fD(o.fin)}${o.resp?' · '+esc(o.resp):''}</div>${mats.length?`<div class="mut xs" style="margin-top:4px">Materiales: ${mats.map(m=>esc(m.mp)+' '+N(m.cant)).join(' · ')}</div>`:''}`)}

function abrirIA(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="hoja"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><div class="eyebrow">Planta IA</div><h2>Preguntame lo que quieras</h2></div><button class="btn sm" id="ia-x">Cerrar</button></div><div class="mut sm">Ej: “¿Qué pedidos están atrasados?”, “¿Cómo viene el pedido 0003?”, “¿Qué está frenado hoy y por qué?”</div><div id="ia-m" style="margin-top:10px"></div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="ia-t" class="f1" placeholder="Escribí o tocá el micrófono"><button class="btn" id="ia-mic" aria-label="Hablar">🎤</button><button class="btn gold" id="ia-s">Enviar</button></div></div>`;document.body.appendChild(m);
 const pint=()=>{$('#ia-m').innerHTML=CHAT.map(x=>`<div class="msg ${x.role==='user'?'yo':'ia'}">${esc(x.content)}</div>`).join('');const h=m.querySelector('.hoja');h.scrollTop=h.scrollHeight};pint();
 const cerrar=()=>{try{speechSynthesis.cancel()}catch(e){}m.remove()};$('#ia-x').onclick=cerrar;m.onclick=e=>{if(e.target===m)cerrar()};
 const env=async t=>{t=(t||$('#ia-t').value).trim();if(!t)return;$('#ia-t').value='';CHAT.push({role:'user',content:t});CHAT.push({role:'assistant',content:'…'});pint();
  try{const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:900,system:'Sos Planta IA, el asistente de una fábrica. Contestás en español rioplatense (vos), corto, claro y sin listas largas: la respuesta se lee en voz alta, a veces mientras la persona maneja. Usás SOLO estos datos de la app (no inventes): '+ctxIA()+'. Las cantidades van sin decimales y con separador de miles. Si algo no está en los datos, decilo.',messages:CHAT.slice(0,-1).slice(-12)})});const d=await r.json();const tx=((d.content||[]).find(c=>c.type==='text')||{}).text||(d.error&&d.error.message)||'No pude contestar.';CHAT[CHAT.length-1].content=tx;pint();if(VOZ)hablar(tx)}catch(e){CHAT[CHAT.length-1].content='Sin conexión: probá de nuevo.';pint()}};
 $('#ia-s').onclick=()=>env();$('#ia-t').onkeydown=e=>{if(e.key==='Enter')env()};
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('#ia-mic').onclick=()=>{if(!SR){toast('Este navegador no permite dictar: escribí la pregunta','bad');return}try{speechSynthesis.cancel()}catch(e){}const s=new SR();s.lang='es-AR';s.interimResults=false;$('#ia-mic').textContent='●';s.onresult=e=>{env(e.results[0][0].transcript)};s.onend=()=>{const b=$('#ia-mic');if(b)b.textContent='🎤'};s.start()};
 if(!CHAT.length&&SR){/* manos libres: si se abrió desde el auto, se puede hablar directo */}}
function hablar(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#_]/g,'').replace(/N° ?(\d+)/g,(m,n)=>'número '+Number(n)));u.lang='es-AR';const vs=speechSynthesis.getVoices(),v=vs.find(x=>/es[-_](AR|419|US|MX)/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang));if(v)u.voice=v;u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}

async function imgData(u){try{const b=await (await fetch(u)).blob();const i=await createImageBitmap(b);const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return {d:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height}}catch(e){return null}}
function nuevoPDF(titulo,sub){const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'}),W=210,M=14;d.setFillColor(20,20,24);d.rect(0,0,W,30,'F');d.setTextColor(184,145,90);d.setFont('helvetica','bold');d.setFontSize(10);d.text(sup(DB.cfg.empresa).toUpperCase()+' · '+sup(sub),M,12);d.setTextColor(255);d.setFontSize(17);d.text(sup(titulo),M,23);
 const o={d,W,M,y:40,lin(t,s,b,col){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(s||10.5);d.setTextColor(...(col||[30,30,30]));const L=d.splitTextToSize(sup(String(t)),W-2*M);for(const l of L){if(o.y>282){d.addPage();o.y=18}d.text(l,M,o.y);o.y+=(s||10.5)*.48}o.y+=1.2},fila(k,v){if(o.y>282){d.addPage();o.y=18}d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(110,105,95);d.text(sup(k),M,o.y);d.setFont('helvetica','normal');d.setTextColor(30,30,30);d.text(d.splitTextToSize(sup(String(v)),W-2*M-48),M+48,o.y);o.y+=6.2},
 pie(){const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(150);d.text('Generado con Nexo · Planta · '+new Date().toLocaleString('es-AR',{hour12:false})+' · '+i+'/'+n,M,292)}}};return o}
const sup=t=>String(t||'').replace(/[^\x00-\xFF€]/g,'');
async function compartir(blob,nombre,texto){const f=new File([blob],nombre,{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();toast('PDF descargado: adjuntalo en WhatsApp')}
async function fotosPDF(o,arr){const F=(arr||[]).slice(0,9);for(let r=0;r<F.length;r+=3){const fila=F.slice(r,r+3),cw=(o.W-2*o.M-6)/3;let hm=0;if(o.y+48>282){o.d.addPage();o.y=18}for(let k=0;k<fila.length;k++){const im=await imgData(fila[k]);if(!im)continue;const h=Math.min(46,cw*im.h/im.w);hm=Math.max(hm,h);o.d.addImage(im.d,'JPEG',o.M+k*(cw+3),o.y,cw,h)}o.y+=hm+4}}

 const t=prodTotal(p),h=prodHecho(p);if((p.avance||[]).length){o.y+=2;o.lin('Producción: '+N(h)+' de '+N(t)+(t?' ('+Math.round(h/t*100)+'%)':''),12,1);p.avance.slice(-10).forEach(a=>o.lin(fD(a.fecha)+' · '+N(a.cant)+' producidos · '+N(a.gente)+' personas'+(a.frenado?' · FRENADO: '+MOTIVOS[a.motivo]:'')+(a.nota?' · '+a.nota:''),9.5,0,a.frenado?[200,60,50]:[40,40,40]))}
 const inc=DB.incid.filter(i=>i.ped===p.id);if(inc.length){o.y+=2;o.lin('Incidencias',12,1);inc.forEach(i=>o.lin('N° '+i.num+' · '+i.titulo+' · '+(i.estado==='cerrada'?'cerrada':(i.resp||[]).length?'respondida':'SIN RESPUESTA'),9.5,0,i.estado!=='cerrada'&&!(i.resp||[]).length?[200,60,50]:[40,40,40]))}
 o.y+=2;o.lin('Historial',12,1);(p.hist||[]).forEach(x=>o.lin(fT(x.t)+' · '+x.tx+(x.por?' · '+x.por:''),9,0,[90,90,90]));await fotosPDF(o,(p.avance||[]).flatMap(a=>a.fotos||[]));o.pie();compartir(o.d.output('blob'),'Pedido-'+p.num+'.pdf')}
