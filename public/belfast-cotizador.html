/* Layout: app de una columna tipo celular; barra inferior distinta por rol; hojas deslizantes para detalle y formularios */
:root{
  --bg:#0d0e10; --surface:#16171a; --raise:#1d1f23; --line:#2a2c31; --fg:#ece8e1; --muted:#8f8b84;
  --gold:#b8915a; --gold-soft:rgba(184,145,90,.14);
  --verde:#3fa66b; --amarillo:#e0b43a; --naranja:#e5813a; --rojo:#e2493e; --ok:#5f6b66; --futuro:#3a3d43; --azul:#5b8fd6; --rosa:#9b7cf6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --tech:"Michroma","Barlow Condensed",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-family:var(--tech);letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--gold);font-weight:400}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;min-height:32px}
.who .rol{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-left:6px}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 14px;font-weight:600;text-align:center;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120b}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.full{width:100%}
.btn.wa{background:#1f6f45;border-color:#1f6f45;color:#fff}
.btn.red{background:rgba(226,73,62,.14);border-color:var(--rojo);color:#ffb3ad}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.chip.gold{border-color:#5a4a30;color:#e6cfa5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-rojo{background:var(--rojo)} .c-naranja{background:var(--naranja)} .c-amarillo{background:var(--amarillo)} .c-verde{background:var(--verde)} .c-ok{background:var(--ok)} .c-futuro{background:var(--futuro)}
.t-rojo{color:var(--rojo)} .t-naranja{color:var(--naranja)} .t-amarillo{color:var(--amarillo)} .t-verde{color:var(--verde)} .t-ok,.t-futuro{color:var(--muted)} .t-azul{color:var(--azul)}
.status{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;background:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--gold)}
.bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.irow:last-child{border-bottom:0}
.irow>span:first-child{min-width:0}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.entry .meta{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.entry.cambio{border-color:rgba(226,73,62,.6);box-shadow:inset 4px 0 0 var(--rojo)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed=true],.seg button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.group-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:6px}
.group-h .muted{font-size:12px}

/* acceso */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:8px 4px}
.login .logo{width:min(300px,78%);height:auto;mix-blend-mode:lighten}
.frase{font-family:var(--tech);font-size:clamp(15px,4.2vw,21px);line-height:1.6;letter-spacing:.06em;text-transform:uppercase;margin-top:12px;color:#efeae2}
.frase-rule{width:56px;height:1px;background:var(--gold);margin-top:6px}
.panels{display:flex;flex-direction:column;gap:12px}
.pcard{position:relative;min-height:190px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background-size:cover;background-position:center;padding:0;text-align:left;display:flex;align-items:flex-end;transition:transform .25s ease,border-color .25s}
.pcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.pshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.94) 0%,rgba(8,8,10,.78) 45%,rgba(8,8,10,.25) 100%)}
.pin{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px 24px;max-width:80%}
.peyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ptitle{font-family:var(--tech);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:#f3efe8;line-height:1.25}
.pdesc{font-size:13.5px;color:#c9c4bb;line-height:1.4}
.pgo{font-size:13px;color:var(--gold);font-weight:600;margin-top:4px}
.ucard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.ucard:hover{border-color:var(--gold)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--raise);border:1px solid #5a4a30;display:flex;align-items:center;justify-content:center;font-family:var(--tech);font-size:13px;color:var(--gold)}

/* estado de situación */
.situ{border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.situ::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde)}
.situ.s-crit::before{background:var(--rojo)} .situ.s-warn::before{background:var(--naranja)}
.situ-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(63,166,107,.15);color:var(--verde)}
.s-crit .pill{background:rgba(226,73,62,.15);color:#ff8f86} .s-warn .pill{background:rgba(229,129,58,.15);color:var(--naranja)}
.situ h1{font-size:28px}
.situ p{color:#c9c4bb;font-size:14px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;position:relative}
.kpi:hover{border-color:var(--gold)}
.kpi b{font-family:var(--display);font-size:24px;line-height:1.1}
.kpi .kl{font-size:12px;color:#c9c4bb;line-height:1.25}
.kpi .ks{font-size:11.5px;color:var(--muted)}
.kpi .kgo{position:absolute;top:8px;right:10px;font-size:12px;color:var(--gold)}
.kpi.k-rojo b{color:var(--rojo)} .kpi.k-verde b{color:var(--verde)} .kpi.k-naranja b{color:var(--naranja)}

/* obras: tira del inicio */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 4px 6px 4px}
.scard{scroll-snap-align:start;flex:0 0 46%;min-width:180px;max-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.scard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.scard .sb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.scard .sn{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.scard .sn b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sn span{font-family:var(--display);font-size:18px;color:var(--gold);font-weight:700}
.scard.locked{opacity:.45}

/* cartera */
.orow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.orow img{width:84px;height:60px;object-fit:cover;border-radius:8px;display:block}
.orow .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.orow .ohd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.orow .ohd b{font-size:15px}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ogrid>span{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.ogrid>span>span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ogrid b{font-size:13.5px;font-weight:600}
.orow.locked{opacity:.5}
.lock{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* ficha de obra */
.ohead{display:flex;flex-direction:column;gap:10px}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:14px;align-self:flex-start}
.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.hero2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hero2 .hs{position:relative;aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#000}.hero2 .hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}.hero2 .hs img.on{opacity:1}@media (min-width:700px){.hero2 .hs{aspect-ratio:4/3;max-height:42vh}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.fact span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--gold);font-weight:600}

/* avisos */
.aviso{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden}
.aviso .stripe{align-self:stretch}
.aviso .txt{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.aviso .t1{font-weight:600;line-height:1.25}
.aviso .t2{font-size:12.5px;color:var(--muted)}
.aviso .when{text-align:right;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.aviso .when b{font-family:var(--display);font-size:18px}
.origen{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}

/* gantt */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gantt{position:relative;font-size:12px}
.grow{display:flex;height:32px;align-items:center;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.glabel{position:sticky;left:0;z-index:2;width:140px;flex:none;padding:0 8px;background:var(--surface);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel.rubro{font-weight:600;color:var(--gold)}
.glabel.added::after{content:"nueva";margin-left:6px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);border:1px solid var(--azul);border-radius:4px;padding:0 3px}
.gtrack{position:relative;height:100%;flex:none}
.gseg{position:absolute;top:12px;height:8px;border-radius:2px}
.gexec{position:absolute;top:9px;height:14px;border-radius:3px;background:var(--fg);opacity:.85}
.gexec.done{background:var(--gold);opacity:.55}
.gbase{position:absolute;top:26px;height:2px;background:var(--azul);opacity:.9}
.ghito{position:absolute;top:10px;width:12px;height:12px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--bg)}
.gman{position:absolute;top:11px;width:10px;height:10px;transform:rotate(45deg);background:var(--azul);border:2px solid var(--bg);z-index:1}
.gsup{position:absolute;top:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--verde);background:var(--bg)}
.gsup.done{background:var(--verde)}
.gcert{position:absolute;top:10px;width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--rosa);background:var(--bg)}
.gcert.done{background:var(--rosa)}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--rojo);z-index:3;pointer-events:none}
.gmonths{display:flex;height:26px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:14px;height:8px;border-radius:2px;display:inline-block}
.modelbox{background:linear-gradient(160deg,#1b1915,#16171a);border:1px solid #5a4a30;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.params{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.params div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.params span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.params b{font-size:13.5px}

/* editor de cronograma */
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow .en{font-weight:600;font-size:14px}
.erow .ed{font-size:12px;color:var(--muted)}
.estep{display:flex;align-items:center;gap:6px}
.estep button,.edel{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
.estep b{min-width:44px;text-align:center;font-family:var(--display);font-size:17px}
.edel{color:#ff8f86}
.diff{font-size:12px}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .x{align-self:flex-end;border:0;background:var(--raise);border-radius:999px;width:32px;height:32px}
.tl{position:relative;height:34px}
.tl .seg2{position:absolute;top:8px;height:10px}
.tl .mark{position:absolute;top:2px;height:22px;border-left:2px dashed var(--rojo)}
.tl .lbl{position:absolute;top:22px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center}
.steps button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.steps small{font-size:10.5px;color:var(--muted)}
.impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.impact button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 6px;font-size:13px}
.impact button[aria-pressed=true]{border-color:var(--rojo);background:rgba(226,73,62,.14);font-weight:600}
.costbox{border:1px solid var(--rojo);background:rgba(226,73,62,.08);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.costbox b{font-family:var(--display);font-size:30px;color:var(--rojo);line-height:1.05}
.formula{font-family:var(--mono);font-size:12px;color:var(--muted)}
.typeseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.typeseg button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 6px;font-weight:600}
.typeseg button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:#f0dcb6}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 12px;font-size:13px}
.mats button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.infobox{border:1px solid #5a4a30;background:rgba(184,145,90,.08);border-radius:10px;padding:10px 12px;font-size:13px;color:#e6cfa5}
.req{display:flex;flex-direction:column;gap:6px}
.req div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.req .y{color:var(--verde);font-weight:700;width:16px;flex:none}
.req .n{color:var(--rojo);font-weight:700;width:16px;flex:none}
.tri{display:flex;gap:4px;flex:none}
.tri button{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:4px 8px;font-size:12px}
.tri button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.verdict{border-radius:12px;padding:12px 14px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em}
.v-apto{background:rgba(63,166,107,.12);border:1px solid var(--verde);color:var(--verde)}
.v-obs{background:rgba(224,180,58,.12);border:1px solid var(--amarillo);color:var(--amarillo)}
.v-no{background:rgba(226,73,62,.1);border:1px solid var(--rojo);color:var(--rojo)}
.tipos{display:flex;gap:6px;flex-wrap:wrap}
.tipos button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 12px;font-size:13px}
.tipos button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft)}
.tipos button.tc[aria-pressed=true]{border-color:var(--rojo);background:rgba(226,73,62,.16);color:#ffb3ad}
.tipos button.tc{color:#ff8f86}
.docrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:0}
.docrow .dn{font-size:14px;font-weight:600}
.docrow .dm{font-size:12px;color:var(--muted)}
.drop{border:1px dashed #5a4a30;border-radius:12px;padding:14px;text-align:center;color:#e6cfa5;font-size:13px}

/* informe */
.report{background:#f4f1ec;color:#1b1b1b;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.report h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7a5a2a}
.report ul{margin:0;padding-left:18px}
.report .rh{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #1b1b1b;padding-bottom:8px;flex-wrap:wrap}
.report .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.report .cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12.5px}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.foto{aspect-ratio:1;max-width:100%;border-radius:8px;background:repeating-linear-gradient(135deg,#2a2c31 0 10px,#24262a 10px 20px);display:flex;align-items:flex-end;padding:6px;font-size:11px;color:var(--muted);overflow:hidden;position:relative}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.report .foto{background:repeating-linear-gradient(135deg,#ddd8cf 0 10px,#e8e3da 10px 20px);color:#6b665e}

/* desempeño */
.rank{display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rcard.top1{border-color:var(--gold);background:linear-gradient(160deg,#1d1a14,#16171a)}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rpos{font-family:var(--tech);font-size:14px;color:var(--gold);width:28px}
.cards{display:flex;gap:3px;flex-wrap:wrap}
.cards i{width:9px;height:13px;border-radius:2px;display:inline-block}
.cards i.g{background:var(--verde)} .cards i.r{background:var(--rojo)}
.rmet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rmet div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.rmet span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rmet b{font-size:14px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.hbar .tr{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--verde)}

/* tabla de accesos */
.mwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.matrix{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
.matrix th,.matrix td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
.matrix .y{color:var(--verde);font-weight:700} .matrix .p{color:var(--amarillo)} .matrix .n{color:#55524d}

/* nexo ia */
.ia{background:linear-gradient(160deg,#1b1915,#141416);border:1px solid #5a4a30;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ia-head{display:flex;gap:12px;align-items:center}
.ia-head b{display:block;font-family:var(--tech);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:400}
.ia-head span{font-size:12.5px}
.ia-ico{width:36px;height:36px;border-radius:9px}
.ia-log{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.ia-log:empty{display:none}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.45;max-width:92%}
.msg p{margin:0 0 4px}.msg ul{margin:4px 0 0;padding-left:18px}.msg li{margin:2px 0}
.msg.user{align-self:flex-end;background:var(--gold);color:#16120b}
.msg.assistant{align-self:flex-start;background:var(--raise);border:1px solid var(--line)}
.ia-note{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.ia-sug{display:flex;flex-wrap:wrap;gap:6px}
.ia-sug button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;text-align:left}
.ia-form{display:flex;gap:8px}
.ia-form input{flex:1;min-width:0}

/* propietario */
.gallery{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.gallery .gcap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:13px;color:#eee;display:flex;justify-content:space-between}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs button{flex:0 0 76px;height:50px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none}
.thumbs button[aria-pressed=true]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.hitos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.hitos div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;text-align:center;color:var(--muted)}
.hitos i{height:6px;border-radius:999px;background:var(--line)}
.hitos .h-done i{background:var(--gold)} .hitos .h-now i{background:linear-gradient(90deg,var(--gold) 50%,var(--line) 50%)} .hitos .h-now{color:var(--fg);font-weight:600}
.tline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tline .ti{position:relative;padding:0 0 14px 16px}
.tline .ti::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tline .ti.done::before{background:var(--gold);border-color:var(--gold)}
.tline .ti.now::before{border-color:var(--gold)}
.tline b{font-size:14px}
.tline span{display:block;font-size:12.5px;color:var(--muted)}

/* barra inferior */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:640px;width:100%;display:flex}
nav.bottom button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.bottom button svg{width:20px;height:20px}
nav.bottom button[aria-current=page]{color:var(--gold)}
nav.bottom .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--rojo);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:600;line-height:16px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:440px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child{grid-column:span 2}.hitos{grid-template-columns:repeat(3,minmax(0,1fr))}.params{grid-template-columns:repeat(2,minmax(0,1fr))}.ogrid b{font-size:12.5px}.report .cols{grid-template-columns:1fr}}

/* ================= v4 ================= */
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#3a3d43;border-radius:999px}
*{scrollbar-color:#3a3d43 var(--bg);scrollbar-width:thin}
.t-gold{color:var(--gold)} .c-gold{background:var(--gold)}
.soft{color:#c9c4bb}
.bigpct{font-family:var(--display);font-size:40px;font-weight:700;color:var(--gold);line-height:1}
.filters.wrap{flex-wrap:wrap;overflow:visible}
.aviso.nuevo{border-color:var(--gold);background:linear-gradient(90deg,rgba(184,145,90,.16),var(--surface) 60%);box-shadow:0 0 0 1px rgba(184,145,90,.25)}
.badge.inl{display:inline-block;background:var(--gold);color:#16120b;border-radius:999px;font-size:12px;padding:0 7px;line-height:18px;vertical-align:middle;font-family:var(--body);font-weight:700}
.nov{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(184,145,90,.12),var(--surface));border:1px solid #5a4a30;border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.nov>span:nth-child(2){display:flex;flex-direction:column;gap:2px;min-width:0}
.nov b{font-weight:600;font-size:14px}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.nov .go{color:var(--gold);font-size:18px}
.invite{border:1px solid var(--gold);border-radius:14px;padding:14px 16px;background:linear-gradient(160deg,#211d15,#16171a);display:flex;flex-direction:column;gap:8px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .kpi:last-child{grid-column:auto}
.kpi.k-gold{border-color:var(--gold);background:linear-gradient(160deg,#211d15,#16171a)} .kpi.k-gold b{color:var(--gold)}
.tiles .kpi[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft)}
.ptiles{display:flex;flex-direction:column;gap:6px}
.entry.row{flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
.entry.row>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.entry.dec{border-color:#5a4a30}
.fbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fbtns .btn{padding:4px 10px;font-size:12.5px}
.docrow .dl{display:flex;flex-direction:column;gap:2px;min-width:0}
.docrow.nuevo{background:linear-gradient(90deg,rgba(184,145,90,.14),transparent);margin-inline:-14px;padding-inline:14px;border-left:3px solid var(--gold)}
.infobox.alert{border-color:var(--rojo);color:#ffb3ad;background:rgba(226,73,62,.08)}
.rfoto{max-width:220px;border-radius:8px;border:1px solid var(--line)}
.dotrow{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.dotn{font-family:var(--display);font-size:40px;min-width:48px;text-align:center}
.vsub{font-family:var(--body);font-size:13px;font-weight:500;color:var(--fg);margin-top:4px}
.fact small{display:block;font-size:11.5px;color:var(--muted)}
.boxed{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.chk2{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--fg)}
.chk2 input{width:auto}
input.bad{border-color:#c0392b!important;box-shadow:0 0 0 2px rgba(192,57,43,.25)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.card summary{font-weight:600}
details.modelbox summary{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.modelbox[open]{gap:8px}
/* cronograma */
.capas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.capas .eyebrow{margin-right:4px}
.capas button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px}
.capas button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);color:#f0dcb6}
.capas button[aria-pressed=true]::before{content:"✓ ";color:var(--gold)}
.grow.tall{height:40px}
.glabel{width:150px;border:0;border-right:1px solid var(--line);text-align:left;font:inherit;color:var(--fg);cursor:pointer}
button.glabel:hover{color:var(--gold)}
div.glabel{cursor:default}
.gtrack{background-image:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px)}
.gm{position:absolute;top:6px;border-left:1px solid var(--line);padding-left:4px;white-space:nowrap}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:14px;border-radius:4px;background:#4b505b;border:0;padding:0;overflow:hidden;cursor:pointer}
.grow.tall .gbar{top:15px;transform:none}
.gbar i{display:block;height:100%;background:var(--gold)}
.gbar.done{background:#5f655f}.gbar.done i{background:#8a7550}
.gbar:hover,.gbar:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.gseg{top:5px;height:6px;border-radius:2px}
.gman{top:2px}
.gok{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:var(--verde);border:2px solid var(--surface)}
.gwarn{position:absolute;top:1px;min-width:16px;height:14px;border-radius:7px;background:var(--rojo);color:#fff;font-size:10px;font-weight:700;line-height:14px;text-align:center;padding:0 3px}
.gbase{top:auto;bottom:3px;height:0;border-top:2px dashed var(--azul);background:none;opacity:1}
.grow.tall .gbase{bottom:auto;top:12px;height:20px;border:1.5px dashed var(--azul);border-radius:4px}
.greal{position:absolute;top:32px;height:4px;border-radius:2px;background:var(--verde)}
.greal.tarde{background:var(--naranja)}

/* ================= v14 · logo de Nexo animado en la portada ================= */
.lg-mark svg{overflow:visible}
.mk-orbit,.mk-core{transform-box:view-box;transform-origin:center}
.mk-orbit{animation:mk-spin 40s linear infinite}

@keyframes mk-pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.16);opacity:1}}

@media (prefers-reduced-motion:no-preference){

function verImg(src,cap){lock(true);$('#layer').innerHTML=`<div class="scrim" data-act="close" style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px"><img src="${src}" alt="" style="max-width:100%;max-height:82vh;border-radius:10px;object-fit:contain;background:#fff"><span class="small" style="color:#ddd">${esc(cap)}</span><span style="display:flex;gap:8px"><button class="btn sm" data-act="lbprev">‹ Anterior</button><button class="btn sm" data-act="close">Cerrar</button><button class="btn sm" data-act="lbnext">Siguiente ›</button></span></div>`}
let LBI=0;function abrirRender(i){const L=REND.filter(r=>GC==='Todas'||r.c===GC);LBI=(i+L.length)%L.length;const r=L[LBI];verImg(IMG+'r'+r.k+'.jpg','Render '+r.k+' · '+r.c)}
function cuenta(){lock(true);$('#layer').innerHTML=`<div class="scrim" data-act="scrim" style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center"><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Cerrar">✕</button><span class="eyebrow">Sincronizar</span><h2 style="margin:0">Guardar en la nube</h2><p class="muted small">Con el código de Dirección de NEXO 2 la cotización se ve igual en todos tus aparatos. Sin código queda guardada solo en este.</p><input class="enm" id="codin" type="password" autocomplete="off" placeholder="Código de Dirección" value=""><button class="btn gold full" data-act="entrar">Conectar</button>${COD?'<button class="btn full ghost" data-act="salir">Desconectar este aparato</button>':''}<span class="muted small" id="estado2"></span></div></div>`}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
 if(a==='scrim'&&e.target!==t)return;
 if(a==='close'||a==='scrim'){if(e.target.closest('img'))return;$('#layer').innerHTML='';lock(false);return}
 if(a==='tab'){TAB=t.dataset.k;try{localStorage.setItem('belfast_tab',TAB)}catch(x){}draw();scrollTo(0,0)}
 if(a==='ot'){OT=t.dataset.k;draw()}
 if(a==='gc'){GC=t.dataset.k;draw()}
 if(a==='lb'){const L=REND.filter(r=>GC==='Todas'||r.c===GC);abrirRender(L.findIndex(r=>r.k===t.dataset.k))}
 if(a==='lbprev'){e.stopPropagation();abrirRender(LBI-1)}
 if(a==='lbnext'){e.stopPropagation();abrirRender(LBI+1)}
 if(a==='plano'){const p=PLANOS.find(x=>x[0]===t.dataset.k);verImg(IMG+p[0]+'.jpg',p[1])}
 if(a==='csv')csv();
 if(a==='reset'&&confirm('¿Volver a las cantidades y precios originales?')){S=base();guardar();draw()}
 if(a==='nube')cuenta();
 if(a==='brillo'){const p=(window.__temaPref&&__temaPref())||'auto',n=p==='claro'?'oscuro':p==='oscuro'?'auto':'claro';window.__tema&&__tema(n);marcar(n==='auto'?'Tema automático':'Tema '+n)}
 if(a==='salir'){COD='';try{localStorage.removeItem('belfast_cod')}catch(x){}$('#layer').innerHTML='';lock(false);marcar('En este aparato')}
 if(a==='entrar'){const c=($('#codin')||{}).value||'';COD=c.trim();$('#estado2').textContent='Conectando…';try{await bajar();try{localStorage.setItem('belfast_cod',COD)}catch(x){}$('#layer').innerHTML='';lock(false);marcar('En la nube ✓');draw()}catch(err){COD='';$('#estado2').textContent=err.message}}});
document.addEventListener('keydown',e=>{if(!$('#layer').innerHTML)return;if(e.key==='Escape'){$('#layer').innerHTML='';lock(false)}if(e.key==='ArrowRight')abrirRender(LBI+1);if(e.key==='ArrowLeft')abrirRender(LBI-1)});
document.addEventListener('change',e=>{const t=e.target;let ch=false;
 if(t.dataset.it){const[id,k]=t.dataset.it.split(':');const it=S.items.find(x=>x.id==id);if(it){it[k]=num(t.value);ch=true}}
 if(t.dataset.pct){S.pct[t.dataset.pct]=num(t.value);ch=true}
 if(t.dataset.s){S[t.dataset.s]=num(t.value);ch=true}
 if(t.hasAttribute('data-iva')){S.ivaOn=t.checked;ch=true}
 if(ch){guardar();const op=[...document.querySelectorAll('details[open] summary b:first-child')].map(x=>x.textContent);const y=scrollY;draw();document.querySelectorAll('details summary b:first-child').forEach(x=>{if(op.includes(x.textContent))x.closest('details').open=true});scrollTo(0,y)}});
const D=['dom','lun','mar','mié','jue','vie','sáb'],MS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];const n=new Date();$('#fecha').textContent=D[n.getDay()]+' '+n.getDate()+' '+MS[n.getMonth()]+' '+n.getFullYear();
$('#who').innerHTML=`<span><b></b><span class="rol" id="estado">${COD?'Sincronizando…':'En este aparato'}</span></span><button class="btn ghost sm" data-act="nube" aria-label="Nube" title="Guardar en la nube">☁</button><button class="btn ghost sm" data-act="brillo" aria-label="Aspecto" title="Aspecto"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button>`;
draw();
if(COD)bajar().then(()=>{marcar('En la nube ✓');draw()}).catch(()=>marcar('En este aparato'));
