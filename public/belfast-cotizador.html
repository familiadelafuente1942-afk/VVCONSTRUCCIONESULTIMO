function vDoc(){return `<span class="eyebrow">Documentación</span><h1>Resumen del legajo</h1><div class="doc">
 <div class="card"><h3>La obra</h3><ul><li>Casa Pit, Lote 122, Barrio La Providencia. Proyecto y legajo ejecutivo del Estudio Leone Loray (planos del 23/10/2026).</li><li>Dos plantas y azotea técnica. Base cuadrada de 18,18 × 20,43 m más el ala del quincho, la cochera y la piscina.</li><li><b>Planta baja:</b> acceso, estar-comedor en doble altura, family, cocina con despensa, lavadero y patio de tendido, sala de máquinas, baño de servicio, toilette, habitación de huésped con baño, cochera cubierta y estacionamiento, quincho con dos baños exteriores, patio interno y piscina de unos 5 × 20 m con deck.</li><li><b>Planta alta:</b> suite master con vestidor y baño, oficina con baño, dos dormitorios con vestidor y baño compartido, terraza accesible sobre el quincho.</li><li><b>Niveles:</b> PB ±0,00 · losa +3,25 (PA +3,40) · losa de techo +6,60 · cielorrasos a +2,60 y +6,00 en dobles alturas.</li></ul></div>
 <div class="card"><h3>Qué define cada rubro</h3><ul><li><b>Suelos:</b> excavar a -1,10 (hasta -1,55 en zonas) y rellenar con tosca compactada de 35 y 75 cm.</li><li><b>Estructura (SKY Ingeniería):</b> platea de 40 cm, columnas 20×20 y 24×24, vigas invertidas de 50 a 75 cm, losas macizas de 18 cm. H-25 y acero ADN-420. 363 m³ y 24,4 t de acero netos.</li><li><b>Mampostería:</b> ladrillo hueco 18, 12 y 8 (×18×33). Cajón hidrófugo con ladrillo común en la primera hilada.</li><li><b>Revoques:</b> afuera hidrófugo + grueso + texturado. Adentro yeso proyectado y látex. En baños y cocina, hidrófugo + grueso bajo porcelanato.</li><li><b>Pisos:</b> adentro, un paquete de 15 cm: contrapiso alivianado 6 + telgopor 2 con malla + contrapiso radiante 5 + porcelanato 2. Afuera: contrapiso 9 + carpeta 3 + porcelanato o travertino. PA en porcelanato símil madera. Deck WPC en terraza y piscina.</li><li><b>Cielorrasos:</b> suspendidos de yeso con buña perimetral. Aleros con envarillado de madera.</li><li><b>Instalaciones:</b> eléctrica y corrientes débiles, gas, agua fría y caliente, cloacal y pluvial, aire acondicionado (central en PB y splits) y piso radiante.</li><li><b>Piso radiante (Aquaideas, 14/10/2026):</b> 4 colectores, 15 circuitos, 2 calderas Ferroli HF24, acumulador de 200 L, 296 m² calefaccionados. US$ 24.870 con materiales y mano de obra.</li><li><b>Carpinterías:</b> 36 tipos de ventana (V01 a V36), puertas P01 a P24, portones de chapa plegables o corredizos, barandas de vidrio de 1 m.</li><li><b>PPD del comitente (17/07/2026):</b> tanque flat elevado con cisterna, ablandador, caldera dual, losa radiante, AA central en PB, cámaras, previsión de paneles solares, cargador de auto eléctrico y cava.</li></ul></div>
 <div class="card obs"><h3>Lo que no cierra o falta</h3><ul>

 <li><b>La estructura puede estar atrasada.</b> El metraje del ingeniero es del 1/10/2026 y los planos de arquitectura del 23/10/2026. Hay que confirmar que SKY calculó la última versión.</li>
 <li><b>Escalera y piscina fuera del metraje.</b> El cómputo de SKY no las incluye. Acá están cotizadas aparte como estimado.</li>
 <li><b>Calefacción contra superficie.</b> El piso radiante está presupuestado para 296 m² y el piso interior medido da 397 m². Puede que lavadero, despensa y vestidores queden sin calefacción: confirmar.</li>
 <li><b>El presupuesto de calefacción excluye</b> la malla de 4,2 mm, los trabajos de albañilería y la electricidad de calderas y termostatos. Están dentro de esta cotización.</li>
 <li><b>Muchos acabados "a definir con propietarios":</b> 27 rótulos en los planos de solados, más griferías, artefactos, iluminación, muebles y mesadas. Van como montos reservados y cambian el precio final.</li>
 <li><b>Superficies sin planilla.</b> El legajo no trae una planilla de superficies. La superficie cubierta (≈ 522 m²) está estimada desde losas y plantas.</li>
 <li><b>Renders sin cruzar.</b> Los 58 renders y la presentación final (137 MB) no se compararon contra los planos en esta pasada.</li></ul></div>
 <div class="card"><h3>Cómo se calculó</h3><ul><li>Mampostería, pisos y revoques: superficie pintada de cada tipo en los planos (1:50), dividida por el espesor del muro, con alturas de los cortes.</li><li>Estructura: metraje del ingeniero tal cual.</li><li>Precios: planilla UTN F.R. Venado Tuerto de mayo 2026, llevada a octubre (materiales +12%, mano de obra +25%) con un 15% más de mano de obra por trabajar en country del AMBA. Calefacción con el presupuesto real.</li><li>Todo es editable en la solapa Presupuesto.</li></ul></div></div>`}
