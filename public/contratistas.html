<script>
const API='/api/nexo2',LS='nexo2_ct';
const TIPOS={auditoria:['Auditoría de obra','Recorrido con varias tareas frenadas'],material:['Falta material','No hay materiales para empezar o seguir'],definicion:['Falta definición o plano','Sin definiciones, planos, pases o medidas'],retraso:['Retraso','Estoy parado o demorado por algo de la obra'],adicional:['Adicional','Trabajo extra que no estaba previsto'],otro:['Otro','Cualquier otro inconveniente'],presupuesto:['Presupuesto','Presupuesto enviado a la Dirección'],materiales:['Listado de materiales','Listado de materiales enviado a la Dirección']};
/* reclamo = todo lo que no es presupuesto ni listado (la auditoría también es reclamo) */
const esRec=it=>!it.doc||it.tipo==='auditoria';
const respondido=it=>!!it.primeraResp||['gestion','resuelto','cerrado','rechazado'].includes(it.estado);
function pillRec(it){if(!esRec(it))return `<span class="pill p-recibido">${EST[it.estado]||it.estado}</span>`;
 const fin={resuelto:'Resuelto (confirmalo)',cerrado:'Cerrado',rechazado:'No corresponde'}[it.estado];
 return respondido(it)?`<span class="pill" style="color:var(--ok);border-color:var(--ok)">Enviado a Dirección · ${fin||'respondido'}</span>`:`<span class="pill" style="color:var(--bad);border-color:var(--bad)">Enviado a Dirección · sin respuesta</span>`}
const EST={recibido:'Enviado a Dirección',abierto:'Abierto · sin resolver',gestion:'En gestión',resuelto:'Resuelto (confirmalo)',rechazado:'No corresponde',cerrado:'Cerrado'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const f2=t=>{const d=new Date(t);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})};
let CT=null,ITEMS=null,VISTA='lista',NEW=null,SEL=null,ERR='',CARGANDO=false,TS=0;
try{CT=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
/* respaldo del código en una cookie: si el equipo borra el almacenamiento, se recupera solo */
function ckCod(){try{const m=document.cookie.match(/(?:^|; )nexo2_ct=([^;]*)/);return m?JSON.parse(decodeURIComponent(m[1])):null}catch(e){return null}}
function ckGuardar(){try{if(CT&&CT.codigo)document.cookie='nexo2_ct='+encodeURIComponent(JSON.stringify({codigo:CT.codigo,codigos:CT.codigos||[]}))+';path=/;max-age=31536000;SameSite=Lax;Secure'}catch(e){}}
if(!CT){const k=ckCod();if(k&&k.codigo)CT={codigo:k.codigo,codigos:k.codigos||[],nombre:'',rubro:'',obra:'',obraNombre:''}}
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok&&r.status!==403&&r.status!==400&&r.status!==404)throw new Error(r.status);return r.json()}
const GI={"alerta": "<path d=\"M12 3l9.5 16.5h-19z\"/><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14\"/><circle cx=\"12\" cy=\"17\" r=\".6\" fill=\"currentColor\"/>", "doc": "<path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><polyline points=\"14 3 14 9 20 9\"/><line x1=\"8\" y1=\"14\" x2=\"16\" y2=\"14\"/><line x1=\"8\" y1=\"17\" x2=\"13\" y2=\"17\"/>", "lista": "<line x1=\"9\" y1=\"6\" x2=\"20\" y2=\"6\"/><line x1=\"9\" y1=\"12\" x2=\"20\" y2=\"12\"/><line x1=\"9\" y1=\"18\" x2=\"20\" y2=\"18\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/>", "mas": "<line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/>", "salir": "<path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/><polyline points=\"16 17 21 12 16 7\"/><line x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"/>", "volver": "<polyline points=\"15 18 9 12 15 6\"/>", "enviar": "<line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/>", "wa": "<path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z\"/>", "material": "<path d=\"M21 16V8l-9-5-9 5v8l9 5z\"/><polyline points=\"3.3 7 12 12 20.7 7\"/><line x1=\"12\" y1=\"22\" x2=\"12\" y2=\"12\"/>", "definicion": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M9 21V9\"/>", "retraso": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><polyline points=\"12 7 12 12 15 14\"/>", "adicional": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"16\"/><line x1=\"8\" y1=\"12\" x2=\"16\" y2=\"12\"/>", "otro": "<circle cx=\"5\" cy=\"12\" r=\"1.3\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\"/>", "auditoria": "<path d=\"M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z\"/><path d=\"M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2\"/><polyline points=\"8 13 11 16 16 10\"/>"};const gi=n=>`<span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${GI[n]||''}</svg></span>`;
const cred=()=>({rol:'ct',codigo:CT.codigo,codigos:CT.codigos||[]});
/* varias obras con el mismo código: el contratista elige en cuál reclama */
let FOBRA='';const OBS=()=>(CT&&Array.isArray(CT.obras)&&CT.obras.length?CT.obras:CT?[{id:CT.obra,nombre:CT.obraNombre,jw:CT.jw||''}]:[]);
const obNom=id=>{const o=OBS().find(x=>x.id===id);return o?o.nombre:(CT&&CT.obraNombre)||'Obra'};
/* sumar otra obra con otro código, sin salir */
let ADDOB=false,ADDERR='';
/* los códigos que se sumaron antes solo en este equipo se guardan en el servidor (así aparecen en todos los equipos) */
async function subirVinculos(){if(!CT||CT.vincOk||!(CT.codigos||[]).length)return;try{for(const c of CT.codigos)await api({op:'ct_vincular',cred:cred(),nuevo:c});CT.vincOk=1;(localStorage.setItem(LS,JSON.stringify(CT)),ckGuardar())}catch(e){}}
async function sumarCodigo(cod){cod=String(cod||'').toUpperCase().replace(/\s+/g,'');ADDERR='';if(!cod){ADDERR='Escribí el código';draw();return}
 if(cod===CT.codigo||(CT.codigos||[]).includes(cod)){ADDERR='Ese código ya está sumado';draw();return}
 try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ADDERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}
  try{await api({op:'ct_vincular',cred:cred(),nuevo:cod})}catch(e){}
  CT.codigos=(CT.codigos||[]).concat([cod]);const ya=new Set(OBS().map(o=>o.id));CT.obras=OBS().concat((d.ct.obras||[{id:d.ct.obra,nombre:d.ct.obraNombre,jw:d.ct.jw||''}]).filter(o=>!ya.has(o.id)));
  try{(localStorage.setItem(LS,JSON.stringify(CT)),ckGuardar())}catch(e){}ADDOB=false;await cargar()}catch(e){ADDERR='No se pudo conectar. Revisá la conexión.';draw()}}
async function login(cod){ERR='';try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}CT={...d.ct,codigo:cod.toUpperCase().replace(/\s+/g,'')};(localStorage.setItem(LS,JSON.stringify(CT)),ckGuardar());VISTA='lista';await cargar();}catch(e){ERR='No se pudo conectar. Revisá la conexión.';draw()}}
async function cargar(sil){if(CT&&!CT.vincOk&&(CT.codigos||[]).length)await subirVinculos();if(!CT||CARGANDO)return;CARGANDO=true;try{const d=await api({op:'ct_mine',cred:cred()});if(d.error){/* nunca se borra el código solo (un corte o una actualización no te saca): solo con "Salir" */if(/código|autoriz/i.test(d.error)){ERR='No pude validar tu código en este momento. Probá en unos minutos; si sigue, pedile a la Dirección que revise tu acceso.'}throw new Error(d.error)}ITEMS=d.items||[];if(Array.isArray(d.obras)&&d.obras.length){CT.obras=d.obras;if(!CT.obra||!CT.obraNombre){CT.obra=d.obras[0].id;CT.obraNombre=d.obras[0].nombre}if(FOBRA&&!d.obras.some(o=>o.id===FOBRA))FOBRA=''}if(typeof d.jw==='string')CT.jw=d.jw;if(d.yo&&d.yo.nombre){CT.nombre=d.yo.nombre;CT.rubro=d.yo.rubro||''}try{(localStorage.setItem(LS,JSON.stringify(CT)),ckGuardar())}catch(e){}TS=Date.now();ERR=''}catch(e){if(!ITEMS&&!ERR)ERR='No se pudieron cargar tus reclamos. Revisá la conexión.'}CARGANDO=false;if(!(sil&&document.querySelector('textarea:focus,input:focus')))draw()}

let AUD=null;const EAUD={avanza:['✅ Se puede avanzar','var(--ok)'],material:['⛔ No se puede: falta material','var(--bad)'],definicion:['⛔ No se puede: falta definición / plano','var(--warn)'],otro:['⛔ No se puede: otro motivo','var(--warn)'],terminado:['✔ Terminado','var(--mut)']};
function hoyISO(){const d=new Date(Date.now()-3*36e5);return d.toISOString().slice(0,10)}
const diasDesde=f=>{if(!f)return 0;const t=Date.parse(f+'T12:00:00-03:00');return t?Math.max(0,Math.floor((Date.now()-t)/864e5)):0};
const fISO=f=>f?f.split('-').reverse().join('/'):'';
function audReclamos(ob){return (ITEMS||[]).filter(x=>!x.doc&&x.tipo!=='auditoria'&&!x.enAud&&x.obra===ob&&!['cerrado','rechazado','resuelto'].includes(x.estado)).map(x=>({id:x.id,num:x.num||'',titulo:x.titulo,tipo:TIPOS[x.tipo]?TIPOS[x.tipo][0]:x.tipo,dias:Math.floor((Date.now()-x.creado)/864e5)}))}
function audConcl(a){const bl=a.items.filter(x=>x.tarea.trim()&&['material','definicion','otro'].includes(x.est)),mat=bl.filter(x=>x.est==='material'),av=a.items.filter(x=>x.tarea.trim()&&x.est==='avanza');let t='';
 const pers=+a.personal||0,oc=+a.ociosos||0;
 if(pers)t+=`Hoy hay ${pers} persona${pers>1?'s':''} en obra${oc?`, de las cuales ${oc} no pueden trabajar por lo que se detalla abajo`:''}. `;
 if(mat.length)t+=`${mat.length} tarea${mat.length>1?'s no se pueden':' no se puede'} avanzar por FALTA DE MATERIAL: ${mat.map(x=>x.tarea+(x.falta?' (falta '+x.falta+(x.pedido?', pedido hace '+diasDesde(x.pedido)+' días':'')+')':'')).join('; ')}. `;
 const otras=bl.filter(x=>x.est!=='material');if(otras.length)t+=`${otras.length} tarea${otras.length>1?'s':''} frenada${otras.length>1?'s':''} por ${otras.map(x=>(x.est==='definicion'?'falta de definición/plano':'otro motivo')+' ('+x.tarea+')').join('; ')}. `;
 if(av.length)t+=`Se puede avanzar en: ${av.map(x=>x.tarea).join(', ')}. `;
 if(mat.length&&pers)t+='La falta de avance en esas tareas no es por falta de mano de obra: hay personal disponible y lo que falta es el material.';
 return t.trim()}
function dibujaAud(){const a=AUD,O=OBS(),rec=a.obra?audReclamos(a.obra):[];

function leerAud(){const a=AUD,g=i=>{const e=document.getElementById(i);return e?e.value:null};if(g('a-obra')!=null)a.obra=g('a-obra');a.fecha=g('a-fecha')||a.fecha;a.personal=(g('a-pers')||'').replace(/\D/g,'');a.ociosos=(g('a-oc')||'').replace(/\D/g,'');const c=g('a-concl');if(c!=null)a.concl=c;
