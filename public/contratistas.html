<style>
@font-face{font-family:'Barlow Condensed';font-weight:500;font-display:swap;src:url(/fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(/fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(/fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(/fonts/barlow-latin-500-normal.woff2) format('woff2')}

:root{--bg:#0d0e10;--card:#17181c;--line:#2a2c31;--ink:#f1ede4;--mut:#a29c90;--gold:#b8915a;--ok:#4fa86f;--warn:#e0894f;--bad:#d9605a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1,h2,.t{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
h1{font-size:30px;line-height:1.05}h2{font-size:22px}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;margin:6px 0 14px}.mos i{position:relative;aspect-ratio:3/2;background-size:cover;background-position:center}.mos b{position:absolute;left:10px;bottom:8px;color:#fff;font:600 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:#0d0e10;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:1px solid var(--line);background:#202228;color:var(--ink);border-radius:12px;padding:13px 16px;font-weight:600;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120b}
.btn.full{width:100%}.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid}
.p-recibido{color:#6fa8e0;border-color:#6fa8e0}.p-abierto{color:var(--warn);border-color:var(--warn)}.p-gestion{color:#6fa8e0;border-color:#6fa8e0}.p-resuelto{color:var(--ok);border-color:var(--ok)}.p-rechazado{color:var(--bad);border-color:var(--bad)}.p-cerrado{color:var(--mut);border-color:var(--mut)}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipos button{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:#202228;color:var(--ink);font-weight:600}
.tipos button.on{border-color:var(--gold);background:#2a2418;color:#f0d9a8}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fotos img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.hist{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:12px}.hist div{margin:8px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#estado{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;padding:6px;background:#111216;border-top:1px solid var(--line);color:var(--mut)}

/* listas desplegables: siempre letra oscura sobre fondo claro (se leen en modo claro y oscuro, PC y Apple) */
select option,select optgroup{background-color:#fff!important;color:#16171a!important}

<div id="app"></div><div id="estado"></div>
<script>
const API='/api/nexo2',LS='nexo2_ct';
const TIPOS={material:['Falta material','No hay materiales para empezar o seguir'],definicion:['Falta definición o plano','Sin definiciones, planos, pases o medidas'],retraso:['Retraso','Estoy parado o demorado por algo de la obra'],adicional:['Adicional','Trabajo extra que no estaba previsto'],otro:['Otro','Cualquier otro inconveniente'],presupuesto:['Presupuesto','Presupuesto enviado a la Dirección'],materiales:['Listado de materiales','Listado de materiales enviado a la Dirección']};
const EST={recibido:'Enviado a Dirección',abierto:'Abierto · sin resolver',gestion:'En gestión',resuelto:'Resuelto (confirmalo)',rechazado:'No corresponde',cerrado:'Cerrado'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const f2=t=>{const d=new Date(t);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})};
let CT=null,ITEMS=null,VISTA='lista',NEW=null,SEL=null,ERR='',CARGANDO=false,TS=0;
try{CT=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok&&r.status!==403&&r.status!==400&&r.status!==404)throw new Error(r.status);return r.json()}
const cred=()=>({rol:'ct',codigo:CT.codigo});
async function login(cod){ERR='';try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}CT={...d.ct,codigo:cod.toUpperCase().replace(/\s+/g,'')};localStorage.setItem(LS,JSON.stringify(CT));VISTA='lista';await cargar();}catch(e){ERR='No se pudo conectar. Revisá la conexión.';draw()}}
async function cargar(sil){if(!CT||CARGANDO)return;CARGANDO=true;try{const d=await api({op:'ct_mine',cred:cred()});if(d.error){if(/código/i.test(d.error)){salir(true);return}throw new Error(d.error)}ITEMS=d.items||[];TS=Date.now();ERR=''}catch(e){if(!ITEMS)ERR='No se pudieron cargar tus reclamos. Revisá la conexión.'}CARGANDO=false;if(!(sil&&document.querySelector('textarea:focus,input:focus')))draw()}
function salir(){try{localStorage.removeItem(LS)}catch(e){}CT=null;ITEMS=null;SEL=null;NEW=null;draw()}
function dibujaLogin(){return `<a href="/nexo2.html" class="mut sm" style="text-decoration:none;display:inline-block;margin-bottom:8px">← Volver a Nexo</a><div class="top"><div><div class="eyebrow">Nexo</div><h1>Contratistas</h1></div></div><div class="mos">${[['plomeria','Plomería'],['electricidad','Electricidad'],['pintura','Pintura'],['mamposteria','Mampostería']].map(([f,n])=>`<i style="background-image:url(/contratistas/${f}.jpg)"><b>${n}</b></i>`).join('')}</div><p class="mut">Si en la obra te falta material, no tenés definiciones o planos, estás parado o tenés un trabajo adicional, avisalo acá: le llega directo a la Dirección y a la Jefatura de obra, con fecha y hora.</p><div class="card"><label for="cod">Tu código de contratista</label><input id="cod" autocomplete="off" autocapitalize="characters" placeholder="CT-XXXXX" value=""><button class="btn gold full" style="margin-top:14px" id="go">Entrar</button>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<p class="mut sm">El código te lo da la Dirección de obra.</p><p class="mut sm">¿Sos de la Dirección o la Jefatura? Esta pantalla es solo para contratistas: entrá a Nexo → Constructora y ahí ves sus avisos.</p></div>`}
function card(it){const n=(it.hist||[]).length;return `<div class="card" data-id="${it.id}" style="cursor:pointer"><div class="row" style="justify-content:space-between"><span class="pill p-${it.estado}">${EST[it.estado]||it.estado}</span><span class="mut sm">${f2(it.creado)}</span></div><h2 style="margin-top:8px">${esc(it.titulo)}</h2><div class="mut sm">${esc(TIPOS[it.tipo]?TIPOS[it.tipo][0]:'')}${it.diasRetraso?` · ${it.diasRetraso} día(s) de retraso`:''}${it.monto?` · adicional estimado $ ${Number(it.monto).toLocaleString('es-AR')}`:''}</div>${it.doc?((it.archivos||[]).length?`<div class="mut sm" style="margin-top:6px">${it.archivos.length} archivo(s) adjunto(s)</div>`:''):it.primeraResp?`<div class="sm" style="margin-top:6px;color:var(--ok)">Respondido: ${f2(it.primeraResp)}</div>`:`<div class="sm" style="margin-top:6px;color:var(--warn)">Todavía sin respuesta de la obra</div>`}<div class="mut sm">${n} movimiento(s)</div></div>`}
function dibujaLista(){const its=(ITEMS||[]).slice().sort((a,b)=>b.editado-a.editado);return `<div class="top"><div><div class="eyebrow">${esc(CT.obraNombre||'Obra')}</div><h1>${esc(CT.nombre)}</h1><div class="mut sm">${esc(CT.rubro||'')}</div></div><button class="btn ghost sm" id="sal">Salir</button></div><button class="btn gold full" id="nuevo">+ Avisar un problema</button><div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="npres">Enviar presupuesto</button><button class="btn" style="flex:1" id="nmat">Enviar listado de materiales</button></div>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<h2 style="margin:18px 0 4px">Mis avisos y envíos</h2>${ITEMS==null?'<p class="mut">Cargando…</p>':its.length?its.map(card).join(''):'<p class="mut">Todavía no cargaste ningún aviso.</p>'}`}
function dibujaNuevo(){const n=NEW,doc=n.tipo==='presupuesto'||n.tipo==='materiales';
 const cab=doc?`<button class="btn ghost sm" id="atras">← Volver</button><h1 style="margin-top:10px">${n.tipo==='presupuesto'?'Enviar presupuesto':'Enviar listado de materiales'}</h1><p class="mut sm">Le llega a la Dirección de obra y queda guardado en tu ficha de la obra. No es una alerta.</p>`:`<button class="btn ghost sm" id="atras">← Volver</button><h1 style="margin-top:10px">¿Qué está pasando?</h1><div class="tipos" style="margin-top:12px">${['material','definicion','retraso','adicional','otro'].map(k=>`<button data-tipo="${k}" class="${n.tipo===k?'on':''}">${TIPOS[k][0]}</button>`).join('')}</div>${n.tipo?`<p class="mut sm">${TIPOS[n.tipo][1]}</p>`:''}`;
 return cab+(doc?`<label>Título (opcional)</label><input id="n-tit" maxlength="200" value="${esc(n.titulo)}" placeholder="${n.tipo==='presupuesto'?'Ej: Presupuesto de plomería PB y 1° piso':'Ej: Listado de materiales de plomería'}">`:`<label>Resumen (qué falta o qué pasó)</label><input id="n-tit" maxlength="200" value="${esc(n.titulo)}" placeholder="Ej: No hay definición de dónde va el cuerpo de ducha">`)+`<label>${doc?'Detalle o aclaraciones':'Detalle'}</label><textarea id="n-desc" placeholder="${doc?'Qué incluye, condiciones, plazos…':'Planta, ambiente, qué necesitás, desde cuándo…'}">${esc(n.desc)}</textarea><label>Tarea o ambiente (opcional)</label><input id="n-tar" maxlength="200" value="${esc(n.tarea)}" placeholder="Ej: Baño principal PB">`+(doc?(n.tipo==='presupuesto'?`<label>Monto total ($)</label><input id="n-monto" inputmode="numeric" value="${esc(n.monto)}" placeholder="0">`:''):`<div class="row"><div style="flex:1"><label>Días de retraso hasta hoy</label><input id="n-dias" inputmode="numeric" value="${esc(n.dias)}" placeholder="0"></div><div style="flex:1"><label>Adicional estimado ($)</label><input id="n-monto" inputmode="numeric" value="${esc(n.monto)}" placeholder="0"></div></div>`)+(doc?`<label>Archivos (PDF, Excel, Word o fotos)</label><input id="n-arc" type="file" multiple accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,image/*"><div class="mut sm" style="margin-top:6px">${n.archivos.map(a=>esc(a.n)).join(' · ')}</div>`:`<label>Fotos (opcional)</label><input id="n-fot" type="file" accept="image/*" multiple><div class="fotos">${n.fotos.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`)+`${n.subiendo?'<p class="mut sm">Subiendo archivos…</p>':''}${ERR?`<div class="err">${esc(ERR)}</div>`:''}<button class="btn gold full" style="margin-top:16px" id="env" ${n.enviando||n.subiendo?'disabled':''}>${n.enviando?'Enviando…':doc?'Enviar a Dirección':'Enviar a Dirección y Jefatura'}</button>`}
let CONFDEL='';function dibujaDet(){const it=(ITEMS||[]).find(x=>x.id===SEL);if(!it){VISTA='lista';return dibujaLista()}const ab=!['cerrado','rechazado'].includes(it.estado);return `<button class="btn ghost sm" id="atras">← Volver</button><div class="card"><span class="pill p-${it.estado}">${EST[it.estado]||it.estado}</span><h1 style="margin-top:8px">${esc(it.titulo)}</h1><div class="mut sm">${esc(TIPOS[it.tipo]?TIPOS[it.tipo][0]:'')} · cargado ${f2(it.creado)}${it.diasRetraso?` · ${it.diasRetraso} día(s) de retraso`:''}${it.monto?` · adicional estimado $ ${Number(it.monto).toLocaleString('es-AR')}`:''}</div>${it.desc?`<p>${esc(it.desc)}</p>`:''}${it.tarea?`<div class="mut sm">Tarea / ambiente: ${esc(it.tarea)}</div>`:''}<div class="fotos">${(it.fotos||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>`).join('')}</div>${(it.archivos||[]).map(a=>`<div style="margin-top:8px"><a href="${esc(a.u)}" target="_blank" rel="noopener" style="color:var(--gold)">📎 ${esc(a.n||'Archivo')}</a></div>`).join('')}</div><h2>Movimientos</h2><div class="hist">${(it.hist||[]).map(h=>`<div><b>${esc(h.nom||h.por)}</b> <span class="mut sm">${f2(h.t)}</span>${h.estado?` <span class="pill p-${h.estado}">${EST[h.estado]||h.estado}</span>`:''}<br>${esc(h.tx||'')}${(h.fotos||[]).length?`<div class="fotos">${h.fotos.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}</div>`).join('')}</div>${it.estado==='resuelto'?`<div class="card"><b>La obra dice que ya está resuelto.</b><div class="row" style="margin-top:10px"><button class="btn gold" id="ok">Sí, está resuelto</button><button class="btn" id="reab">No, sigue el problema</button></div></div>`:''}${ab?`<label>Agregar un comentario</label><textarea id="c-tx" placeholder="Novedades, aclaraciones…"></textarea>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<button class="btn full" style="margin-top:10px" id="cmt">Enviar comentario</button>`:`<div class="row" style="margin-top:12px"><button class="btn" id="reab">Reabrir</button></div>`}<div class="card" style="margin-top:16px">${CONFDEL===it.id?`<b>¿Borrar este ${it.doc?'envío':'aviso'}?</b><div class="mut sm">Se borra también para la obra y la Dirección. Después lo podés volver a cargar bien.</div>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn" id="delno">No, dejarlo</button><button class="btn gold" id="delsi">Sí, borrar</button></div>`:`<button class="btn ghost sm" id="del">🗑 Me equivoqué: borrar este ${it.doc?'envío':'aviso'}</button>`}</div>`}
function draw(){const a=$('#app');if(!CT){a.innerHTML=dibujaLogin();$('#go').onclick=()=>login($('#cod').value);$('#cod').onkeydown=e=>{if(e.key==='Enter')login($('#cod').value)};return}
 if(VISTA==='nuevo'){a.innerHTML=dibujaNuevo();ligaNuevo();return}
 if(VISTA==='det'){a.innerHTML=dibujaDet();ligaDet();return}
 a.innerHTML=dibujaLista();$('#sal').onclick=salir;const ab=tp=>()=>{NEW={tipo:tp,titulo:'',desc:'',tarea:'',dias:'',monto:'',fotos:[],archivos:[]};ERR='';VISTA='nuevo';draw();scrollTo(0,0)};$('#nuevo').onclick=ab('');$('#npres').onclick=ab('presupuesto');$('#nmat').onclick=ab('materiales');a.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>{SEL=c.dataset.id;ERR='';VISTA='det';draw();scrollTo(0,0)})}
function leerNuevo(){const n=NEW;const g=i=>{const e=document.getElementById(i);return e?e.value:''};n.titulo=g('n-tit');n.desc=g('n-desc');n.tarea=g('n-tar');n.dias=g('n-dias');n.monto=g('n-monto')}
function miles(v){return String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function ligaNuevo(){const m=document.getElementById('n-monto');if(m){m.value=miles(m.value);m.oninput=()=>{m.value=miles(m.value);try{m.setSelectionRange(m.value.length,m.value.length)}catch(e){}}}
 $('#atras').onclick=()=>{VISTA='lista';ERR='';draw()};document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{leerNuevo();NEW.tipo=b.dataset.tipo;draw()});
 if($('#n-fot'))$('#n-fot').onchange=async e=>{leerNuevo();const fs=[...e.target.files];NEW.subiendo=true;ERR='';draw();try{for(const f of fs.slice(0,10-NEW.fotos.length))NEW.fotos.push(await subirFoto(f))}catch(x){ERR='No se pudo subir una foto. Probá de nuevo.'}NEW.subiendo=false;draw()};
 if($('#n-arc'))$('#n-arc').onchange=async e=>{leerNuevo();const fs=[...e.target.files];NEW.subiendo=true;ERR='';draw();try{for(const f of fs.slice(0,10-NEW.archivos.length))NEW.archivos.push(await subirArchivo(f))}catch(x){ERR='No se pudo subir un archivo (máximo 15 MB). Probá de nuevo.'}NEW.subiendo=false;draw()};
 $('#env').onclick=enviar}
async function enviar(){leerNuevo();const n=NEW;const doc=n.tipo==='presupuesto'||n.tipo==='materiales';if(!n.tipo){ERR='Elegí qué tipo de problema es';draw();return}if(!doc&&!n.titulo.trim()){ERR='Escribí un resumen de qué pasa';draw();return}if(doc&&!n.archivos.length&&!n.desc.trim()&&!(+String(n.monto).replace(/\D/g,''))){ERR='Adjuntá el archivo o escribí el detalle';draw();return}n.enviando=true;ERR='';draw();
 try{const d=await api({op:'ct_new',cred:cred(),rec:{tipo:n.tipo,titulo:n.titulo,desc:n.desc,tarea:n.tarea,diasRetraso:+String(n.dias).replace(/\D/g,'')||0,monto:+String(n.monto).replace(/\D/g,'')||0,fotos:n.fotos,archivos:n.archivos}});if(!d.ok)throw new Error(d.error||'error');ITEMS=(ITEMS||[]).concat([d.rec]);VISTA='lista';NEW=null;ERR='';draw();scrollTo(0,0);aviso(doc?'Enviado ✓ Le llegó a la Dirección':'Enviado ✓ Le llegó a la Dirección y a la Jefatura')}catch(e){n.enviando=false;ERR='No se pudo enviar: '+(e.message||'revisá la conexión')+'. Tus datos siguen acá: probá de nuevo.';draw()}}
function ligaDet(){$('#atras').onclick=()=>{VISTA='lista';ERR='';CONFDEL='';draw()};if($('#del'))$('#del').onclick=()=>{CONFDEL=SEL;ERR='';draw()};if($('#delno'))$('#delno').onclick=()=>{CONFDEL='';ERR='';draw()};if($('#delsi'))$('#delsi').onclick=async()=>{try{const d=await api({op:'ct_del',cred:cred(),id:SEL});if(!d.ok)throw new Error(d.error||'error');ITEMS=(ITEMS||[]).filter(x=>x.id!==SEL);CONFDEL='';ERR='';VISTA='lista';draw();aviso('Borrado ✓')}catch(e){ERR=e.message||'No se pudo borrar';draw()}};const m=(est,tx)=>async()=>{const t=tx!==undefined?tx:($('#c-tx')?$('#c-tx').value:'');try{const d=await api({op:'ct_cmt',cred:cred(),id:SEL,txt:t,estado:est});if(!d.ok)throw new Error(d.error||'error');const i=ITEMS.findIndex(x=>x.id===SEL);if(i>=0)ITEMS[i]=d.rec;ERR='';draw();aviso('Enviado ✓')}catch(e){ERR=e.message||'No se pudo enviar';draw()}};
 if($('#cmt'))$('#cmt').onclick=m('');if($('#ok'))$('#ok').onclick=m('cerrado','Confirmo que está resuelto');if($('#reab'))$('#reab').onclick=m('abierto','Sigue el problema / reabro el aviso')}
async function subirArchivo(f){if(/^image\//.test(f.type))return {u:await subirFoto(f),n:f.name};if(f.size>15e6)throw new Error('grande');const u=await api({op:'ct_up_url',cred:cred(),name:f.name,type:f.type||'application/octet-stream',size:f.size});if(!u.ok)throw new Error(u.error);const x=await fetch(u.up,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!x.ok)throw new Error('subida');return {u:u.pub,n:f.name}}
async function subirFoto(file){const img=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=r.result};r.onerror=ko;r.readAsDataURL(file)});const M=1400,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));
 const u=await api({op:'ct_up_url',cred:cred(),name:'foto.jpg',type:'image/jpeg',size:blob.size});if(!u.ok)throw new Error(u.error);const x=await fetch(u.up,{method:'PUT',headers:{'Content-Type':'image/jpeg'},body:blob});if(!x.ok)throw new Error('subida');return u.pub}
