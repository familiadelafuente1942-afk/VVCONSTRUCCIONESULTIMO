<style>
@font-face{font-family:'Barlow Condensed';font-weight:500;font-display:swap;src:url(/fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(/fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(/fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(/fonts/barlow-latin-500-normal.woff2) format('woff2')}

:root{--bg:#0d0e10;--card:#17181c;--line:#2a2c31;--ink:#f1ede4;--mut:#a29c90;--gold:#b8915a;--ok:#4fa86f;--warn:#e0894f;--bad:#d9605a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1,h2,.t{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
h1{font-size:30px;line-height:1.05}h2{font-size:22px}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:14px;overflow:hidden;margin:6px 0 14px}.mos i{position:relative;aspect-ratio:3/2;background-size:cover;background-position:center}.mos b{position:absolute;left:10px;bottom:8px;color:#fff;font:600 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:#0d0e10;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:1px solid var(--line);background:#202228;color:var(--ink);border-radius:12px;padding:13px 16px;font-weight:600;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120b}
.btn.full{width:100%}.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid}
.p-recibido{color:#6fa8e0;border-color:#6fa8e0}.p-abierto{color:var(--warn);border-color:var(--warn)}.p-gestion{color:#6fa8e0;border-color:#6fa8e0}.p-resuelto{color:var(--ok);border-color:var(--ok)}.p-rechazado{color:var(--bad);border-color:var(--bad)}.p-cerrado{color:var(--mut);border-color:var(--mut)}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipos button{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:#202228;color:var(--ink);font-weight:600}
.tipos button.on{border-color:var(--gold);background:#2a2418;color:#f0d9a8}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fotos img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.hist{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:12px}.hist div{margin:8px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#estado{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;padding:6px;background:#111216;border-top:1px solid var(--line);color:var(--mut)}

/* listas desplegables: siempre letra oscura sobre fondo claro (se leen en modo claro y oscuro, PC y Apple) */
select option,select optgroup{background-color:#fff!important;color:#16171a!important}

<div id="app"></div><div id="estado"></div>
<script>
const API='/api/nexo2',LS='nexo2_ct';
const TIPOS={material:['Falta material','No hay materiales para empezar o seguir'],definicion:['Falta definición o plano','Sin definiciones, planos, pases o medidas'],retraso:['Retraso','Estoy parado o demorado por algo de la obra'],adicional:['Adicional','Trabajo extra que no estaba previsto'],otro:['Otro','Cualquier otro inconveniente'],presupuesto:['Presupuesto','Presupuesto enviado a la Dirección'],materiales:['Listado de materiales','Listado de materiales enviado a la Dirección']};
const EST={recibido:'Enviado a Dirección',abierto:'Abierto · sin resolver',gestion:'En gestión',resuelto:'Resuelto (confirmalo)',rechazado:'No corresponde',cerrado:'Cerrado'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const f2=t=>{const d=new Date(t);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})};
let CT=null,ITEMS=null,VISTA='lista',NEW=null,SEL=null,ERR='',CARGANDO=false,TS=0;
try{CT=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok&&r.status!==403&&r.status!==400&&r.status!==404)throw new Error(r.status);return r.json()}
const cred=()=>({rol:'ct',codigo:CT.codigo,codigos:CT.codigos||[]});
/* varias obras con el mismo código: el contratista elige en cuál reclama */
let FOBRA='';const OBS=()=>(CT&&Array.isArray(CT.obras)&&CT.obras.length?CT.obras:CT?[{id:CT.obra,nombre:CT.obraNombre,jw:CT.jw||''}]:[]);
const obNom=id=>{const o=OBS().find(x=>x.id===id);return o?o.nombre:(CT&&CT.obraNombre)||'Obra'};
/* sumar otra obra con otro código, sin salir */
let ADDOB=false,ADDERR='';
async function sumarCodigo(cod){cod=String(cod||'').toUpperCase().replace(/\s+/g,'');ADDERR='';if(!cod){ADDERR='Escribí el código';draw();return}
 if(cod===CT.codigo||(CT.codigos||[]).includes(cod)){ADDERR='Ese código ya está sumado';draw();return}
 try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ADDERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}
  CT.codigos=(CT.codigos||[]).concat([cod]);const ya=new Set(OBS().map(o=>o.id));CT.obras=OBS().concat((d.ct.obras||[{id:d.ct.obra,nombre:d.ct.obraNombre,jw:d.ct.jw||''}]).filter(o=>!ya.has(o.id)));
  try{localStorage.setItem(LS,JSON.stringify(CT))}catch(e){}ADDOB=false;await cargar()}catch(e){ADDERR='No se pudo conectar. Revisá la conexión.';draw()}}
async function login(cod){ERR='';try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}CT={...d.ct,codigo:cod.toUpperCase().replace(/\s+/g,'')};localStorage.setItem(LS,JSON.stringify(CT));VISTA='lista';await cargar();}catch(e){ERR='No se pudo conectar. Revisá la conexión.';draw()}}
async function cargar(sil){if(!CT||CARGANDO)return;CARGANDO=true;try{const d=await api({op:'ct_mine',cred:cred()});if(d.error){if(/código/i.test(d.error)){salir(true);return}throw new Error(d.error)}ITEMS=d.items||[];if(Array.isArray(d.obras)&&d.obras.length){CT.obras=d.obras;if(FOBRA&&!d.obras.some(o=>o.id===FOBRA))FOBRA=''}if(typeof d.jw==='string')CT.jw=d.jw;try{localStorage.setItem(LS,JSON.stringify(CT))}catch(e){}TS=Date.now();ERR=''}catch(e){if(!ITEMS)ERR='No se pudieron cargar tus reclamos. Revisá la conexión.'}CARGANDO=false;if(!(sil&&document.querySelector('textarea:focus,input:focus')))draw()}
function salir(){try{localStorage.removeItem(LS)}catch(e){}CT=null;ITEMS=null;SEL=null;NEW=null;draw()}
function dibujaLogin(){return `<a href="/nexo2.html" class="mut sm" style="text-decoration:none;display:inline-block;margin-bottom:8px">← Volver a Nexo</a><div class="top"><div><div class="eyebrow">Nexo</div><h1>Contratistas</h1></div></div><div class="mos">${[['plomeria','Plomería'],['electricidad','Electricidad'],['pintura','Pintura'],['mamposteria','Mampostería']].map(([f,n])=>`<i style="background-image:url(/contratistas/${f}.jpg)"><b>${n}</b></i>`).join('')}</div><p class="mut">Si en la obra te falta material, no tenés definiciones o planos, estás parado o tenés un trabajo adicional, avisalo acá: le llega directo a la Dirección y a la Jefatura de obra, con fecha y hora.</p><div class="card"><label for="cod">Tu código de contratista</label><input id="cod" autocomplete="off" autocapitalize="characters" placeholder="CT-XXXXX" value=""><button class="btn gold full" style="margin-top:14px" id="go">Entrar</button>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<p class="mut sm">El código te lo da la Dirección de obra.</p><p class="mut sm">¿Sos de la Dirección o la Jefatura? Esta pantalla es solo para contratistas: entrá a Nexo → Constructora y ahí ves sus avisos.</p></div>`}
function card(it){const n=(it.hist||[]).length,ob=OBS().length>1?`<div class="eyebrow" style="margin-top:6px;font-size:11px">${esc(it.obraNombre||obNom(it.obra))}</div>`:'';return `<div class="card" data-id="${it.id}" style="cursor:pointer"><div class="row" style="justify-content:space-between"><span class="pill p-${it.estado}">${EST[it.estado]||it.estado}</span><span class="mut sm">${f2(it.creado)}</span></div>${ob}<h2 style="margin-top:8px">${esc(it.titulo)}</h2><div class="mut sm">${esc(TIPOS[it.tipo]?TIPOS[it.tipo][0]:'')}${it.diasRetraso?` · ${it.diasRetraso} día(s) de retraso`:''}${it.monto?` · adicional estimado $ ${Number(it.monto).toLocaleString('es-AR')}`:''}</div>${it.doc?((it.archivos||[]).length?`<div class="mut sm" style="margin-top:6px">${it.archivos.length} archivo(s) adjunto(s)</div>`:''):it.primeraResp?`<div class="sm" style="margin-top:6px;color:var(--ok)">Respondido: ${f2(it.primeraResp)}</div>`:`<div class="sm" style="margin-top:6px;color:var(--warn)">Todavía sin respuesta de la obra</div>`}<div class="mut sm">${n} movimiento(s)</div></div>`}
function dibujaLista(){const O=OBS(),varias=O.length>1,its=(ITEMS||[]).filter(x=>!FOBRA||x.obra===FOBRA).slice().sort((a,b)=>b.editado-a.editado);return `<div class="top"><div><div class="eyebrow">${varias?O.length+' obras':esc(CT.obraNombre||'Obra')}</div><h1>${esc(CT.nombre)}</h1><div class="mut sm">${esc(CT.rubro||'')}</div></div><button class="btn ghost sm" id="sal">Salir</button></div><div class="card" style="margin-bottom:14px"><div class="eyebrow" style="font-size:11px">Mis obras (${O.length})</div><div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${(varias?[['','Todas']]:[]).concat(O.map(o=>[o.id,o.nombre])).map(([id,nm])=>`<button class="btn sm ${FOBRA===id||(!varias&&id)?'gold':'ghost'}" data-fob="${esc(id)}" style="padding:8px 12px">${esc(nm)}</button>`).join('')}</div>
 ${ADDOB?`<label style="margin-top:10px">Código de la otra obra</label><input id="addcod" placeholder="CT-XXXXX" autocapitalize="characters" style="text-transform:uppercase">${ADDERR?`<div class="err">${esc(ADDERR)}</div>`:''}<div class="row" style="margin-top:8px"><button class="btn" id="addno">Cancelar</button><button class="btn gold" id="addsi">Sumar obra</button></div>`:`<button class="btn ghost sm" id="addob" style="margin-top:10px">＋ Sumar otra obra (tengo otro código)</button>`}</div><button class="btn gold full" id="nuevo">+ Avisar un problema</button><div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="npres">Enviar presupuesto</button><button class="btn" style="flex:1" id="nmat">Enviar listado de materiales</button></div><button class="btn full" style="margin-top:10px;border-color:var(--gold);color:var(--gold)" id="naud">📋 Auditoría de obra (qué se puede avanzar y qué no)</button>${ERR?`<div class="err">${esc(ERR)}</div>`:''}<h2 style="margin:18px 0 4px">Mis avisos y envíos</h2>${ITEMS==null?'<p class="mut">Cargando…</p>':its.length?its.map(card).join(''):'<p class="mut">Todavía no cargaste ningún aviso.</p>'}`}
function dibujaNuevo(){const n=NEW,doc=n.tipo==='presupuesto'||n.tipo==='materiales',O=OBS(),selOb=O.length>1?`<label>¿En qué obra?</label><select id="n-obra"><option value="">Elegí la obra…</option>${O.map(o=>`<option value="${esc(o.id)}"${n.obra===o.id?' selected':''}>${esc(o.nombre)}</option>`).join('')}</select>`:'';
 const cab=doc?`<button class="btn ghost sm" id="atras">← Volver</button><h1 style="margin-top:10px">${n.tipo==='presupuesto'?'Enviar presupuesto':'Enviar listado de materiales'}</h1><p class="mut sm">Le llega a la Dirección de obra y queda guardado en tu ficha de la obra. No es una alerta.</p>`:`<button class="btn ghost sm" id="atras">← Volver</button><h1 style="margin-top:10px">¿Qué está pasando?</h1><div class="tipos" style="margin-top:12px">${['material','definicion','retraso','adicional','otro'].map(k=>`<button data-tipo="${k}" class="${n.tipo===k?'on':''}">${TIPOS[k][0]}</button>`).join('')}</div>${n.tipo?`<p class="mut sm">${TIPOS[n.tipo][1]}</p>`:''}`;
 return cab+selOb+(doc?`<label>Título (opcional)</label><input id="n-tit" maxlength="200" value="${esc(n.titulo)}" placeholder="${n.tipo==='presupuesto'?'Ej: Presupuesto de plomería PB y 1° piso':'Ej: Listado de materiales de plomería'}">`:`<label>Resumen (qué falta o qué pasó)</label><input id="n-tit" maxlength="200" value="${esc(n.titulo)}" placeholder="Ej: No hay definición de dónde va el cuerpo de ducha">`)+`<label>${doc?'Detalle o aclaraciones':'Detalle'}</label><textarea id="n-desc" placeholder="${doc?'Qué incluye, condiciones, plazos…':'Planta, ambiente, qué necesitás, desde cuándo…'}">${esc(n.desc)}</textarea><label>Tarea o ambiente (opcional)</label><input id="n-tar" maxlength="200" value="${esc(n.tarea)}" placeholder="Ej: Baño principal PB">`+(doc?(n.tipo==='presupuesto'?`<label>Monto total ($)</label><input id="n-monto" inputmode="numeric" value="${esc(n.monto)}" placeholder="0">`:''):`<div class="row"><div style="flex:1"><label>Días de retraso hasta hoy</label><input id="n-dias" inputmode="numeric" value="${esc(n.dias)}" placeholder="0"></div><div style="flex:1"><label>Adicional estimado ($)</label><input id="n-monto" inputmode="numeric" value="${esc(n.monto)}" placeholder="0"></div></div>`)+(doc?`<label>Archivos (PDF, Excel, Word o fotos)</label><input id="n-arc" type="file" multiple accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,image/*"><div class="mut sm" style="margin-top:6px">${n.archivos.map(a=>esc(a.n)).join(' · ')}</div>`:`<label>Fotos (opcional)</label><input id="n-fot" type="file" accept="image/*" multiple><div class="fotos">${n.fotos.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`)+`${n.subiendo?'<p class="mut sm">Subiendo archivos…</p>':''}${ERR?`<div class="err">${esc(ERR)}</div>`:''}<button class="btn gold full" style="margin-top:16px" id="env" ${n.enviando||n.subiendo?'disabled':''}>${n.enviando?'Enviando…':doc?'Enviar a Dirección':'Enviar a Dirección y Jefatura'}</button>`}
/* ===== Auditoría de obra: estado de cada tarea, qué no se puede avanzar y por qué (con la gente que hay) ===== */
let AUD=null;const EAUD={avanza:['✅ Se puede avanzar','var(--ok)'],material:['⛔ No se puede: falta material','var(--bad)'],definicion:['⛔ No se puede: falta definición / plano','var(--warn)'],otro:['⛔ No se puede: otro motivo','var(--warn)'],terminado:['✔ Terminado','var(--mut)']};
function hoyISO(){const d=new Date(Date.now()-3*36e5);return d.toISOString().slice(0,10)}
const diasDesde=f=>{if(!f)return 0;const t=Date.parse(f+'T12:00:00-03:00');return t?Math.max(0,Math.floor((Date.now()-t)/864e5)):0};
const fISO=f=>f?f.split('-').reverse().join('/'):'';
function audReclamos(ob){return (ITEMS||[]).filter(x=>!x.doc&&x.obra===ob&&!['cerrado','rechazado','resuelto'].includes(x.estado)).map(x=>({titulo:x.titulo,tipo:TIPOS[x.tipo]?TIPOS[x.tipo][0]:x.tipo,dias:Math.floor((Date.now()-x.creado)/864e5)}))}
function audConcl(a){const bl=a.items.filter(x=>x.tarea.trim()&&['material','definicion','otro'].includes(x.est)),mat=bl.filter(x=>x.est==='material'),av=a.items.filter(x=>x.tarea.trim()&&x.est==='avanza');let t='';
 const pers=+a.personal||0,oc=+a.ociosos||0;
 if(pers)t+=`Hoy hay ${pers} persona${pers>1?'s':''} en obra${oc?`, de las cuales ${oc} no pueden trabajar por lo que se detalla abajo`:''}. `;
 if(mat.length)t+=`${mat.length} tarea${mat.length>1?'s no se pueden':' no se puede'} avanzar por FALTA DE MATERIAL: ${mat.map(x=>x.tarea+(x.falta?' (falta '+x.falta+(x.pedido?', pedido hace '+diasDesde(x.pedido)+' días':'')+')':'')).join('; ')}. `;
 const otras=bl.filter(x=>x.est!=='material');if(otras.length)t+=`${otras.length} tarea${otras.length>1?'s':''} frenada${otras.length>1?'s':''} por ${otras.map(x=>(x.est==='definicion'?'falta de definición/plano':'otro motivo')+' ('+x.tarea+')').join('; ')}. `;
 if(av.length)t+=`Se puede avanzar en: ${av.map(x=>x.tarea).join(', ')}. `;
 if(mat.length&&pers)t+='La falta de avance en esas tareas no es por falta de mano de obra: hay personal disponible y lo que falta es el material.';
 return t.trim()}
function dibujaAud(){const a=AUD,O=OBS(),rec=a.obra?audReclamos(a.obra):[];
 return `<button class="btn ghost sm" id="atras">← Volver</button><h1 style="margin-top:10px">Auditoría de obra</h1><p class="mut sm">Recorré la obra y anotá cada tarea: si se puede avanzar o qué la frena. Sale un PDF para mandar por WhatsApp y le llega a la Dirección.</p>
 ${O.length>1?`<label>¿Qué obra recorriste?</label><select id="a-obra"><option value="">Elegí la obra…</option>${O.map(o=>`<option value="${esc(o.id)}"${a.obra===o.id?' selected':''}>${esc(o.nombre)}</option>`).join('')}</select>`:''}
 <div class="row" style="gap:10px"><div style="flex:1"><label>Fecha</label><input type="date" id="a-fecha" value="${esc(a.fecha)}"></div></div>
 <div class="row" style="gap:10px"><div style="flex:1"><label>Personas en obra hoy</label><input id="a-pers" inputmode="numeric" value="${esc(a.personal)}" placeholder="Ej: 6"></div><div style="flex:1"><label>¿Cuántas sin poder trabajar?</label><input id="a-oc" inputmode="numeric" value="${esc(a.ociosos)}" placeholder="Ej: 3"></div></div>
 <h2 style="margin:18px 0 6px">Tareas</h2>
 ${a.items.map((x,i)=>`<div class="card" style="border-left:4px solid ${EAUD[x.est][1]}"><div class="row" style="justify-content:space-between"><b>Tarea ${i+1}</b>${a.items.length>1?`<button class="btn ghost sm" data-aq="${i}">Quitar</button>`:''}</div>
  <label>Tarea / sector</label><input data-af="tarea" data-i="${i}" value="${esc(x.tarea)}" placeholder="Ej: Revoque grueso 1° piso">
  <label>Estado</label><select data-af="est" data-i="${i}">${Object.entries(EAUD).map(([k,v])=>`<option value="${k}"${x.est===k?' selected':''}>${v[0]}</option>`).join('')}</select>
  ${x.est==='material'?`<label>¿Qué material falta?</label><input data-af="falta" data-i="${i}" value="${esc(x.falta)}" placeholder="Ej: 40 bolsas de cal, arena"><label>¿Cuándo se pidió?</label><input type="date" data-af="pedido" data-i="${i}" value="${esc(x.pedido)}">${x.pedido?`<div class="mut sm">Pedido hace ${diasDesde(x.pedido)} días</div>`:''}`:''}
  <label>Nota</label><textarea data-af="nota" data-i="${i}" placeholder="${x.est==='avanza'?'Qué se puede hacer, con cuánta gente…':'Qué pasa, desde cuándo, qué se necesita…'}">${esc(x.nota)}</textarea>

async function subirArchivo(f){if(/^image\//.test(f.type))return {u:await subirFoto(f),n:f.name};if(f.size>15e6)throw new Error('grande');const u=await api({op:'ct_up_url',cred:cred(),obra:(NEW&&NEW.obra)||CT.obra,name:f.name,type:f.type||'application/octet-stream',size:f.size});if(!u.ok)throw new Error(u.error);const x=await fetch(u.up,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!x.ok)throw new Error('subida');return {u:u.pub,n:f.name}}
async function subirFoto(file){const img=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=r.result};r.onerror=ko;r.readAsDataURL(file)});const M=1400,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));
 const u=await api({op:'ct_up_url',cred:cred(),obra:(NEW&&NEW.obra)||((ITEMS||[]).find(x=>x.id===SEL)||{}).obra||CT.obra,name:'foto.jpg',type:'image/jpeg',size:blob.size});if(!u.ok)throw new Error(u.error);const x=await fetch(u.up,{method:'PUT',headers:{'Content-Type':'image/jpeg'},body:blob});if(!x.ok)throw new Error('subida');return u.pub}
