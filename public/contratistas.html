 const fin={resuelto:'Resuelto (confirmalo)',cerrado:'Cerrado',rechazado:'No corresponde'}[it.estado];
 return respondido(it)?`<span class="pill" style="color:var(--ok);border-color:var(--ok)">Enviado a Dirección · ${fin||'respondido'}</span>`:`<span class="pill" style="color:var(--bad);border-color:var(--bad)">Enviado a Dirección · sin respuesta</span>`}

const f2=t=>{const d=new Date(t);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})};

try{CT=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}

\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>", "guardar": "<path d=\"M5 4h11l3 3v13H5z\"/><path d=\"M8 4v5h8V4M8 20v-6h8v6\"/>", "clip": "<path d=\"M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8\"/>", "borrar": "<path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/>", "lapiz": "<path d=\"M4 20l4-1 11-11-3-3L5 16z\"/><path d=\"M14 6l3 3\"/>", "cumpl": "<path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"/><path d=\"M14 3v6h6M8.5 14.5l2.2 2.2 4.8-4.8\"/>"};const gi=n=>`<span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${GI[n]||''}</svg></span>`;

/* varias obras con el mismo código: el contratista elige en cuál reclama */
let FOBRA='';const OBS=()=>(CT&&Array.isArray(CT.obras)&&CT.obras.length?CT.obras:CT?[{id:CT.obra,nombre:CT.obraNombre,jw:CT.jw||''}]:[]);
const obNom=id=>{const o=OBS().find(x=>x.id===id);return o?o.nombre:(CT&&CT.obraNombre)||'Obra'};
/* sumar otra obra con otro código, sin salir */
let ADDOB=false,ADDERR='';

async function subirVinculos(){if(!CT||CT.vincOk||!(CT.codigos||[]).length)return;try{for(const c of CT.codigos)await api({op:'ct_vincular',cred:cred(),nuevo:c});CT.vincOk=1;(localStorage.setItem(LS,JSON.stringify(CT)),ckGuardar())}catch(e){}}
async function sumarCodigo(cod){cod=String(cod||'').toUpperCase().replace(/\s+/g,'');ADDERR='';if(!cod){ADDERR='Escribí el código';draw();return}
 if(cod===CT.codigo||(CT.codigos||[]).includes(cod)){ADDERR='Ese código ya está sumado';draw();return}
 try{const d=await api({op:'ct_login',codigo:cod});if(!d.ok){ADDERR='Código incorrecto. Pedíselo a la Dirección de obra.';draw();return}
  try{await api({op:'ct_vincular',cred:cred(),nuevo:cod})}catch(e){}
  CT.codigos=(CT.codigos||[]).concat([cod]);const ya=new Set(OBS().map(o=>o.id));CT.obras=OBS().concat((d.ct.obras||[{id:d.ct.obra,nombre:d.ct.obraNombre,jw:d.ct.jw||''}]).filter(o=>!ya.has(o.id)));

  ${x.est==='material'?`<label>¿Qué material falta?</label><input data-af="falta" data-i="${i}" value="${esc(x.falta)}" placeholder="Ej: 40 bolsas de cal, arena"><label>¿Cuándo se pidió?</label><input type="date" data-af="pedido" data-i="${i}" value="${esc(x.pedido)}">${x.pedido?`<div class="mut sm">Pedido hace ${diasDesde(x.pedido)} días</div>`:''}`:''}
  ${a.obra==='*'?`<details style="margin-top:6px"${x.nota||x.fotos.length?' open':''}><summary class="mut sm" style="cursor:pointer">Nota y fotos${x.nota||x.fotos.length?' ✓':''}</summary>`:''}<label>Nota</label><textarea data-af="nota" data-i="${i}" placeholder="${x.est==='avanza'?'Qué se va a hacer, detalles…':'Qué pasa, desde cuándo, qué se necesita…'}">${esc(x.nota)}</textarea>
  <label>Fotos de esta tarea (${x.fotos.length}/10)</label>${x.fotos.length?`<div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0">${x.fotos.map((u,k)=>`<div style="position:relative"><img src="${esc(u)}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:10px;display:block"><button type="button" data-afdel="${i}:${k}" aria-label="Quitar foto" style="position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#c8463e;color:#fff;font-weight:700;cursor:pointer;line-height:24px;padding:0">✕</button></div>`).join('')}</div>`:''}${x.fotos.length<10?`<label class="btn full" style="cursor:pointer;margin-top:6px">${gi('foto')}${a.inf&&x.est==='terminado'?'Subir foto de que quedó terminada':a.inf&&x.est==='parcial'?'Subir foto de lo que se hizo':'Sacar o subir foto'+(x.est!=='avanza'?' del problema':'')}<input type="file" accept="image/*" multiple data-afot="${i}" hidden></label>`:''}${a.obra==='*'?'</details>':''}</div>`;
 if(a.obra!=='*')return a.items.map(card).join('');
 const orden=[];a.items.forEach(x=>{const k=x.obra||'';if(!orden.includes(k))orden.push(k)});orden.sort((p,q)=>(p===''?1:0)-(q===''?1:0));
 return orden.map(k=>{const idx=a.items.map((x,i)=>i).filter(i=>(a.items[i].obra||'')===k);
  return `<div class="card" style="border:2px solid ${k?'var(--gold,#b8915a)':'var(--bad)'}!important"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-size:19px">${k?esc(obNom(k)):'Sin obra asignada'}</b><span class="mut sm">${idx.length} punto${idx.length===1?'':'s'}</span></div>${k?'':'<div class="sm" style="color:var(--bad);margin-top:4px">Elegí la obra de cada uno:</div>'}

 ${a.inf?(()=>{const sel=O.find(o=>o.id===a.obra),on=nrm(a.inf.obraTxt),ok=sel&&on&&(nrm(sel.nombre).includes(on)||on.includes(nrm(sel.nombre)));return `<div class="card" style="border:2px solid ${!a.obra?'var(--bad)':ok?'var(--ok)':'var(--warn)'}!important"><label style="margin-top:0">¿De qué obra es este informe?</label><select id="a-obra"><option value="">Elegí la obra…</option>${O.length>1?`<option value="*"${a.obra==='*'?' selected':''}>Todas las obras · se divide por obra</option>`:''}${O.map(o=>`<option value="${esc(o.id)}"${a.obra===o.id?' selected':''}>${esc(o.nombre)}</option>`).join('')}</select><div class="sm" style="margin-top:6px;color:${!a.obra?'var(--bad)':a.obra==='*'||ok?'var(--ok)':'var(--warn)'}">${a.obra==='*'?(()=>{const sin=a.items.filter(x=>!x.obra).length,cn={};a.items.forEach(x=>{if(x.obra)cn[x.obra]=(cn[x.obra]||0)+1});return `✓ Informe de todas las obras: se arma un solo pedido por obra con todos sus puntos; el viernes tildás cuáles se cumplieron (${Object.entries(cn).map(([k,n])=>esc(obNom(k))+': '+n).join(' · ')||'—'}).${sin?` <b style="color:var(--bad)">Falta elegir la obra de ${sin} punto${sin>1?'s':''}.</b>`:''}`})():!a.obra?`El informe dice <b>“${esc(a.inf.obraTxt||'sin nombre')}”</b> y no coincide con ninguna de tus obras: elegí cuál es.`:ok?`✓ Coincide con el informe (“${esc(a.inf.obraTxt)}”)`:`⚠ El informe dice “${esc(a.inf.obraTxt||'sin nombre')}”: fijate que sea la obra correcta.`}</div></div>`})():O.length>1?`<label>¿Qué obra recorriste?</label><select id="a-obra"><option value="">Elegí la obra…</option>${O.map(o=>`<option value="${esc(o.id)}"${a.obra===o.id?' selected':''}>${esc(o.nombre)}</option>`).join('')}</select>`:''}
 <div ${a.obra==='*'?'hidden':''}> <div class="row" style="gap:10px"><div style="flex:1"><label>Fecha</label><input type="date" id="a-fecha" value="${esc(a.fecha)}"></div></div>
 <div class="row" style="gap:10px"><div style="flex:1"><label>Personas en obra hoy</label><input id="a-pers" inputmode="numeric" value="${esc(a.personal)}" placeholder="Ej: 6"></div><div style="flex:1"><label>¿Cuántas sin poder trabajar?</label><input id="a-oc" inputmode="numeric" value="${esc(a.ociosos)}" placeholder="Ej: 3"></div></div>
 <h2 style="margin:18px 0 6px">Tareas</h2></div>
 ${audItemsHtml(a,O)}
 <div ${a.obra==='*'?'hidden':''}><button class="btn full" id="a-add">${gi('mas')}Agregar otra tarea</button>
 <h2 style="margin:18px 0 4px">Fotos de problemas</h2><div class="mut sm">Algo que se vio en la obra y no es de una tarea puntual: sacá la foto y escribí qué se ve. Van en el PDF.</div>
 ${(AUD.fotosP||[]).map((f,k)=>`<div class="card" style="padding:10px;margin-top:8px"><div class="row" style="gap:10px;align-items:flex-start"><img src="${esc(f.u)}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none"><div style="flex:1"><textarea data-apn="${k}" rows="3" placeholder="¿Qué problema se ve? (ej: fisura en losa, humedad, material roto)">${esc(f.n||'')}</textarea></div><button type="button" class="btn ghost sm" data-apdel="${k}" aria-label="Quitar foto">✕</button></div></div>`).join('')}
 ${(AUD.fotosP||[]).length<12?`<label class="btn gold full" style="cursor:pointer;margin-top:8px">${gi('foto')}Sacar o subir foto de un problema<input type="file" accept="image/*" multiple id="a-fp" hidden></label>`:''}
 ${rec.length?`<h2 style="margin:18px 0 6px">Reclamos abiertos de esta obra</h2><div class="mut sm">Los que marques van <b>adentro de esta auditoría</b>: a la Dirección le llega un solo aviso.</div>${rec.map(r=>`<label style="display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:15px;color:var(--ink)"><input type="checkbox" data-arec="${esc(r.id)}" ${(a.sinRec||[]).includes(r.id)?'':'checked'} style="width:22px;height:22px;margin-top:2px;flex:none"><span>${r.num?'N° '+esc(r.num)+' · ':''}${esc(r.tipo)}: ${esc(r.titulo)} <span class="mut sm">— hace ${r.dias} días</span></span></label>`).join('')}`:''}
 <h2 style="margin:18px 0 6px">Conclusión</h2><textarea id="a-concl" style="min-height:120px" placeholder="Tocá 'Armar conclusión' o escribila vos">${esc(a.concl)}</textarea><button class="btn sm" style="margin-top:6px" id="a-auto">${gi('lapiz')}Armar conclusión con lo cargado</button></div>
 ${AUD.subiendo?'<div class="mut sm" style="margin-top:10px">Subiendo fotos…</div>':''}${ERR?`<div class="err">${esc(ERR)}</div>`:''}
 <button class="btn full" style="margin-top:14px" id="a-guardar">${gi('guardar')}Guardar borrador y seguir en la obra</button>
 <button class="btn gold full" style="margin-top:10px" id="a-env" ${AUD.enviando||AUD.subiendo?'disabled':''}>${AUD.enviando?'Enviando…':AUD.obra==='*'?(()=>{const n=new Set(AUD.items.map(x=>x.obra).filter(Boolean)).size;return 'Enviar '+n+' pedido'+(n===1?'':'s')+' (uno por obra)'})():AUD.inf?'Enviar cumplimiento semanal y armar PDF':'Enviar reclamo (auditoría) y armar PDF'}</button>`}
function leerAud(){const a=AUD,g=i=>{const e=document.getElementById(i);return e?e.value:null};if(g('a-obra')!=null)a.obra=g('a-obra');a.fecha=g('a-fecha')||a.fecha;a.personal=(g('a-pers')||'').replace(/\D/g,'');a.ociosos=(g('a-oc')||'').replace(/\D/g,'');const c=g('a-concl');if(c!=null)a.concl=c;
 document.querySelectorAll('[data-af]').forEach(e=>{const x=a.items[+e.dataset.i];if(x)x[e.dataset.af]=e.value})}
function ligaAud(){/* cada cambio queda guardado al instante, así la actualización automática no borra nada */
 document.querySelectorAll('[data-af]').forEach(e=>e.addEventListener('input',()=>{const x=AUD.items[+e.dataset.i];if(x)x[e.dataset.af]=e.value}));
 [['a-fecha','fecha'],['a-concl','concl'],['a-obra','obra']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.addEventListener('input',()=>{AUD[k]=e.value})});
 [['a-pers','personal'],['a-oc','ociosos']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.addEventListener('input',()=>{AUD[k]=e.value.replace(/\D/g,'')})});
 $('#atras').onclick=async()=>{leerAud();const g=borrTiene(AUD);if(g){if(!AUD.id)AUD.id='b'+Date.now();await borrGuardar()}VISTA='lista';ERR='';AUD=null;draw();if(g)aviso('Quedó guardada como borrador: la seguís en la obra')};
 if($('#a-guardar'))$('#a-guardar').onclick=async()=>{leerAud();if(!AUD.id)AUD.id='b'+Date.now();if(!borrTiene(AUD)){ERR='Cargá al menos una tarea';draw();return}await borrGuardar();VISTA='lista';ERR='';AUD=null;draw();aviso('Borrador guardado ✓ Lo abrís desde cualquier equipo')};
 document.querySelectorAll('#app input,#app textarea,#app select').forEach(e=>e.addEventListener('input',borrAuto));borrAuto();
 document.querySelectorAll('select[data-af="est"]').forEach(e=>e.onchange=()=>{leerAud();draw()});
 if($('#a-obra'))$('#a-obra').onchange=()=>{leerAud();draw()};
 const pd=document.querySelectorAll('input[data-af="pedido"],input[data-af="fin"]');pd.forEach(e=>e.onchange=()=>{leerAud();draw()});
 $('#a-add').onclick=()=>{leerAud();AUD.items.push({tarea:'',est:'material',falta:'',pedido:'',nota:'',fotos:[]});draw()};
 document.querySelectorAll('[data-aq]').forEach(b=>b.onclick=()=>{leerAud();AUD.items.splice(+b.dataset.aq,1);draw()});
 $('#a-auto').onclick=()=>{leerAud();AUD.concl=audConcl(AUD);draw()};
 document.querySelectorAll('[data-afot]').forEach(inp=>inp.onchange=async e=>{leerAud();const x=AUD.items[+inp.dataset.afot],fs=[...e.target.files];AUD.subiendo=true;ERR='';NEW={obra:AUD.obra||CT.obra};draw();try{for(const f of fs.slice(0,10-x.fotos.length))x.fotos.push(await subirFoto(f))}catch(er){ERR='No se pudo subir una foto. Probá de nuevo.'}NEW=null;AUD.subiendo=false;draw()});
 document.querySelectorAll('[data-afdel]').forEach(b=>b.onclick=()=>{leerAud();const [i,k]=b.dataset.afdel.split(':').map(Number);AUD.items[i].fotos.splice(k,1);draw();borrAuto()});
 document.querySelectorAll('[data-apdel]').forEach(b=>b.onclick=()=>{leerAud();AUD.fotosP.splice(+b.dataset.apdel,1);draw();borrAuto()});
 document.querySelectorAll('[data-apn]').forEach(t=>t.addEventListener('input',()=>{const f=(AUD.fotosP||[])[+t.dataset.apn];if(f)f.n=t.value}));
 if($('#a-fp'))$('#a-fp').onchange=async e=>{leerAud();AUD.fotosP=AUD.fotosP||[];const fs=[...e.target.files];AUD.subiendo=true;ERR='';NEW={obra:AUD.obra||CT.obra};draw();try{for(const f of fs.slice(0,12-AUD.fotosP.length))AUD.fotosP.push({u:await subirFoto(f),n:''})}catch(er){ERR='No se pudo subir una foto. Probá de nuevo.'}NEW=null;AUD.subiendo=false;draw();borrAuto();const ts=document.querySelectorAll('[data-apn]');const t=ts[ts.length-1];if(t&&!t.value)t.focus()};
 document.querySelectorAll('[data-arec]').forEach(c=>c.onchange=()=>{const S2=new Set(AUD.sinRec||[]);c.checked?S2.delete(c.dataset.arec):S2.add(c.dataset.arec);AUD.sinRec=[...S2]});
 if($('#a-obra'))$('#a-obra').onchange=()=>{leerAud();draw();borrAuto()};
 if($('#a-infotras'))$('#a-infotras').onclick=()=>{leerAud();AUD.infTodas=true;AUD.items=AUD.items.concat(AUD.infOtras).sort((x,y)=>(x.n||0)-(y.n||0));AUD.infOtras=[];draw();borrAuto()};
 if($('#a-pend'))$('#a-pend').onclick=()=>{leerAud();let n=0;AUD.items.forEach(x=>{if(!x.est){x.est='pendiente';n++}});draw();borrAuto();aviso(n?n+' pedido'+(n>1?'s':'')+' en pendiente':'No había pedidos sin contestar')};
 document.querySelectorAll('select[data-af="obra"]').forEach(e=>e.onchange=()=>{leerAud();draw();borrAuto()});
 $('#a-env').onclick=enviarAud}
async function enviarAud(){leerAud();const a0=AUD;if(a0.obra!=='*')return enviarAud1();
 const its0=a0.items.filter(x=>x.tarea.trim());its0.forEach(x=>{if(!x.est)x.est='pendiente'});const sin=its0.find(x=>!x.obra);if(sin){ERR=`Elegí de qué obra es: “${sin.tarea}”`;draw();return}
 const sinR=its0.find(x=>!x.est);if(sinR){ERR=`Falta contestar: “${sinR.tarea}” (si es para controlar el viernes, marcalo como pendiente)`;draw();return}
 const grupos=[...new Set(its0.map(x=>x.obra))];let hechos=0;
 for(let k=0;k<grupos.length;k++){const ob=grupos[k],grp=its0.filter(x=>x.obra===ob),antes=(ITEMS||[]).length;
  AUD={...a0,id:k===grupos.length-1?a0.id:'',obra:ob,items:grp,concl:'',inf:{...a0.inf,obraTxt:obNom(ob)}};ERR='';
  await enviarAud1(true);if((ITEMS||[]).length===antes){const quedan=its0.filter(x=>grupos.slice(k).includes(x.obra));AUD={...a0,items:quedan,enviando:false};ERR=(ERR||'No se pudo enviar')+(hechos?' · Ya se mandaron '+hechos+' obra'+(hechos>1?'s':'')+'; quedan las demás.':'');VISTA='aud';draw();return}hechos++}
 AUD=null;VISTA='lista';draw();scrollTo(0,0);aviso('Listo ✓ Se mandó un cumplimiento semanal por obra ('+hechos+'). El viernes marcás cada pedido en cada uno.')}
async function enviarAud1(lote){if(!lote)leerAud();const a=AUD;if((OBS().length>1||a.inf)&&!a.obra){ERR=a.inf?'Elegí de qué obra es el informe':'Elegí qué obra recorriste';draw();scrollTo(0,0);return}
 const its=a.items.filter(x=>x.tarea.trim());if(!its.length){ERR='Cargá al menos una tarea';draw();return}
 const sinR=its.find(x=>!x.est);if(sinR){ERR=`Falta contestar: “${sinR.tarea}”`;draw();return}its.forEach(x=>{x.gente=String(x.gente||'').replace(/\D/g,'')});const sinD=its.find(x=>x.est==='avanza'&&(!x.gente||!x.fin));if(sinD){ERR=`En “${sinD.tarea}” falta ${!sinD.gente?'cuánta gente asignás':'cuándo queda terminada'}`;draw();return}
 if(!a.concl.trim())a.concl=audConcl({...a,items:its});
 a.enviando=true;ERR='';draw();const ob=a.obra||CT.obra,rec=audReclamos(ob).filter(r=>!(a.sinRec||[]).includes(r.id));
