/* ---- cabecera y navegación ---- */
const NAV_PRINC=[["chat","Chat"],["props","Propiedades"],["clientes","Clientes"],["agenda","Agenda"]],NAV_MAS=[["ops","Operaciones"],["ajustes","Ajustes"]];
function hdr(){const claro=D.perfil.tema==="claro";
  $("#hdr").setAttribute("style",`background:${T.navy};color:#fff;padding:16px 18px 12px;padding-top:max(16px, env(safe-area-inset-top));border-bottom:1px solid ${BRASS}`);
  $("#hdr").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:9.5px;font-weight:700;color:${BRASS};letter-spacing:.22em;text-transform:uppercase">Privado · ${esc(D.perfil.nombre||"Nanina")} · Broker inmobiliaria</div><div style="font-size:22px;font-weight:600;letter-spacing:.01em;margin-top:2px">${esc(D.perfil.asist||"Mi Asistente")}</div></div>
  <div style="display:flex;align-items:center;gap:10px"><button class="tswitch${claro?" claro":""}" role="switch" aria-checked="${claro}" aria-label="Modo claro u oscuro" id="btema"><svg class="ts-s" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><svg class="ts-m" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="ts-k"></span></button>
  ${VISTA==="chat"?`<button id="blimp" style="background:transparent;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);border-radius:7px;padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.03em;cursor:pointer">Limpiar</button>`:""}</div></div>`;
  $("#btema").onclick=()=>{D.perfil.tema=claro?"oscuro":"claro";save();render()};
  const bl=$("#blimp");if(bl)bl.onclick=()=>{if(confirm("¿Borrar la conversación? Los datos cargados no se borran.")){D.chat=[];save();render()}}}
function navR(){const t=(id,lb)=>`<button class="tabg${VISTA===id?" on":""}" aria-current="${VISTA===id?"page":"false"}" data-v="${id}"><span class="gem">${ico(id,22)}</span>${id==="agenda"&&hoyCount()?`<span class="bdg c">${hoyCount()}</span>`:""}<span class="tl">${lb}</span></button>`;
  $("#nav").innerHTML=NAV_PRINC.map(([i,l])=>t(i,l)).join("")+`<button class="tabg${NAV_MAS.some(x=>x[0]===VISTA)?" on":""}" data-mas="1"><span class="gem">${ico("mas",22)}</span><span class="tl">Más</span></button>`;
  $("#rail").innerHTML=NAV_PRINC.concat(NAV_MAS).map(([i,l])=>t(i,l)).join("");
  $("#masov").innerHTML=MAS?`<div class="masov" data-cmas="1"><div class="massheet">${NAV_MAS.map(([i,l])=>`<button class="masit${VISTA===i?" on":""}" data-v="${i}"><span class="gem">${ico(i,22)}</span><span class="tl">${l}</span></button>`).join("")}</div></div>`:""}
const hoyCount=()=>D.agenda.filter(a=>!a.hecho&&a.f===hoy()).length;
document.addEventListener("click",e=>{const v=e.target.closest("[data-v]");if(v){VISTA=v.dataset.v;MAS=false;FIL="";FES="";FORM=null;render();return}
  if(e.target.closest("[data-mas]")){MAS=!MAS;navR();return}if(e.target.matches("[data-cmas]")){MAS=false;navR()}});
/* ---- render ---- */
function render(){tema();hdr();navR();const m=$("#main");
  if(VISTA==="chat"){m.innerHTML=vChat();bindChat();return}
  m.innerHTML=`<div style="flex:1;overflow-y:auto;padding:14px 16px 24px">${VISTA==="props"?vProps():VISTA==="clientes"?vCli():VISTA==="agenda"?vAg():VISTA==="ops"?vOps():vAjustes()}</div>`;
  bindVista()}
const EP={"Disponible":"#3fa66b","Reservada":"#e0b43a","Vendida":"#e2493e","Alquilada":"#e2493e","Retirada":"#8c8c8c"},EC={"Nuevo":"#8c8c8c","En seguimiento":"#e0b43a","Visitó":"#e0b43a","Ofertó":"#3fa66b","Cerró":"#3fa66b","Perdido":"#e2493e"},EO={"Reserva":"#e0b43a","Boleto":"#e0b43a","Escriturada / Firmado":"#3fa66b","Comisión cobrada":"#3fa66b","Caída":"#e2493e"};
const tag=(t,c)=>`<span style="font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:${c};border:1px solid ${c};border-radius:999px;padding:3px 9px;white-space:nowrap">${esc(t)}</span>`;
const match=(o,q)=>!q||JSON.stringify(o).toLowerCase().includes(q.toLowerCase());
const filtros=(list,cur)=>`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><button style="${S.chip(!cur)}" data-fes="">Todos</button>${list.map(x=>`<button style="${S.chip(cur===x)}" data-fes="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
const buscador=ph=>`<input id="q" placeholder="${ph}" value="${esc(FIL)}" style="${S.inp()};margin-bottom:10px">`;
/* esquema de formularios */
const SCH={
 prop:{col:"props",tit:"Propiedad",f:[["tit","Título (ej: 3 amb. con balcón)"],["op","Operación",["Venta","Alquiler","Alquiler temporario"]],["tipo","Tipo",["Departamento","Casa","PH","Lote","Local","Oficina","Cochera","Otro"]],["dir","Dirección"],["barrio","Barrio / zona"],["precio","Precio","money"],["mon","Moneda",["U$s","$"]],["amb","Ambientes","n"],["m2","m² totales","n"],["dueno","Dueño/a"],["tel","Teléfono del dueño"],["estado","Estado",Object.keys(EP)],["notas","Notas","area"]]},
 cli:{col:"clientes",tit:"Cliente",f:[["nom","Nombre"],["tel","Teléfono (WhatsApp)"],["mail","Email"],["busca","Qué busca (zona, ambientes, operación)","area"],["presu","Presupuesto máximo","money"],["mon","Moneda",["U$s","$"]],["estado","Estado",Object.keys(EC)],["notas","Notas","area"]]},
 ag:{col:"agenda",tit:"Evento",f:[["tit","Qué es (visita, tasación, reunión…)"],["f","Fecha","date"],["h","Hora","time"],["lugar","Lugar / propiedad"],["cli","Con quién"],["nota","Notas","area"],["hecho","Estado",["Pendiente","Hecho"]]]},
 op:{col:"ops",tit:"Operación",f:[["prop","Propiedad"],["cli","Cliente / comprador"],["tipo","Tipo",["Venta","Alquiler","Alquiler temporario"]],["monto","Monto de la operación","money"],["mon","Moneda",["U$s","$"]],["pct","Comisión %","n"],["estado","Estado",Object.keys(EO)],["f","Fecha","date"],["notas","Notas","area"]]}};
function formHtml(k){const S2=SCH[k],id=FORM.id,o=id?D[S2.col].find(x=>x.id===id)||{}:{};const val=c=>c==="hecho"?(o.hecho?"Hecho":"Pendiente"):c==="f"&&!id?hoy():o[c]??"";
  return`<div style="background: ${CARD};border:1px solid ${BRASS};border-radius:12px;padding:13px;margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:${T.sub};text-transform:uppercase;margin-bottom:9px">${id?"Editar":"Nuevo"}: ${S2.tit}</div>
  ${S2.f.map(([c,l,t])=>`<div style="${S.lbl()}">${l}</div>${Array.isArray(t)?`<select id="f_${c}" style="${S.inp()}">${t.map(x=>`<option${val(c)===x?" selected":""}>${x}</option>`).join("")}</select>`:t==="area"?`<textarea id="f_${c}" rows="3" style="${S.inp()};resize:vertical">${esc(val(c))}</textarea>`:`<input id="f_${c}" ${t==="date"?'type="date"':t==="time"?'type="time"':t==="money"||t==="n"?'inputmode="numeric"':""} ${t==="money"?"data-money":""} value="${esc(t==="money"&&val(c)!==""?fmt(val(c)):val(c))}" style="${S.inp()}">`}`).join("")}
  <div style="display:flex;gap:8px;margin-top:6px"><button data-fok style="flex:1;background:${T.accent};color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer">Guardar</button><button data-fx style="background:transparent;color:${T.sub};border:1px solid ${T.border};border-radius:9px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer">Cancelar</button>${id?`<button data-fdel style="background:transparent;color:#e2493e;border:1px solid rgba(226,73,62,.5);border-radius:9px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer">Borrar</button>`:""}</div></div>`}
const bloqueForm=(k,txt)=>FORM&&FORM.k===k?formHtml(k):`<button data-nuevo="${k}" style="${S.prim()}">＋ ${txt}</button>`;
function vProps(){const L=D.props.filter(p=>match(p,FIL)&&(!FES||p.estado===FES));
  return bloqueForm("prop","Cargar propiedad")+buscador("Buscar dirección, barrio, dueño…")+filtros(Object.keys(EP),FES)+(L.map(p=>`<div style="${S.card()};cursor:pointer" data-ed="prop:${p.id}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="font-size:16.5px;font-weight:600">${esc(p.tit||p.dir||"Propiedad")}</div>${tag(p.estado||"Disponible",EP[p.estado]||EP.Disponible)}</div>
  <div style="font-size:12.5px;color:${T.sub};margin-top:4px">${esc([p.op,p.tipo,p.dir&&p.tit?p.dir:"",p.barrio,p.amb?p.amb+" amb":"",p.m2?fmt(p.m2)+" m²":""].filter(Boolean).join(" · "))}</div><div style="display:flex;justify-content:space-between;margin-top:8px"><b style="color:${BRASS};font-size:16px">${money(p.precio,p.mon)}</b><span style="font-size:12.5px;color:${T.sub}">${esc(p.dueno||"")}</span></div></div>`).join("")||`<div style="${S.vacio()}">Todavía no hay propiedades.<br>Desde el Chat podés decir: "cargá un 3 ambientes en Palermo, venta, 180 mil dólares, dueña Laura"</div>`)}
function vCli(){const L=D.clientes.filter(c=>match(c,FIL)&&(!FES||c.estado===FES));
  return bloqueForm("cli","Cargar cliente")+buscador("Buscar nombre, qué busca…")+filtros(Object.keys(EC),FES)+(L.map(c=>`<div style="${S.card()};cursor:pointer" data-ed="cli:${c.id}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="font-size:16.5px;font-weight:600">${esc(c.nom||"Cliente")}</div>${tag(c.estado||"Nuevo",EC[c.estado]||EC.Nuevo)}</div>
  <div style="font-size:12.5px;color:${T.sub};margin-top:4px">${esc(c.busca||"")}${num(c.presu)?" · hasta "+money(c.presu,c.mon):""}</div>${c.tel?`<div style="font-size:12.5px;color:${T.sub};margin-top:2px">📞 ${esc(c.tel)}</div>`:""}</div>`).join("")||`<div style="${S.vacio()}">Todavía no hay clientes.<br>Desde el Chat podés decir: "anotá a Juan, busca 2 ambientes en Belgrano hasta 120 mil dólares"</div>`)}
function vAg(){const A=D.agenda.slice().sort((a,b)=>(a.f+(a.h||"")).localeCompare(b.f+(b.h||""))),h=hoy(),prox=A.filter(a=>!a.hecho&&a.f>=h),pas=A.filter(a=>a.hecho||a.f<h).reverse().slice(0,30);
  const it=a=>`<div style="${S.card()};cursor:pointer" data-ed="ag:${a.id}"><div style="display:flex;justify-content:space-between;gap:10px"><div><div style="font-size:15.5px;font-weight:600">${esc(a.tit||"Evento")}</div><div style="font-size:12.5px;color:${T.sub};margin-top:3px">${fFec(a.f)}${a.h?" · "+esc(a.h)+" hs":""}${a.lugar?" · "+esc(a.lugar):""}${a.cli?" · "+esc(a.cli):""}</div></div>${a.hecho?tag("Hecho","#3fa66b"):a.f===h?tag("Hoy",BRASS):""}</div>${a.nota?`<div style="font-size:12.5px;color:${T.sub};margin-top:5px">${esc(a.nota)}</div>`:""}</div>`;
  return bloqueForm("ag","Agendar")+`<div style="${S.lbl()}">Próximos</div>`+(prox.map(it).join("")||`<div style="${S.vacio()}">Agenda vacía.<br>Desde el Chat podés decir: "agendá visita con Juan el jueves a las 10 en Palermo"</div>`)+(pas.length?`<div style="${S.lbl()};margin-top:18px">Anteriores</div>`+pas.map(it).join(""):"")}
function vOps(){const L=D.ops.filter(o=>match(o,FIL)&&(!FES||o.estado===FES)),com=o=>num(o.monto)*num(o.pct)/100;
  const cob=D.ops.filter(o=>o.estado==="Comisión cobrada"),pen=D.ops.filter(o=>!["Comisión cobrada","Caída"].includes(o.estado));
  const sum=(a,m)=>a.filter(o=>(o.mon||"U$s")===m).reduce((s,o)=>s+com(o),0);
  const kpi=(l,a)=>`<div style="background: ${CARD};border:1px solid ${T.border};border-radius:12px;padding:11px 13px"><div style="font-size:9.5px;color:${T.sub};font-weight:700;letter-spacing:.1em;text-transform:uppercase">${l}</div><div style="font-size:21px;font-weight:700;color:${BRASS};margin-top:4px">U$s ${fmt(sum(a,"U$s"))}</div>${sum(a,"$")?`<div style="font-size:12px;color:${T.sub}">+ $ ${fmt(sum(a,"$"))}</div>`:""}</div>`;
  return bloqueForm("op","Cargar operación")+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">${kpi("Comisiones por cobrar",pen)}${kpi("Comisiones cobradas",cob)}</div>`+buscador("Buscar…")+filtros(Object.keys(EO),FES)+
  (L.map(o=>`<div style="${S.card()};cursor:pointer" data-ed="op:${o.id}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="font-size:16px;font-weight:600">${esc(o.prop||"Operación")}</div>${tag(o.estado||"Reserva",EO[o.estado]||EO.Reserva)}</div>
  <div style="font-size:12.5px;color:${T.sub};margin-top:4px">${esc([o.tipo,o.cli,o.f?fFec(o.f):""].filter(Boolean).join(" · "))}</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px"><span>${money(o.monto,o.mon)}</span><b style="color:${BRASS}">Comisión ${num(o.pct)?num(o.pct)+"% = ":""}${money(com(o),o.mon)}</b></div></div>`).join("")||`<div style="${S.vacio()}">Sin operaciones cargadas.<br>Desde el Chat podés decir: "cargá la reserva del 3 ambientes de Palermo, 175 mil dólares, comisión 3%"</div>`)}
function vAjustes(){const P=D.perfil;
  return`<div style="${S.card()}"><div style="font-size:10.5px;color:${BRASS};font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px">Perfil</div>
  <div style="${S.lbl()}">Tu nombre</div><input id="c_nom" value="${esc(P.nombre)}" style="${S.inp()}"><div style="${S.lbl()}">Nombre del asistente</div><input id="c_as" value="${esc(P.asist)}" style="${S.inp()}">
  <div style="${S.lbl()}">Cambiar clave (4 números)</div><input id="c_pin" inputmode="numeric" maxlength="4" placeholder="Dejala vacía para no cambiarla" style="${S.inp()}"><button id="c_ok" style="${S.prim()};margin:6px 0 0">Guardar</button><div id="c_msg" style="font-size:12.5px;color:${T.sub};margin-top:8px"></div></div>
  <div style="${S.card()}"><div style="font-size:10.5px;color:${BRASS};font-weight:700;letter-spacing:.18em;text-transform:uppercase">Voz del asistente</div><div style="font-size:13px;color:${T.sub};margin:6px 0 12px;line-height:1.4">Tocá una para escucharla y queda elegida.</div>
  <div style="display:flex;flex-direction:column;gap:8px">${VOCES.map(([id,n])=>`<button class="gbtn" data-voz="${id}" style="padding:12px 14px;justify-content:space-between;${(P.voz||"")===id?`box-shadow:inset 0 0 0 2px ${BRASS}`:""}"><span>${n}</span><span style="font-size:12px;color:${(P.voz||"")===id?BRASS:T.sub}">${(P.voz||"")===id?"✓ Elegida":"▶ Probar"}</span></button>`).join("")}</div></div>`}
function bindVista(){const q=$("#q");if(q)q.oninput=()=>{FIL=q.value;const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-money]").forEach(i=>i.oninput=()=>{const n=i.value.replace(/\D/g,"");i.value=n?Number(n).toLocaleString("es-AR"):""});
  const ok=$("#c_ok");if(ok)ok.onclick=async()=>{const P=D.perfil;P.nombre=$("#c_nom").value.trim()||"Nanina";P.asist=$("#c_as").value.trim()||"Mi Asistente";const pn=$("#c_pin").value.trim();if(/^\d{4}$/.test(pn))D.pin=await sha(pn);save();render();$("#c_msg").textContent="Guardado ✓"}}
document.addEventListener("click",async e=>{const t=e.target;
  const f=t.closest("[data-fes]");if(f){FES=f.dataset.fes;render();return}
  const n=t.closest("[data-nuevo]");if(n){FORM={k:n.dataset.nuevo,id:null};render();$("#main>div").scrollTop=0;return}
  const ed=t.closest("[data-ed]");if(ed){const[k,id]=ed.dataset.ed.split(":");FORM={k,id};render();$("#main>div").scrollTop=0;return}
  if(t.closest("[data-fx]")){FORM=null;render();return}
  if(t.closest("[data-fdel]")){const S2=SCH[FORM.k];if(confirm("¿Borrar "+S2.tit.toLowerCase()+"?")){D[S2.col]=D[S2.col].filter(x=>x.id!==FORM.id);FORM=null;save();render()}return}
  if(t.closest("[data-fok]")){const S2=SCH[FORM.k],arr=D[S2.col],o=FORM.id?arr.find(x=>x.id===FORM.id):{id:uid()};S2.f.forEach(([c,l,ty])=>{let v=$("#f_"+c).value;if(ty==="money"||ty==="n")v=num(v);if(c==="hecho")v=v==="Hecho";o[c]=v});if(!FORM.id)arr.push(o);FORM=null;save();render();return}
  const vz=t.closest("[data-voz]");if(vz){D.perfil.voz=vz.dataset.voz;save();render();decir("Hola "+(D.perfil.nombre||"")+", soy tu asistente. ¿En qué te ayudo hoy?");return}});
/* ---- chat ---- */

function vChat(){const msgs=[{r:"a",t:bienvenida()}].concat(D.chat.slice(-60));
  const b=m=>`<div style="display:flex;justify-content:${m.r==="u"?"flex-end":"flex-start"};margin-bottom:12px"><div style="max-width:88%;min-width:0">
   <div style="${m.r==="u"?`background:${T.navy};color:#fff;border:none`:`background: ${CARD};color:${T.text};border:1px solid ${T.border}`};border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere">${esc(m.t)}</div>
   ${m.r==="a"&&m.t&&m.t.length>8&&m.t!=="…"?`<button data-esc="${esc(m.t)}" style="margin-top:4px;background:none;border:none;color:${T.muted};font-size:13px;cursor:pointer;padding:2px 0">🔊 Escuchar</button>`:""}
   ${(m.wa||[]).map(w=>`<a href="https://wa.me/${esc(w.tel)}?text=${encodeURIComponent(w.txt)}" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:8px;margin-right:6px;background:#25D366;color:#fff;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;text-decoration:none">📲 WhatsApp a ${esc(w.a||w.tel)}</a>`).join("")}
   ${m.acc?`<div style="margin-top:6px;font-size:12px;color:#3fa66b;font-weight:600">✓ ${esc(m.acc)}</div>`:""}</div></div>`;
  return`<div style="display:flex;flex-direction:column;flex:1;min-height:0"><div id="scr" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 8px">${msgs.map(b).join("")}${BUSY?`<div style="color:${T.muted};font-size:13px;padding:4px 6px">Pensando…</div>`:""}</div>
  <div style="padding:10px 14px 14px;border-top:1px solid ${T.border};background:${T.bg}">
   <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap"><button class="pill${D.perfil.hablar?" on":""}" id="bhab"><span class="gem sm">${ico("altavoz",15)}</span>Voz ${D.perfil.hablar?"activada":"apagada"}</button><button class="pill${D.perfil.manejando?" on":""}" id="bman"><span class="gem sm">${ico("auto",15)}</span>${D.perfil.manejando?"Manejando: manos libres":"Modo manejando"}</button></div>
   <button class="ptt${escuchando?" rec":""}" id="ptt"><span class="gem big">${ico("mic",28)}</span><span class="pt" id="ptt_t">${cuenta?`Enviando en ${cuenta}… (tocá para seguir hablando)`:escuchando?"Escuchando… tocá cuando termines":"Tocá para hablar"}</span></button>
   <div style="display:flex;gap:8px"><button class="gbtn mic" id="bmic" title="Hablar" style="flex-shrink:0"><span class="gem sm">${ico("mic",18)}</span></button>
   <textarea id="txt" rows="1" placeholder="${escuchando?"Escuchando… hablá":"Escribí o tocá el micrófono…"}" style="flex:1;min-width:0;background: ${CARD};border:1px solid ${escuchando?"#DC2626":T.border};border-radius:12px;padding:13px 15px;font-size:16px;color:${T.text};resize:none;overflow-y:auto;max-height:140px;line-height:1.4"></textarea>
   <button class="gbtn send" id="env" style="padding:0 16px 0 8px"><span class="gem sm">${ico("enviar",15)}</span>Enviar</button></div></div></div>`}
function bindChat(){const t=$("#txt");t.value=borrador;t.oninput=()=>{borrador=t.value};t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar(t.value)}};
  $("#env").onclick=()=>enviar(t.value);$("#bmic").onclick=()=>pttToque();$("#ptt").onclick=()=>pttToque();
  $("#bhab").onclick=()=>{D.perfil.hablar=!D.perfil.hablar;if(!D.perfil.hablar){D.perfil.manejando=false;callar()}save();render()};
  $("#bman").onclick=()=>{D.perfil.manejando=!D.perfil.manejando;if(D.perfil.manejando)D.perfil.hablar=true;save();render();if(D.perfil.manejando&&!escuchando)pttToque()};
  document.querySelectorAll("[data-esc]").forEach(b=>b.onclick=()=>decir(b.dataset.esc));
  const s=$("#scr");s.scrollTop=s.scrollHeight}
/* ---- voz: hablar ---- */
let audio=null,hablando=false;
function destrabar(){try{if(!audio)audio=new Audio();if(!hablando&&(!audio.src||audio.paused)){audio.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";audio.play().catch(()=>{})}}catch{}}
document.addEventListener("pointerdown",destrabar,{capture:true});document.addEventListener("touchend",destrabar,{capture:true});
function callar(){hablando=false;try{audio&&audio.pause()}catch{}try{speechSynthesis.cancel()}catch{}}
function enLetras(n){n=Math.round(n);const U=["","un","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiún","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"],DD=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"],C=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const m100=x=>x<30?U[x]:DD[Math.floor(x/10)]+(x%10?" y "+U[x%10]:""),m1000=x=>x===0?"":x===100?"cien":(C[Math.floor(x/100)]+(x%100?" "+m100(x%100):"")).trim();
  if(n===0)return"cero";let s="";const mill=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000;
  if(mill)s+=(mill===1?"un millón":enLetras(mill)+" millones")+" ";if(mil)s+=(mil===1?"mil":m1000(mil)+" mil")+" ";if(r)s+=m1000(r);return s.trim()}
function paraVoz(t){return String(t).replace(/U\$s\s?([\d.]+)/g,(m,n)=>enLetras(num(n))+" dólares").replace(/\$\s?([\d.]+)/g,(m,n)=>enLetras(num(n))+" pesos").replace(/\b(\d{1,3}(?:\.\d{3})+)\b/g,m=>enLetras(num(m))).replace(/m²/g," metros cuadrados").replace(/[*_#>`]/g,"").replace(/https?:\/\/\S+/g,"")}
async function decir(t,alTerminar){if(!t){alTerminar&&alTerminar();return}callar();hablando=true;const txt=paraVoz(t).slice(0,2400);const fin=()=>{hablando=false;alTerminar&&alTerminar()};
  try{const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(D.perfil.voz?{texto:txt,voz:D.perfil.voz}:{texto:txt})});if(!r.ok)throw 0;
    const u=URL.createObjectURL(await r.blob());if(!audio)audio=new Audio();audio.src=u;audio.onended=fin;audio.onerror=fin;await audio.play();return}catch{}
  try{const s=new SpeechSynthesisUtterance(txt);s.lang="es-AR";s.onend=fin;s.onerror=fin;speechSynthesis.speak(s)}catch{fin()}}
/* ---- voz: escuchar (tocá para hablar, tocá cuando termines: envía a los 3 s) ---- */
let rec=null,escuchando=false,texto="",cuenta=0,tCuenta=null,borrador="";
function pttUI(){const p=$("#ptt");if(!p)return;p.className="ptt"+(escuchando?" rec":"");$("#ptt_t").textContent=cuenta?`Enviando en ${cuenta}… (tocá para seguir hablando)`:escuchando?"Escuchando… tocá cuando termines":"Tocá para hablar";const t=$("#txt");if(t){t.style.borderColor=escuchando?"#DC2626":T.border}}
function pttToque(){if(tCuenta){clearInterval(tCuenta);tCuenta=null;cuenta=0;arrancar(true);return}
  if(escuchando){try{rec.stop()}catch{}return}arrancar(false)}
function arrancar(seguir){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){D.chat.push({r:"a",t:"Este navegador no permite dictar. Usá Safari o Chrome actualizados."});render();return}
  callar();if(!seguir)texto="";const base=texto?texto+" ":"";rec=new SR();rec.lang="es-AR";rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;texto=base+s;borrador=texto;const t=$("#txt");if(t)t.value=texto};
  rec.onend=()=>{escuchando=false;if(!texto.trim()){pttUI();return}
    if(D.perfil.manejando){pttUI();enviar(texto);return}
    cuenta=3;pttUI();tCuenta=setInterval(()=>{cuenta--;if(cuenta<=0){clearInterval(tCuenta);tCuenta=null;cuenta=0;enviar(texto)}else pttUI()},1000)};
  rec.onerror=()=>{};try{rec.start();escuchando=true;pttUI()}catch{}
  if(D.perfil.manejando){let ult=Date.now(),prev="";const vig=setInterval(()=>{if(!escuchando){clearInterval(vig);return}if(texto!==prev){prev=texto;ult=Date.now()}else if(texto.trim()&&Date.now()-ult>2200){clearInterval(vig);try{rec.stop()}catch{}}},300)}}
/* ---- IA ---- */
function contexto(){const lim=a=>a.slice(-150);return JSON.stringify({hoy:hoy(),dia_semana:new Date().toLocaleDateString("es-AR",{weekday:"long"}),propiedades:lim(D.props),clientes:lim(D.clientes),agenda:lim(D.agenda.filter(a=>!a.hecho||a.f>=hoy())),operaciones:lim(D.ops)})}
function sistema(){return`Sos "${D.perfil.asist||"Mi Asistente"}", el asistente personal y privado de ${D.perfil.nombre||"Nanina"}, broker inmobiliaria en Argentina. Hablás en español rioplatense (vos), cálido, claro y directo. Tus respuestas se escuchan en voz alta (a veces manejando): contestá en 1 a 4 oraciones, sin listas largas ni símbolos, salvo que te pida detalle.
Tenés acceso completo a sus datos (propiedades, clientes, agenda y operaciones) en el JSON que te paso. Usalos para responder: qué tiene hoy o mañana, qué propiedades le sirven a un cliente (cruzá zona, ambientes, operación y presupuesto), comisiones por cobrar, a quién hacerle seguimiento. También redactás avisos de propiedades y mensajes a clientes o dueños.
Montos: dólares "U$s 180.000"; pesos "$ 1.500.000"; sin decimales. Fechas AAAA-MM-DD en las acciones.
Para CARGAR o CAMBIAR datos agregá al final una línea por acción, exactamente así:
<<ACCION>>{"tipo":"...","datos":{...}}<<FIN>>
Tipos: "agregar_propiedad" (tit, op[Venta|Alquiler|Alquiler temporario], tipo, dir, barrio, precio número, mon[U$s|$], amb, m2, dueno, tel, estado[${Object.keys(EP).join("|")}], notas); "editar_propiedad" (id + campos); "agregar_cliente" (nom, tel, mail, busca, presu, mon, estado[${Object.keys(EC).join("|")}], notas); "editar_cliente" (id + campos); "agendar" (tit, f, h "HH:MM", lugar, cli, nota); "editar_evento" (id + campos; hecho:true para marcarlo hecho); "agregar_operacion" (prop, cli, tipo, monto, mon, pct, estado[${Object.keys(EO).join("|")}], f, notas); "editar_operacion" (id + campos); "whatsapp" (tel con código de país sin + ni espacios, ej 5491155556666; a = nombre; txt = mensaje) para dejarle listo un mensaje que ella manda con un toque.
Si falta un dato, cargá igual lo que haya y decile qué falta. Nunca inventes datos. Confirmá en una oración lo que hiciste.`}
async function enviar(q){q=String(q||"").trim();if(!q||BUSY)return;borrador="";texto="";D.chat.push({r:"u",t:q});BUSY=true;save();render();
  const hist=D.chat.slice(-14).filter(m=>m.t).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));while(hist.length&&hist[0].role!=="user")hist.shift();
  hist[hist.length-1]={role:"user",content:"DATOS (JSON):\n"+contexto()+"\n\nMENSAJE: "+q};
  let out="";try{const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1500,system:sistema(),messages:hist})});const j=await r.json();
    out=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n").trim()||("No pude responder: "+(j.error&&j.error.message||"error"))}catch{out="No pude conectarme. Revisá internet y probá de nuevo."}
  const hechos=[],wa=[];out=out.replace(/<<ACCION>>([\s\S]*?)<<FIN>>/g,(m,js)=>{try{const r=aplicar(JSON.parse(js),wa);if(r)hechos.push(r)}catch{}return""}).trim();
  const msg={r:"a",t:out||"Listo."};if(hechos.length)msg.acc=hechos.join(" · ");if(wa.length)msg.wa=wa;D.chat.push(msg);BUSY=false;save();if(VISTA==="chat")render();else navR();
  if(D.perfil.hablar)decir(msg.t,()=>{if(D.perfil.manejando&&VISTA==="chat"&&!escuchando)setTimeout(()=>arrancar(false),400)})}
function aplicar(a,wa){const d=a.datos||{},T2=a.tipo,fix=o=>{["precio","presu","monto","amb","m2","pct"].forEach(k=>{if(k in o)o[k]=num(o[k])});return o};
  const add=(col,def,label)=>{const o=fix({...def,...d,id:uid()});D[col].push(o);return label+": "+(o.tit||o.nom||o.prop||o.dir||"")};
  const ed=(col,label)=>{const o=D[col].find(x=>x.id===d.id);if(!o)return null;Object.assign(o,fix({...d}));return label+" actualizado"};
  if(T2==="agregar_propiedad")return add("props",{estado:"Disponible",mon:"U$s"},"Propiedad cargada");if(T2==="editar_propiedad")return ed("props","Propiedad");
  if(T2==="agregar_cliente")return add("clientes",{estado:"Nuevo",mon:"U$s"},"Cliente cargado");if(T2==="editar_cliente")return ed("clientes","Cliente");
  if(T2==="agendar")return add("agenda",{f:hoy(),hecho:false},"Agendado");if(T2==="editar_evento")return ed("agenda","Evento");
  if(T2==="agregar_operacion")return add("ops",{estado:"Reserva",mon:"U$s"},"Operación cargada");if(T2==="editar_operacion")return ed("ops","Operación");
  if(T2==="whatsapp"&&d.txt){wa.push({tel:String(d.tel||"").replace(/\D/g,""),a:d.a||"",txt:d.txt})}return null}
/* ---- PIN al entrar (como Mi Asistente) ---- */
function pedirPin(){return new Promise(res=>{const nuevo=!D.pin,p=document.createElement("div");
  p.setAttribute("style",`position:fixed;inset:0;z-index:50;background:${T.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:${T.text}`);
  p.innerHTML=`<div style="font-size:9.5px;font-weight:700;color:${BRASS};letter-spacing:.22em;text-transform:uppercase">Privado · ${esc(D.perfil.nombre||"Nanina")}</div><div style="font-size:26px;font-weight:600">${esc(D.perfil.asist||"Mi Asistente")}</div><div style="font-size:14px;color:${T.sub};max-width:300px">${nuevo?"Definí un PIN. Solo lo sabés vos; te lo voy a pedir cada vez que entres.":"Ingresá tu PIN"}</div>
  <input id="pinin" inputmode="numeric" maxlength="4" type="password" autocomplete="off" style="font-size:28px;letter-spacing:.5em;text-align:center;width:200px;padding:12px;border-radius:14px;border:1px solid ${T.border};background: ${CARD};color:${T.text}"><div id="pinerr" style="color:#e2493e;min-height:18px;font-size:13px"></div><button id="pinok" style="${S.prim()};max-width:260px">${nuevo?"Crear PIN y entrar":"Entrar"}</button>`;
  document.body.appendChild(p);const i=p.querySelector("#pinin");setTimeout(()=>i.focus(),50);
  const ok=async()=>{const v=i.value.trim();if(!/^\d{4}$/.test(v)){p.querySelector("#pinerr").textContent="Tienen que ser 4 números";return}const h=await sha(v);
    if(nuevo){D.pin=h;save();p.remove();res()}else if(h===D.pin){p.remove();res()}else{p.querySelector("#pinerr").textContent="PIN incorrecto";i.value=""}};
  p.querySelector("#pinok").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok()}})}
(async()=>{await load();tema();await pedirPin();render();
  setInterval(async()=>{if(document.hidden||FORM||escuchando||BUSY||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;try{const r=await fetch(SUPA_URL+"/rest/v1/bco_storage?key=eq."+KEY+"&select=value&limit=1",{headers:SH});const d=await r.json();if(d&&d[0]){const x=JSON.parse(d[0].value);if((x.t||0)>(D.t||0)){D=mezclar(x);render()}}}catch{}},20000)})();
