<header class="navbar"><div class="wrap"><button class="brand" data-act="tab" data-t="cot"><span class="mark">V+V</span><span><b>Edificio propio</b><small>V+V Desarrollos</small></span></button><nav id="nav" aria-label="Secciones"></nav><span class="theme" role="group" aria-label="Tema"><button data-act="tema" data-m="light">Claro</button><button data-act="tema" data-m="dark">Oscuro</button></span></div></header>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const N=24;
let uid=0;const nid=()=>'x'+Date.now().toString(36)+(++uid);
/* ===== datos de arranque: presupuesto de Paseo Colón 735 (Construcción) con un cronograma típico de 24 meses ===== */
const RUB0=[['Trabajos preliminares',1211097,184482254,1,3],['Movimiento de tierra',0,27176108,1,3],['Estructuras',442082330,433875582,3,12],['Mamposterías',155014218,195323315,6,14],['Capas aisladoras',836613,532328,7,15],['Cubiertas',16475522,12591474,12,16],['Revoques',22616646,192537012,10,18],['Contrapisos',19520992,63739837,14,18],['Cielorrasos',7912696,67057568,16,20],['Revestimientos',170177234,42110396,16,21],['Pisos',65645672,85987245,18,22],['Zócalos',11404702,12601774,20,23],['Carpinterías',435057805,38206683,14,22],['Vidrios',104146310,135870084,18,23],['Pinturas',335339258,118196508,19,24],['Instalaciones eléctricas',264325444,47733884,6,22],['Instalaciones sanitarias',12418998,20231427,6,22],['Instalaciones de gas',41263570,10760940,8,21],['Equipamiento',60358293,200851728,20,24]];
const INT0=['Diseño e interiorismo','Habitaciones · mobiliario','Habitaciones · blancos y textiles','Habitaciones · tecnología y confort','Baños · accesorios y dotación','Kitchenette / comedor de unidad','Decoración y ambientación','Recepción, lobby y áreas comunes','Operación hotelera y limpieza','Logística, montaje y entrega'];
function proyecto0(){
  const hoy=new Date();const m0=new Date(hoy.getFullYear(),hoy.getMonth()+1,1);
  return{v:1,nombre:'Paseo Colón 735 · San Telmo',fx:1540,m2:2751,m2v:2035,ventaUsd:2550,loteUsd:0,inicio:m0.getFullYear()+'-'+String(m0.getMonth()+1).padStart(2,'0'),
    pct:{gg:15,ut:20,imp:15},caja:{gg:true,ut:false,imp:true},infl:0,
    rubros:RUB0.map(r=>({id:nid(),g:'C',n:r[0],u:'gl',c:1,mat:r[1],mo:r[2],ini:r[3],fin:r[4]})).concat(INT0.map((n,i)=>({id:nid(),g:'I',n,u:'gl',c:1,mat:0,mo:0,ini:i<1?18:21,fin:i<1?22:24}))),
    fondos:[],metas:['Pagar el lote','Vender la otra casa','Ingresar ese dinero al proyecto','Inicio de obra','Fin de estructura','Fin de obra','Amoblamiento completo','Venta de las unidades'].map(t=>({id:nid(),t,fecha:'',hecha:false}))};
}
let P=null,TAB='cot',MON='ARS',DET=false,COD='',TBASE=0,ESTADO='';
const num=x=>{let t=String(x==null?'':x).replace(/[^0-9.,\-]/g,'');if(/^-?\d+\.\d{1,2}$/.test(t)){}else t=t.replace(/\./g,'');const v=parseFloat(t.replace(',','.'));return isFinite(v)?v:0};
const sg=(x,p)=>(x<0?'-':'')+p+fN(Math.abs(x));
const mf=x=>sg(x,'$ '),mu=x=>sg(x,'US$ '),mc=x=>MON==='USD'?mu(x):mf(x);
const fN=x=>Math.round(x).toLocaleString('es-AR');
const mny=(x,mon)=>{mon=mon||MON;return mon==='USD'?'US$ '+fN(x/P.fx):'$ '+fN(x)};
const mM=(x,mon)=>{mon=mon||MON;const v=mon==='USD'?x/P.fx:x;const a=Math.abs(v);return (mon==='USD'?'US$ ':'$ ')+(a>=1e9?(v/1e9).toLocaleString('es-AR',{maximumFractionDigits:2})+' mil M':a>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':fN(v))};
const pm=(s)=>{const m=/^(\d{4})-(\d{2})/.exec(s||'');return m?[+m[1],+m[2]]:null};
const mesLabel=i=>{const a=pm(P.inicio)||[2026,1];const t=a[0]*12+(a[1]-1)+i-1;return MES[t%12]+' '+String(Math.floor(t/12)).slice(2)};
const mesIdx=s=>{const a=pm(P.inicio),b=pm(s);if(!a||!b)return null;return (b[0]*12+b[1])-(a[0]*12+a[1])+1};
/* ===== cálculo ===== */
function calc(){
  const R=P.rubros.map(r=>{const mat=num(r.c)*num(r.mat),mo=num(r.c)*num(r.mo);return{...r,matT:mat,moT:mo,tot:mat+mo}});
  const sum=(g,k)=>R.filter(r=>!g||r.g===g).reduce((a,r)=>a+r[k],0);
  const dir={mat:sum('', 'matT'),mo:sum('', 'moT')};dir.tot=dir.mat+dir.mo;
  const gg=dir.tot*P.pct.gg/100,ut=dir.tot*P.pct.ut/100,imp=(dir.tot+gg+ut)*P.pct.imp/100,final=dir.tot+gg+ut+imp;
  const lote=num(P.loteUsd)*P.fx;
  /* flujo mensual */
  const M=Array.from({length:N+1},()=>({mat:0,mo:0,gg:0,ut:0,imp:0,tot:0}));
  const porRubro=R.map(r=>{const a=Math.max(1,Math.min(N,Math.round(num(r.ini)||1))),b=Math.max(a,Math.min(N,Math.round(num(r.fin)||a))),n=b-a+1;const w=[];let sw=0;for(let k=1;k<=n;k++){const x=Math.sin(Math.PI*(k-.5)/n);w.push(x);sw+=x}
    const mat=Array(N+1).fill(0),mo=Array(N+1).fill(0);w.forEach((x,k)=>{mat[a+k]=r.matT*x/sw;mo[a+k]=r.moT*x/sw});return{r,mat,mo,a,b}});
  const inf=1+num(P.infl)/100;
  for(let m=1;m<=N;m++){const f=Math.pow(inf,m-1);let mat=0,mo=0;porRubro.forEach(x=>{mat+=x.mat[m]*f;mo+=x.mo[m]*f});
    const d=mat+mo,g=P.caja.gg?d*P.pct.gg/100:0,u=P.caja.ut?d*P.pct.ut/100:0,i=P.caja.imp?(d+g+u)*P.pct.imp/100:0;
    M[m]={mat,mo,gg:g,ut:u,imp:i,tot:d+g+u+i};}
  let ac=0;for(let m=1;m<=N;m++){ac+=M[m].tot;M[m].ac=ac}
  const cajaTot=ac;
  return{R,dir,gg,ut,imp,final,lote,M,cajaTot,porRubro,sum};
}
/* ===== guardado ===== */
let _st=null;
function marcar(t){ESTADO=t;const e=$('#estado');if(e)e.textContent=t}
function guardarLuego(){if(_st)clearTimeout(_st);marcar('Guardando…');_st=setTimeout(guardar,900)}
async function guardar(){try{const r=await fetch('/api/edificio',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'set',cod:COD,data:P,base:TBASE})});const j=await r.json();if(r.status===409){marcar('⚠ Hay una versión más nueva: recargá la página');return}if(!r.ok)throw new Error(j.error||'error');TBASE=j.t;marcar('Guardado ✓')}catch(e){marcar('⚠ Sin conexión: '+(e.message||''))}}
async function cargar(){try{const r=await fetch('/api/edificio',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'get',cod:COD})});const j=await r.json();if(!r.ok)throw new Error(j.error||'error');P=j.data||proyecto0();TBASE=j.t||0;if(!j.data){guardarLuego()}return true}catch(e){return e.message||'error'}}
/* ===== vistas ===== */
const fv=(v,m)=>typeof v==='number'?(m?sg(v,m):(Math.abs(v)>=1000?fN(v):String(v).replace('.',','))):v;
const inp=(p,v,o={})=>`<input class="ni" data-p="${p}" value="${esc(o.t==='text'?v:fv(v,o.m))}" ${o.t==='text'?'':'inputmode="decimal"'} ${o.w?`style="width:${o.w}"`:''}>`;
function vCot(C){
  const sec=(g,tit)=>{const rs=C.R.filter(r=>r.g===g),tot=rs.reduce((a,r)=>a+r.tot,0);
    return `<div class="card tbc"><div class="ctop"><h3>${tit}</h3><span class="muted small">${mM(tot)}</span></div><div class="tw"><table class="tb"><tr><th>Rubro</th><th>Un.</th><th>Cant.</th><th>Material unit.</th><th>Mano de obra unit.</th><th>Materiales</th><th>Mano de obra</th><th>Total</th><th>Mes ini</th><th>Mes fin</th><th></th></tr>
    ${rs.map(r=>`<tr><td><input class="ni tx" data-r="${r.id}:n" value="${esc(r.n)}"></td><td>${inp('r:'+r.id+':u',r.u,{t:'text',w:'44px'})}</td><td>${inp('r:'+r.id+':c',r.c,{w:'64px'})}</td><td>${inp('r:'+r.id+':mat',r.mat,{w:'130px',m:'$ '})}</td><td>${inp('r:'+r.id+':mo',r.mo,{w:'130px',m:'$ '})}</td><td class="r">${mf(r.matT)}</td><td class="r">${mf(r.moT)}</td><td class="r"><b>${mf(r.tot)}</b></td><td>${inp('r:'+r.id+':ini',r.ini,{w:'48px'})}</td><td>${inp('r:'+r.id+':fin',r.fin,{w:'48px'})}</td><td><button class="x" data-act="delR" data-id="${r.id}" aria-label="Quitar">✕</button></td></tr>`).join('')}
    <tr class="sub"><td colspan="5">Subtotal</td><td class="r">${mf(rs.reduce((a,r)=>a+r.matT,0))}</td><td class="r">${mf(rs.reduce((a,r)=>a+r.moT,0))}</td><td class="r"><b>${mf(tot)}</b></td><td colspan="3"></td></tr></table></div><button class="btn sm" data-act="addR" data-g="${g}">+ Agregar rubro</button></div>`};
  const utilUsd=P.m2v?(P.ventaUsd*P.m2v-(C.cajaTot+C.lote)/P.fx)/P.m2v:0;
  const ingresos=P.ventaUsd*P.m2v;
  return `<figure class="cover"><img src="/edificio/edif-fachada.jpg" alt="Fachada Paseo Colón 735"></figure><div class="kpis"><div class="kpi"><b>${mM(C.final)}</b><span class="kl">precio final llave en mano</span></div><div class="kpi"><b>${mM(C.dir.tot)}</b><span class="kl">costo directo</span></div><div class="kpi"><b>${mM(C.cajaTot)}</b><span class="kl">lo que desembolso en 24 meses</span></div><div class="kpi"><b>${mM(ingresos*P.fx)}</b><span class="kl">ingresos por venta</span></div></div>
  <div class="card"><div class="ctop"><h3>Parámetros</h3><span class="muted small">lo que se edita acá recalcula todo</span></div>
   <div class="g2"><label class="f">Nombre de la obra<input class="ni tx" data-p="nombre" value="${esc(P.nombre)}"></label><label class="f">Mes 1 de obra (aaaa-mm)<input class="ni tx" data-p="inicio" value="${esc(P.inicio)}"></label>
   <label class="f">Cotización ARS por USD${inp('fx',P.fx,{m:'$ '})}</label><label class="f">Inflación mensual estimada (%)${inp('infl',P.infl)}</label>
   <label class="f">Superficie presupuestada m²${inp('m2',P.m2)}</label><label class="f">Superficie vendible m²${inp('m2v',P.m2v)}</label>
   <label class="f">Precio de venta US$/m² vendible${inp('ventaUsd',P.ventaUsd,{m:'US$ '})}</label><label class="f">Costo del lote US$ (se paga en efectivo, fuera de los 24 meses)${inp('loteUsd',P.loteUsd,{m:'US$ '})}</label></div>
   <span class="eyebrow">Porcentajes sobre el costo directo · tildá cuáles entran en el flujo de caja</span>
   <div class="g3"><label class="f">Gastos generales %${inp('pct.gg',P.pct.gg)}<span class="chk"><input type="checkbox" data-c="gg" ${P.caja.gg?'checked':''}> entra al flujo</span></label><label class="f">Utilidad empresarial %${inp('pct.ut',P.pct.ut)}<span class="chk"><input type="checkbox" data-c="ut" ${P.caja.ut?'checked':''}> entra al flujo</span></label><label class="f">Impuestos %${inp('pct.imp',P.pct.imp)}<span class="chk"><input type="checkbox" data-c="imp" ${P.caja.imp?'checked':''}> entra al flujo</span></label></div>
   <p class="muted small">Si hacés la obra solo, la utilidad no sale de tu bolsillo: queda destildada y es lo que te queda a vos.</p></div>
  <div class="card"><div class="ctop"><h3>Resumen</h3><span class="muted small">${esc(P.nombre)}</span></div><table class="tb rs">
   <tr><th></th><th>Materiales / compra</th><th>Mano de obra / montaje</th><th>Total</th><th>%</th></tr>
   <tr><td>Construcción</td><td class="r">${mf(C.sum('C','matT'))}</td><td class="r">${mf(C.sum('C','moT'))}</td><td class="r">${mf(C.sum('C','tot'))}</td><td></td></tr>
   <tr><td>Interiorismo y decoración</td><td class="r">${mf(C.sum('I','matT'))}</td><td class="r">${mf(C.sum('I','moT'))}</td><td class="r">${mf(C.sum('I','tot'))}</td><td></td></tr>
   <tr class="sub"><td>Costo directo total</td><td class="r">${mf(C.dir.mat)}</td><td class="r">${mf(C.dir.mo)}</td><td class="r"><b>${mf(C.dir.tot)}</b></td><td></td></tr>
   <tr><td>Gastos generales</td><td></td><td></td><td class="r">${mf(C.gg)}</td><td class="r">${P.pct.gg}%</td></tr><tr><td>Utilidad empresarial</td><td></td><td></td><td class="r">${mf(C.ut)}</td><td class="r">${P.pct.ut}%</td></tr><tr><td>Impuestos</td><td></td><td></td><td class="r">${mf(C.imp)}</td><td class="r">${P.pct.imp}%</td></tr>
   <tr class="sub"><td>PRECIO FINAL LLAVE EN MANO</td><td></td><td></td><td class="r"><b>${mf(C.final)}</b></td><td></td></tr></table>
   <div class="g2 rsx"><div><span>Precio final total · US$</span><b>${mu(C.final/P.fx)}</b></div><div><span>Costo final · US$/m² vendible</span><b>${mu(P.m2v?C.final/P.fx/P.m2v:0)}</b></div><div><span>Precio final por m² · ARS</span><b>${mu(P.m2?C.final/P.m2:0)}</b></div><div><span>Costo del lote · US$</span><b>${mu(num(P.loteUsd))}</b></div>
   <div><span>Ingresos por venta · US$</span><b>${mu(ingresos)}</b></div><div><span>Utilidad real para mí · US$/m² vendible</span><b>${mu(utilUsd)}</b></div><div><span>Utilidad real para mí · US$ total</span><b>${mu(utilUsd*P.m2v)}</b></div><div><span>Capital total a invertir (lote + obra) · US$</span><b>${mu((C.cajaTot+C.lote)/P.fx)}</b></div></div></div>
  ${sec('C','Construcción')}${sec('I','Interiorismo y decoración · amoblamiento')}
  <p class="muted small">Cantidades y precios son una guía de alcance: se afinan con cómputos y presupuestos de proveedores. "Mes ini / fin" decide en qué meses se paga cada rubro (del 1 al ${N}).</p>`;
}
function chart(C){const W=720,H=230,pl=44,pb=26,pt=10,pr=8,bw=(W-pl-pr)/N;const mx=Math.max(1,...C.M.slice(1).map(x=>x.tot)),ac=C.cajaTot||1;
  const y=v=>pt+(H-pt-pb)*(1-v/mx),ya=v=>pt+(H-pt-pb)*(1-v/ac);let b='';
  for(let m=1;m<=N;m++){const x=pl+(m-1)*bw+2,w=bw-4,d=C.M[m];let y0=H-pb;const seg=[[d.mat,'#6b8fc4'],[d.mo,'#c79a55'],[d.gg+d.ut+d.imp,'#9a948a']];seg.forEach(([v,c])=>{const h=(H-pt-pb)*v/mx;if(h>0){y0-=h;b+=`<rect x="${x}" y="${y0.toFixed(1)}" width="${w}" height="${h.toFixed(1)}" fill="${c}"/>`}});if(m%2||m===N)b+=`<text x="${x+w/2}" y="${H-8}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${m}</text>`}
  const pts=C.M.slice(1).map((d,i)=>`${(pl+i*bw+bw/2).toFixed(1)},${ya(d.ac).toFixed(1)}`).join(' ');
  const yt=[0,.5,1].map(f=>`<text x="${pl-4}" y="${y(mx*f)+3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".6">${mM(mx*f).replace(/^\S+ /,'')}</text><line x1="${pl}" x2="${W-pr}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="currentColor" opacity=".12"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Desembolso mensual">${yt}${b}<polyline points="${pts}" fill="none" stroke="#2f7d50" stroke-width="2"/></svg><div class="lg"><i style="background:#6b8fc4"></i>Materiales <i style="background:#c79a55"></i>Mano de obra <i style="background:#9a948a"></i>Gastos, impuestos y utilidad <i style="background:#2f7d50"></i>Acumulado</div>`}
function vFlujo(C){
  const row=(t,f,cls)=>`<tr class="${cls||''}"><td class="fl">${t}</td>${C.M.slice(1).map((d,i)=>`<td class="r">${mc(f(d,i+1)/(MON==='USD'?P.fx:1))}</td>`).join('')}<td class="r"><b>${mc(C.M.slice(1).reduce((a,d,i)=>a+f(d,i+1),0)/(MON==='USD'?P.fx:1))}</b></td></tr>`;
  const mx=Math.max(1,...C.M.slice(1).map(x=>x.tot)),pk=C.M.indexOf(C.M.slice(1).sort((a,b)=>b.tot-a.tot)[0])||1;
  const peak=C.M.slice(1).reduce((b,d,i)=>d.tot>b.v?{v:d.tot,m:i+1}:b,{v:0,m:1});
  return `<div class="kpis"><div class="kpi"><b>${mM(C.cajaTot)}</b><span class="kl">desembolso total en ${N} meses</span></div><div class="kpi"><b>${mM(C.cajaTot/N)}</b><span class="kl">promedio por mes</span></div><div class="kpi"><b>${mM(peak.v)}</b><span class="kl">mes más pesado · mes ${peak.m} (${mesLabel(peak.m)})</span></div><div class="kpi"><b>${mM(C.lote)}</b><span class="kl">lote (efectivo, mes 0)</span></div></div>
  <div class="card"><div class="ctop"><h3>Desembolso mensual</h3><span class="muted small">${MON==='USD'?'en dólares':'en pesos'} · ${P.infl?'con inflación '+P.infl+'% mensual':'a valores de hoy'}</span></div>${chart(C)}</div>
  <div class="card tbc"><div class="ctop"><h3>Flujo de caja · mes por mes</h3><span class="row2g"><button class="btn sm ${DET?'gold':''}" data-act="det">${DET?'Ocultar':'Ver'} detalle por rubro</button><button class="btn sm" data-act="csv">Descargar CSV</button></span></div>
  <div class="tw"><table class="tb fx"><tr><th class="fl">Mes</th>${C.M.slice(1).map((_,i)=>`<th>${i+1}<br><small>${mesLabel(i+1)}</small></th>`).join('')}<th>Total</th></tr>
  ${row('Materiales',d=>d.mat)}${row('Mano de obra',d=>d.mo)}${P.caja.gg?row('Gastos generales',d=>d.gg):''}${P.caja.ut?row('Utilidad',d=>d.ut):''}${P.caja.imp?row('Impuestos',d=>d.imp):''}${row('DESEMBOLSO DEL MES',d=>d.tot,'sub')}${row('ACUMULADO',d=>d.ac,'acu')}
  ${DET?`<tr><th class="fl" colspan="${N+2}">Detalle por rubro (materiales + mano de obra)</th></tr>${C.porRubro.map(x=>`<tr><td class="fl">${esc(x.r.n)}</td>${Array.from({length:N},(_,i)=>{const v=(x.mat[i+1]+x.mo[i+1])*Math.pow(1+num(P.infl)/100,i)/(MON==='USD'?P.fx:1);return `<td class="r ${v?'on':''}">${v?mc(v):''}</td>`}).join('')}<td class="r"><b>${mc(x.r.tot/(MON==='USD'?P.fx:1))}</b></td></tr>`).join('')}`:''}</table></div></div>
  <p class="muted small">Cada rubro se reparte entre su mes inicial y final con forma de campana: arranca despacio, pega el pico en el medio y baja. Se cambia desde la solapa Cotizador.</p>`;
}
function vFondos(C){
  const ing=Array(N+1).fill(0);let ini=0;P.fondos.forEach(f=>{const i=mesIdx(f.mes);const v=num(f.monto)*(f.mon==='USD'?P.fx:1);if(i===null)return;if(i<=0)ini+=v;else if(i<=N)ing[i]+=v});
  let s=ini,ac=0,falta=null,minS=ini;const filas=[];for(let m=1;m<=N;m++){s+=ing[m]-C.M[m].tot;ac+=ing[m];filas.push({m,ing:ing[m],des:C.M[m].tot,saldo:s});if(s<minS)minS=s;if(s<0&&falta===null)falta=m}
  const tot=P.fondos.reduce((a,f)=>a+num(f.monto)*(f.mon==='USD'?P.fx:1),0);
  const msg=falta?`Con los fondos cargados, te quedás sin dinero en el <b>mes ${falta} (${mesLabel(falta)})</b>. Llegarías a necesitar ${mM(-minS)} más.`:`Con los fondos cargados cubrís los ${N} meses${P.fondos.length?'. El saldo más bajo es '+mM(minS)+'.':'. Cargá abajo la venta de la casa y otros ingresos.'}`;
  return `<div class="kpis"><div class="kpi"><b>${mM(tot)}</b><span class="kl">fondos cargados</span></div><div class="kpi"><b>${mM(C.cajaTot)}</b><span class="kl">a desembolsar en ${N} meses</span></div><div class="kpi ${falta?'neg':'pos'}"><b>${mM(tot-C.cajaTot)}</b><span class="kl">${tot-C.cajaTot<0?'falta cubrir':'sobra'}</span></div></div>
  <div class="card ${falta?'alerta':''}"><p style="margin:0">${msg}</p></div>
  <div class="card"><div class="ctop"><h3>Fondos que entran</h3><button class="btn sm gold" data-act="addF">+ Ingreso</button></div>
   ${P.fondos.length?P.fondos.map(f=>`<div class="frow"><input class="ni tx" data-f="${f.id}:nota" value="${esc(f.nota)}" placeholder="Ej: venta de la casa"><input class="ni tx" data-f="${f.id}:mes" value="${esc(f.mes)}" placeholder="aaaa-mm" style="width:84px"><input class="ni" data-f="${f.id}:monto" value="${esc(fv(num(f.monto),f.mon==='USD'?'US$ ':'$ '))}" inputmode="decimal" style="width:150px"><select class="ni" data-f="${f.id}:mon"><option ${f.mon==='ARS'?'selected':''}>ARS</option><option ${f.mon==='USD'?'selected':''}>USD</option></select><button class="x" data-act="delF" data-id="${f.id}" aria-label="Quitar">✕</button></div>`).join(''):'<p class="muted small">Todavía no cargaste ingresos. Ej: la venta de la otra casa, con el mes en que cobrás y el monto.</p>'}
   <p class="muted small">Mes en formato aaaa-mm. Si es anterior al mes 1 de obra (${esc(P.inicio)}), cuenta como dinero que ya tenés al empezar.</p></div>
  <div class="card tbc"><div class="ctop"><h3>Saldo mes a mes</h3><span class="muted small">fondos − desembolso acumulado</span></div><div class="tw"><table class="tb"><tr><th>Mes</th><th></th><th>Ingresos</th><th>Desembolso</th><th>Saldo</th></tr>
   ${filas.map(f=>`<tr class="${f.saldo<0?'neg':''}"><td>${f.m}</td><td>${mesLabel(f.m)}</td><td class="r">${f.ing?mc(f.ing/(MON==='USD'?P.fx:1)):''}</td><td class="r">${mc(f.des/(MON==='USD'?P.fx:1))}</td><td class="r"><b>${mc(f.saldo/(MON==='USD'?P.fx:1))}</b></td></tr>`).join('')}</table></div></div>
  <div class="card"><div class="ctop"><h3>Metas</h3><button class="btn sm gold" data-act="addM">+ Meta</button></div>
   ${P.metas.slice().sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1).map(m=>{const d=m.fecha?Math.round((new Date(m.fecha+'T00:00:00')-new Date(new Date().toDateString()))/864e5):null;return `<div class="frow meta ${m.hecha?'hecha':''}"><input type="checkbox" data-m="${m.id}:hecha" ${m.hecha?'checked':''} aria-label="Hecha"><input class="ni tx" data-m="${m.id}:t" value="${esc(m.t)}"><input class="ni tx" type="date" data-m="${m.id}:fecha" value="${esc(m.fecha)}" style="width:140px"><span class="muted small" style="min-width:70px">${m.hecha?'listo':d===null?'sin fecha':d<0?'hace '+(-d)+' d':d===0?'hoy':'en '+d+' d'}</span><button class="x" data-act="delM" data-id="${m.id}" aria-label="Quitar">✕</button></div>`}).join('')}</div>`;
}
const IMG=[['fachada','Fachada · Paseo Colón 735'],['noche','Fachada de noche'],['lobby','Lobby y recepción'],['living','Unidad amoblada · living'],['habitacion','Unidad amoblada · dormitorio'],['kitchenette','Unidad amoblada · cocina y comedor'],['bano','Unidad amoblada · baño'],['terraza','Terraza común y solárium'],['pileta','Pileta y spa'],['gimnasio','Gimnasio'],['coworking','Coworking y sala de reuniones'],['cochera','Cochera en subsuelo']];
function vImg(){return `<p class="muted">Imágenes conceptuales del proyecto: el edificio terminado y las unidades amobladas, listas para vender.</p><div class="gal">${IMG.map(([k,t],i)=>`<figure class="${i===0?'big':''}"><a href="/edificio/edif-${k}.jpg" target="_blank" rel="noopener"><img src="/edificio/edif-${k}.jpg" alt="${t}" loading="lazy"></a><figcaption>${t}</figcaption></figure>`).join('')}</div>`}
function draw(){
  if(!P){return}
  const C=calc();window.__C=C;
  $('#ptitle').textContent=TAB==='cot'?'Cotizador':TAB==='flu'?'Flujo de caja a 24 meses':TAB==='fon'?'Fondos y metas':'Imágenes del proyecto';
  $('#who').innerHTML=`<span><b>${esc(P.nombre)}</b></span><span class="muted small" id="estado">${esc(ESTADO)}</span><span class="seg"><button data-act="mon" data-m="ARS" ${MON==='ARS'?'aria-pressed="true"':''}>ARS</button><button data-act="mon" data-m="USD" ${MON==='USD'?'aria-pressed="true"':''}>USD</button></span>`;
  const sy=window.scrollY,sl=document.querySelectorAll('.tw');const sx=[...sl].map(e=>e.scrollLeft);
  $('#view').innerHTML=TAB==='cot'?vCot(C):TAB==='flu'?vFlujo(C):TAB==='fon'?vFondos(C):vImg(C);
  document.querySelectorAll('.tw').forEach((e,i)=>{if(sx[i])e.scrollLeft=sx[i]});window.scrollTo(0,sy);
  const T=[['cot','Cotizador'],['flu','Flujo de caja'],['fon','Fondos y metas'],['img','Imágenes']];
  $('#nav').innerHTML=T.map(([k,l])=>`<a href="#${k}" data-act="tab" data-t="${k}" ${TAB===k?'aria-current="page"':''}>${l}</a>`).join('');
  document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')))));
  
}
function setPath(o,path,v){const k=path.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
document.addEventListener('change',e=>{const t=e.target;if(!P||!t)return;
  if(t.dataset.p){const p=t.dataset.p;if(p.startsWith('r:')){const [,id,f]=p.split(':');const r=P.rubros.find(x=>x.id===id);if(r)r[f]=(f==='u')?t.value:num(t.value)}else setPath(P,p,(p==='nombre'||p==='inicio')?t.value:num(t.value))}
  else if(t.dataset.r){const [id,f]=t.dataset.r.split(':');const r=P.rubros.find(x=>x.id===id);if(r)r[f]=t.value}
  else if(t.dataset.c){P.caja[t.dataset.c]=t.checked}
  else if(t.dataset.f){const [id,f]=t.dataset.f.split(':');const x=P.fondos.find(z=>z.id===id);if(x)x[f]=f==='monto'?num(t.value):t.value}
  else if(t.dataset.m){const [id,f]=t.dataset.m.split(':');const x=P.metas.find(z=>z.id===id);if(x)x[f]=f==='hecha'?t.checked:t.value}
  else return;
  guardarLuego();draw()});
const A={
  tab:ds=>{TAB=ds.t;draw();window.scrollTo(0,0)},
  mon:ds=>{MON=ds.m;draw()},
  tema:ds=>{document.documentElement.dataset.theme=ds.m;try{localStorage.setItem('edif_tema',ds.m)}catch(e){}draw()},
  det:()=>{DET=!DET;draw()},
  addR:ds=>{P.rubros.push({id:nid(),g:ds.g,n:'Nuevo rubro',u:'gl',c:1,mat:0,mo:0,ini:1,fin:N});guardarLuego();draw()},
  delR:ds=>{if(!confirm('¿Quitar este rubro?'))return;P.rubros=P.rubros.filter(r=>r.id!==ds.id);guardarLuego();draw()},
  addF:()=>{P.fondos.push({id:nid(),nota:'',mes:P.inicio,monto:0,mon:'USD'});guardarLuego();draw()},
  delF:ds=>{P.fondos=P.fondos.filter(r=>r.id!==ds.id);guardarLuego();draw()},
  addM:()=>{P.metas.push({id:nid(),t:'Nueva meta',fecha:'',hecha:false});guardarLuego();draw()},
  delM:ds=>{P.metas=P.metas.filter(r=>r.id!==ds.id);guardarLuego();draw()},
  csv:()=>{const C=calc(),k=MON==='USD'?P.fx:1;const L=[['Rubro',...Array.from({length:N},(_,i)=>'Mes '+(i+1)+' '+mesLabel(i+1)),'Total']];
    C.porRubro.forEach(x=>{L.push([x.r.n+' · materiales',...Array.from({length:N},(_,i)=>Math.round(x.mat[i+1]/k)),Math.round(x.r.matT/k)]);L.push([x.r.n+' · mano de obra',...Array.from({length:N},(_,i)=>Math.round(x.mo[i+1]/k)),Math.round(x.r.moT/k)])});
    L.push(['DESEMBOLSO DEL MES',...C.M.slice(1).map(d=>Math.round(d.tot/k)),Math.round(C.cajaTot/k)]);L.push(['ACUMULADO',...C.M.slice(1).map(d=>Math.round(d.ac/k)),'']);
    const csv='﻿'+L.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='flujo_de_caja_'+MON+'.csv';document.body.appendChild(a);a.click();a.remove()},
  entrar:async()=>{const c=($('#cod')||{}).value||'';COD=c.trim();$('#msg').textContent='Entrando…';const r=await cargar();if(r===true){try{localStorage.setItem('edif_cod',COD)}catch(e){}marcar('Guardado ✓');draw()}else{$('#msg').textContent=r}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')e.preventDefault();const f=A[b.dataset.act];if(f)f(b.dataset)});
function login(){document.body.classList.add('login');$('#view').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><span class="eyebrow">Edificio propio</span><h2>Ingresá con tu código</h2><p class="muted small">El mismo código de Dirección que usás en NEXO 2.</p><input id="cod" class="ni tx" type="password" placeholder="Código" style="width:100%;margin:8px 0" autocomplete="off"><button class="btn gold full" data-act="entrar">Entrar</button><p id="msg" class="muted small"></p></div>`;$('#who').innerHTML='';$('#ptitle').innerHTML='<span>Edificio propio</span>'}
try{const t=localStorage.getItem('edif_tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
(async()=>{const n=new Date();$('#fecha').textContent='Paseo Colón 735 · '+n.getDate()+' '+MES[n.getMonth()]+' '+n.getFullYear();let c='';try{c=localStorage.getItem('edif_cod')||''}catch(e){}
  if(c){COD=c;const r=await cargar();if(r===true){marcar('Guardado ✓');draw();return}}login()})();
</script>
