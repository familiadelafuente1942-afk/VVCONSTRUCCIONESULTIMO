<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0e10"><title>B+B Construcciones · Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0d0e10;--surface:#16171a;--raise:#1d1f23;--line:#2a2c31;--fg:#ece8e1;--muted:#8f8b84;--gold:#b8915a;--gold-soft:rgba(184,145,90,.14);--verde:#3fa66b;--amarillo:#e0b43a;--rojo:#e2493e;--azul:#5b8fd6;--serif:"Playfair Display",Georgia,serif;--body:"Barlow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:720px;margin:0 auto;min-height:100vh;border-inline:1px solid var(--line);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.brand{font-family:var(--serif);letter-spacing:.16em;color:var(--gold);font-size:13px;text-transform:uppercase;font-weight:600}
h1{font-family:var(--serif);font-size:26px;margin:2px 0 0;line-height:1.1;font-weight:700}
h2{font-family:var(--serif);font-size:20px;margin:0;font-weight:600}h3{font-family:var(--serif);font-size:16px;margin:0;font-weight:600}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:3px}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.gold{border-color:var(--gold);background:var(--gold-soft)}.kpi.gold .v{color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}.bar.ok i{background:var(--verde)}.bar.mal i{background:var(--rojo)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 14px;font-weight:600}.btn.gold{background:var(--gold);border-color:var(--gold);color:#17120a}.btn.sm{padding:7px 10px;font-size:13px}.btn.red{color:var(--rojo)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1;min-width:110px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500}
input[type=date]{min-height:42px}
.num{text-align:right;font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}tfoot td{font-weight:700;border-top:2px solid var(--gold);border-bottom:0}
.rub{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--surface)}
.rub .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);font-weight:600}
.tag.t{color:var(--verde);border-color:var(--verde)}.tag.c{color:var(--amarillo);border-color:var(--amarillo)}
.etapa{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--surface)}
.etapa.terminada{border-left-color:var(--verde);background:rgba(63,166,107,.12)}.etapa.curso{border-left-color:var(--amarillo)}
.gantt{position:relative;height:12px;background:var(--line);border-radius:6px;margin-top:8px}.gantt i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--amarillo)}.etapa.terminada .gantt i{background:var(--verde)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bottom div{max-width:720px;margin:0 auto;display:flex}nav.bottom button{flex:1;background:none;border:0;padding:10px 2px;font-size:11.5px;color:var(--muted);font-weight:600}nav.bottom button[aria-current=page]{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.guard{font-size:11.5px;color:var(--muted)}
.ok{color:var(--verde)}.bad{color:var(--rojo)}

.hero{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.sl{display:none;grid-template-columns:1fr;gap:3px}.sl.on{display:grid}
.sl figure{margin:0;position:relative;background:#000}.sl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
.sl.plano img{aspect-ratio:3/4;object-fit:contain;max-height:78vh;background:#0d0e10}
.sl figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:12.5px;font-weight:600;letter-spacing:.04em}
@media(min-width:560px){.sl.pair{grid-template-columns:1fr 1fr}.sl.pair img{aspect-ratio:4/3}}
.hnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;font-size:20px;z-index:2}
.hnav.l{left:8px}.hnav.r{right:8px}
.dots{display:flex;justify-content:center;gap:7px;padding:9px 0;flex-wrap:wrap;background:var(--surface)}.dots button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:var(--line)}.dots button.on{background:var(--gold)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}.gal img.pl{object-fit:contain;background:#0d0e10}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;display:none;align-items:center;justify-content:center}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%}#lb button{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid #666;background:#000;color:#fff;font-size:20px}
nav.bottom div{overflow-x:auto}nav.bottom button{flex:1 0 auto;padding:10px 12px}
@media print{header,nav.bottom,.noprint{display:none!important}body,.app{background:#fff;color:#000}.card,.kpi,.rub{background:#fff;border-color:#bbb}.kpi .v,.kpi.gold .v{color:#000}.hideprint{display:none}.pv{display:block!important}}
.pv{display:none}
</style></head><body>
<div class="app"><header><div class="brand">B+B Construcciones</div><h1 id="tit">Casa</h1><div class="guard" id="guard"></div></header><main id="m"></main></div>
<div id="lb"><button aria-label="Cerrar">✕</button><img alt=""></div><nav class="bottom"><div id="nav"></div></nav>
<script>
const KEY='bb_casa_db_v1',APP="casa",API='/api/nexo2';
const TABS=[['r','Resumen'],['p','Presupuesto'],['g','Gastos'],['c','Cronograma'],['t','Tareas'],['a','Avances'],['i','Imágenes']];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const MO=[['Mano de obra Gruesa','m²',254928],['Movimiento de Suelo','m²',25000],['Plomería','m²',25814],['Electricidad','m²',24200],['Pintura','m²',41900],['Durlock','m²',15000],['Piscina','m²',44000],['Colocaciones','m²',40000],['Proyecto y Dirección','m²',150000]];
const MA=[['Cerco','m²',7200,140],['Tosca','m²',14000,140],['Materiales gruesos','m²',290000,140],['Pisos','m²',20000,140],['Plomería','m²',95560,140],['Electricidad','m²',23100,140],['Durlock','m²',14000,140],['Aberturas','m²',211197,140],['Revestimientos','m²',25000,50],['Miksa','m²',18236,140],['Puertas','u',278000,7],['Puerta principal','u',1000000,1],['Bomba de piscina','u',297500,1],['Herrería','u',880000,1],['Muebles de cocina y placares','u',4500000,1],['Venecitas','m²',15000,28],['Electrodomésticos','u',1356853,1],['Entrada vehicular','u',1500000,1],['Parrilla','u',1500000,1],['Preinstalación de aires','u',1500000,1]];
function nuevo(){return{_t:0,P:{nombre:'Casa',m2:140,dolar:1546,lote:33920,cont:5},
 mo:MO.map(([n,u,p])=>({id:uid(),n,u,q:140,x:1,mon:'ARS',p})),
 ma:MA.map(([n,u,p,q])=>({id:uid(),n,u,q,x:q===140?1:0,mon:'ARS',p})),
 gastos:[],etapas:['Movimiento de suelo y cerco','Estructura (obra gruesa)','Instalaciones (plomería y electricidad)','Aberturas','Durlock y revestimientos','Piscina','Pisos y colocaciones','Pintura y terminaciones','Entrega'].map(n=>({id:uid(),n,ini:'',fin:'',est:'pendiente'})),
 tareas:[{id:uid(),t:'Cerrar anteproyecto y superficies',f:'2026-09-30',pr:'Alta',ok:1},{id:uid(),t:'Comparar tres presupuestos de estructura',f:'2026-10-08',pr:'Alta',ok:0},{id:uid(),t:'Definir aberturas y nivel de terminación',f:'2026-10-15',pr:'Media',ok:0}],
 avances:[],tab:'r'}}
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))||nuevo();if(/canning|felipe/i.test(DB.P.nombre))DB.P.nombre='Casa'}catch(e){DB=nuevo()}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>Math.round(n||0).toLocaleString('es-AR'),ARS=n=>'$ '+N(n),USD=n=>'U$s '+N(n),pc=n=>(n*100).toLocaleString('es-AR',{maximumFractionDigits:1})+'%';
const dig=s=>parseInt(String(s).replace(/\D/g,''),10)||0;
const fd=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-');return `${d}/${m}/${y.slice(2)}`};
const hoy=()=>new Date().toISOString().slice(0,10);
/* ---- cálculos ---- */
const qty=r=>r.x?DB.P.m2:r.q;
const subA=r=>qty(r)*r.p*(r.mon==='USD'?DB.P.dolar:1);
const sum=a=>a.reduce((s,r)=>s+subA(r),0);
function calc(){const P=DB.P,tMO=sum(DB.mo),tMA=sum(DB.ma),obra=tMO+tMA,cont=obra*P.cont/100,lote=P.lote*P.dolar,total=obra+cont+lote;
 const gast=DB.gastos.reduce((s,g)=>s+(g.mon==='USD'?g.m*P.dolar:g.m),0);return{tMO,tMA,obra,cont,lote,total,gast,av:obra?Math.min(1,gast/obra):0}}
const rubros=()=>[...DB.mo.map(r=>({...r,g:'MO'})),...DB.ma.map(r=>({...r,g:'MAT'}))];
/* ---- guardado y sincronización entre dispositivos ---- */
let _t=0,_busy=0;
const post=b=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,app:APP})}).then(r=>r.json().then(j=>({s:r.status,j})));
function save(){DB._t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}clearTimeout(_t);_t=setTimeout(push,700);gu('Guardado en este equipo…')}
const gu=t=>{const g=$('#guard');if(g)g.textContent=t};
function push(){post({op:'pc_put',v:JSON.stringify(DB),t:DB._t}).then(({s,j})=>{if(s===200)gu('Guardado y sincronizado '+new Date().toLocaleTimeString('es-AR'));else if(s===409&&j.doc)adopt(j.doc);else gu('Guardado en este equipo (sin conexión para sincronizar)')}).catch(()=>gu('Guardado en este equipo (sin conexión para sincronizar)'))}
function adopt(d){try{const n=JSON.parse(d.v);if(!n||!n.mo)return;if(/canning|felipe/i.test(n.P.nombre))n.P.nombre='Casa';n._t=d.t;DB=n;localStorage.setItem(KEY,JSON.stringify(DB));render();gu('Actualizado con los últimos cambios '+new Date().toLocaleTimeString('es-AR'))}catch(e){}}
function sync(first){if(_busy)return;const a=document.activeElement;if(!first&&a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;_busy=1;post({op:'pc_get'}).then(({j})=>{const d=j&&j.doc;if(d&&Number(d.t)>(DB._t||0))adopt(d);else if(!d){DB._t=Date.now();push()}else if(Number(d.t)<(DB._t||0))push();else gu('Sincronizado '+new Date().toLocaleTimeString('es-AR'))}).catch(()=>gu('Sin conexión: los cambios quedan en este equipo')).finally(()=>_busy=0)}

const IMG=n=>`docs/casa/c${String(n).padStart(2,'0')}.jpg?v=1`;
const FR=[3,9,10,12,13,14,15,16,17,20],CO=[2,4,5,6,7,8,11,19];
const SL=[{t:'plano',f:[1],l:['Planta con medidas']},{t:'plano',f:[18],l:['Planta']}];
for(let i=0;i<FR.length;i+=2)SL.push({t:'pair',f:FR.slice(i,i+2),l:FR.slice(i,i+2).map((_,j)=>'Frente · opción '+(i+j+1))});
for(let i=0;i<CO.length;i+=2)SL.push({t:'pair',f:CO.slice(i,i+2),l:CO.slice(i,i+2).map((_,j)=>'Contrafrente y piscina · opción '+(i+j+1))});
let SLI=0;
const hero=()=>`<div><div class="hero" id="hero">${SL.map((x,i)=>`<div class="sl ${x.t} ${i===SLI?'on':''}">${x.f.map((n,j)=>`<figure><img src="${IMG(n)}" alt="${esc(x.l[j])}" data-z="${n}" loading="${i<2?'eager':'lazy'}"><figcaption>${esc(x.l[j])}</figcaption></figure>`).join('')}</div>`).join('')}<button class="hnav l" data-sl="-1" aria-label="Anterior">‹</button><button class="hnav r" data-sl="1" aria-label="Siguiente">›</button></div><div class="dots">${SL.map((_,i)=>`<button data-go="${i}" class="${i===SLI?'on':''}" aria-label="Imagen ${i+1}"></button>`).join('')}</div></div>`;
function showSl(n){SLI=(n+SL.length)%SL.length;document.querySelectorAll('.sl').forEach((e,i)=>e.classList.toggle('on',i===SLI));document.querySelectorAll('.dots button').forEach((e,i)=>e.classList.toggle('on',i===SLI))}
function zoom(n){const l=$('#lb');l.querySelector('img').src=IMG(n);l.classList.add('on')}
/* ---- vistas ---- */
const T={
i(){return `<h2>Imágenes y planos</h2><p class="muted small">Tocá una imagen para verla grande.</p><div class="gal">${[1,18,...FR,...CO].map(n=>`<img src="${IMG(n)}" data-z="${n}" class="${n===1||n===18?'pl':''}" loading="lazy" alt="Imagen ${n}">`).join('')}</div>`},
r(){const c=calc(),P=DB.P,pend=DB.tareas.filter(t=>!t.ok),term=DB.etapas.filter(e=>e.est==='terminada').length;
 return hero()+`<div class="kpis"><div class="kpi gold"><div class="l">Inversión total</div><div class="v">${USD(c.total/P.dolar)}</div><div class="s">${ARS(c.total)} · incluye contingencia ${P.cont}%</div></div>
 <div class="kpi"><div class="l">Superficie</div><div class="v">${N(P.m2)} m²</div><div class="s">Dólar $ ${N(P.dolar)}</div></div>
 <div class="kpi"><div class="l">Lote + adquisición</div><div class="v">${USD(P.lote)}</div></div>
 <div class="kpi"><div class="l">Obra directa</div><div class="v">${USD(c.obra/P.dolar)}</div><div class="s">${ARS(c.obra)}</div></div></div>
 <div class="card"><div class="row sp"><h3>Avance de gastos</h3><b>${pc(c.av)}</b></div><div class="bar"><i style="width:${c.av*100}%"></i></div>
 <p class="small muted" style="margin-top:8px">Gastado ${ARS(c.gast)} de ${ARS(c.obra)} de obra directa. Saldo por ejecutar ${ARS(Math.max(0,c.obra-c.gast))}.</p></div>
 <div class="card"><div class="row sp"><h3>Cronograma</h3><b>${term} de ${DB.etapas.length} etapas terminadas</b></div><div class="bar ok"><i style="width:${DB.etapas.length?term/DB.etapas.length*100:0}%"></i></div></div>
 <div class="card"><h3>Próximas decisiones</h3>${pend.length?pend.sort((a,b)=>a.f.localeCompare(b.f)).slice(0,4).map(t=>`<div class="row sp" style="margin-top:8px"><span>${esc(t.t)}</span><span class="small muted">${fd(t.f)} · ${t.pr}</span></div>`).join(''):'<p class="muted small" style="margin-top:6px">No hay tareas pendientes.</p>'}</div>
 <div class="card"><h3>Datos generales</h3><div class="row" style="margin-top:8px"><label class="f">Nombre<input data-p="nombre" value="${esc(P.nombre)}"></label><label class="f">Superficie m²<input class="num" inputmode="numeric" data-pn="m2" value="${N(P.m2)}"></label></div>
 <div class="row" style="margin-top:8px"><label class="f">Dólar oficial ($)<input class="num" inputmode="numeric" data-pn="dolar" value="${N(P.dolar)}"></label><label class="f">Lote + adquisición (U$s)<input class="num" inputmode="numeric" data-pn="lote" value="${N(P.lote)}"></label><label class="f">Contingencia (%)<input class="num" inputmode="numeric" data-pn="cont" value="${N(P.cont)}"></label></div></div>
 <div class="row noprint"><button class="btn gold" data-a="print">Imprimir / PDF</button><button class="btn" data-a="sync">Sincronizar ahora</button></div>`},
p(){const c=calc(),P=DB.P;const tabla=(k,tit,tot)=>`<div class="row sp"><h2>${tit}</h2><b class="mono">${ARS(tot)} · ${USD(tot/P.dolar)}</b></div>`+DB[k].map(r=>{const s=subA(r);return `<div class="rub"><div class="row sp"><b>${esc(r.n)}</b><button class="btn sm red noprint" data-a="delr" data-k="${k}" data-id="${r.id}" aria-label="Borrar ${esc(r.n)}">Borrar</button></div>
 <div class="g"><label class="f">Cantidad (${esc(r.u)})<input class="num" inputmode="numeric" data-r="${k}:${r.id}:q" value="${N(qty(r))}" ${r.x?'disabled title="Sigue los m² de la obra"':''}></label>
 <label class="f">Precio unitario<input class="num" inputmode="numeric" data-r="${k}:${r.id}:p" value="${N(r.p)}"></label>
 <label class="f">Moneda<select data-r="${k}:${r.id}:mon"><option ${r.mon==='ARS'?'selected':''}>ARS</option><option ${r.mon==='USD'?'selected':''}>USD</option></select></label></div>
 <div class="row sp small" style="margin-top:8px"><span class="muted">Incidencia ${pc(c.obra?s/c.obra:0)}${r.x?' · por m²':''}</span><b class="mono">${ARS(s)} · ${USD(s/P.dolar)}</b></div></div>`}).join('')+
 `<div class="row noprint" style="margin-top:8px"><input id="nn-${k}" placeholder="Nuevo rubro" style="flex:2"><input id="nq-${k}" class="num" inputmode="numeric" placeholder="Precio" style="flex:1"><button class="btn sm" data-a="addr" data-k="${k}">Agregar</button></div>`;
 return `<div class="card"><div class="row sp"><span>Obra directa</span><b class="mono">${ARS(c.obra)}</b></div><div class="row sp"><span>Contingencia ${P.cont}%</span><b class="mono">${ARS(c.cont)}</b></div><div class="row sp"><span>Lote + adquisición</span><b class="mono">${ARS(c.lote)}</b></div><div class="row sp" style="border-top:2px solid var(--gold);margin-top:6px;padding-top:6px"><b>Inversión total</b><b class="mono">${ARS(c.total)} · ${USD(c.total/P.dolar)}</b></div></div>`+tabla('mo','Mano de obra',c.tMO)+tabla('ma','Materiales',c.tMA)},
g(){const c=calc(),P=DB.P,R=rubros();const por=R.map(r=>{const gs=DB.gastos.filter(g=>g.rid===r.id).reduce((s,g)=>s+(g.mon==='USD'?g.m*P.dolar:g.m),0);return{r,gs,pr:subA(r)}});
 return `<div class="card noprint"><h3>Cargar gasto</h3><div class="row" style="margin-top:8px"><label class="f">Fecha<input type="date" id="g-f" value="${hoy()}"></label><label class="f">Rubro<select id="g-r">${R.map(r=>`<option value="${r.id}">${r.g==='MO'?'M.O.':'Mat.'} · ${esc(r.n)}</option>`).join('')}</select></label></div>
 <div class="row" style="margin-top:8px"><label class="f">Monto<input id="g-m" class="num" inputmode="numeric" placeholder="0"></label><label class="f">Moneda<select id="g-c"><option>ARS</option><option>USD</option></select></label><label class="f">Proveedor / nota<input id="g-n"></label></div><button class="btn gold" style="margin-top:10px;width:100%" data-a="addg">Guardar gasto</button></div>
 <div class="card"><div class="row sp"><h3>Total gastado</h3><b class="mono">${ARS(c.gast)}</b></div><div class="bar"><i style="width:${c.av*100}%"></i></div></div>
 <h2>Últimos gastos</h2>${DB.gastos.length?[...DB.gastos].sort((a,b)=>b.f.localeCompare(a.f)).map(g=>{const r=R.find(x=>x.id===g.rid);return `<div class="rub"><div class="row sp"><b>${esc(r?r.n:'Rubro borrado')}</b><b class="mono">${g.mon==='USD'?USD(g.m):ARS(g.m)}</b></div><div class="row sp small muted"><span>${fd(g.f)}${g.n?' · '+esc(g.n):''}</span><button class="btn sm red noprint" data-a="delg" data-id="${g.id}">Borrar</button></div></div>`}).join(''):'<p class="muted small">Todavía no hay gastos cargados.</p>'}
 <h2 style="margin-top:6px">Presupuestado vs gastado</h2>${por.filter(x=>x.gs>0).map(x=>{const f=x.pr?x.gs/x.pr:0;return `<div class="rub"><div class="row sp"><b>${esc(x.r.n)}</b><span class="small ${f>1?'bad':''}">${pc(f)}</span></div><div class="bar ${f>1?'mal':''}"><i style="width:${Math.min(100,f*100)}%"></i></div><div class="row sp small muted" style="margin-top:6px"><span>Gastado ${ARS(x.gs)}</span><span>Presup. ${ARS(x.pr)}</span></div></div>`}).join('')||'<p class="muted small">Se arma solo a medida que cargás gastos.</p>'}`},
c(){const est={pendiente:'Pendiente',curso:'En curso',terminada:'Terminada'};const ds=DB.etapas.flatMap(e=>[e.ini,e.fin]).filter(Boolean).sort(),a=ds[0],b=ds[ds.length-1];const tm=x=>new Date(x+'T12:00').getTime();
 return `<div class="row sp"><h2>Cronograma</h2><span class="small muted">Al marcar “Terminada” la etapa queda en verde</span></div>`+DB.etapas.map(e=>{const bar=a&&b&&e.ini&&e.fin&&tm(b)>tm(a)?`<div class="gantt"><i style="left:${(tm(e.ini)-tm(a))/(tm(b)-tm(a))*100}%;width:${Math.max(2,(tm(e.fin)-tm(e.ini))/(tm(b)-tm(a))*100)}%"></i></div>`:'';
 return `<div class="etapa ${e.est}"><div class="row sp"><b>${e.est==='terminada'?'✓ ':''}${esc(e.n)}</b><button class="btn sm red noprint" data-a="dele" data-id="${e.id}">Borrar</button></div><div class="row" style="margin-top:8px"><label class="f">Inicio<input type="date" data-e="${e.id}:ini" value="${e.ini}"></label><label class="f">Fin<input type="date" data-e="${e.id}:fin" value="${e.fin}"></label><label class="f">Estado<select data-e="${e.id}:est">${Object.entries(est).map(([k,v])=>`<option value="${k}" ${e.est===k?'selected':''}>${v}</option>`).join('')}</select></label></div>${bar}</div>`}).join('')+
 `<div class="row noprint" style="margin-top:8px"><input id="ne" placeholder="Nueva etapa" style="flex:1"><button class="btn sm" data-a="adde">Agregar</button></div>`},
t(){return `<div class="row sp"><h2>Tareas y decisiones</h2></div>`+[...DB.tareas].sort((a,b)=>a.ok-b.ok||a.f.localeCompare(b.f)).map(t=>{const venc=!t.ok&&t.f<hoy();return `<div class="etapa ${t.ok?'terminada':''}"><div class="row sp"><b>${t.ok?'✓ ':''}${esc(t.t)}</b><button class="btn sm red noprint" data-a="delt" data-id="${t.id}">Borrar</button></div><div class="row sp small" style="margin-top:6px"><span class="${venc?'bad':'muted'}">${fd(t.f)} · prioridad ${t.pr}${venc?' · vencida':''}</span><button class="btn sm" data-a="okt" data-id="${t.id}">${t.ok?'Reabrir':'Resolver'}</button></div></div>`}).join('')+
 `<div class="card noprint" style="margin-top:8px"><h3>Nueva tarea</h3><div class="row" style="margin-top:8px"><label class="f" style="flex:2">Tarea<input id="t-t"></label><label class="f">Fecha<input type="date" id="t-f" value="${hoy()}"></label><label class="f">Prioridad<select id="t-p"><option>Alta</option><option selected>Media</option><option>Baja</option></select></label></div><button class="btn gold" style="margin-top:10px;width:100%" data-a="addt">Agregar tarea</button></div>`},
a(){return `<div class="row sp"><h2>Últimos avances</h2></div><div class="card noprint"><div class="row"><label class="f">Fecha<input type="date" id="a-f" value="${hoy()}"></label><label class="f" style="flex:3">Título<input id="a-t"></label></div><label class="f" style="margin-top:8px">Detalle<textarea id="a-d" rows="3"></textarea></label><button class="btn gold" style="margin-top:10px;width:100%" data-a="adda">Registrar avance</button></div>`+
 (DB.avances.length?[...DB.avances].sort((a,b)=>b.f.localeCompare(a.f)).map(v=>`<div class="rub"><div class="row sp"><b>${esc(v.t)}</b><span class="small muted">${fd(v.f)}</span></div><p class="small" style="margin-top:6px;white-space:pre-wrap">${esc(v.d)}</p><button class="btn sm red noprint" style="margin-top:8px" data-a="dela" data-id="${v.id}">Borrar</button></div>`).join(''):'<p class="muted small">Todavía no hay avances registrados.</p>')}};
function render(){const y=window.scrollY;$('#tit').textContent=DB.P.nombre;$('#m').innerHTML=T[DB.tab]();$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${DB.tab===k?'aria-current="page"':''}>${l}</button>`).join('');window.scrollTo(0,y)}
/* ---- eventos ---- */
document.addEventListener('click',e=>{if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}const z=e.target.closest('[data-z]');if(z){zoom(z.dataset.z);return}const sl=e.target.closest('[data-sl],[data-go]');if(sl){showSl(sl.dataset.go!=null?+sl.dataset.go:SLI+ +sl.dataset.sl);return}const b=e.target.closest('[data-tab],[data-a]');if(!b)return;if(b.dataset.tab){DB.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
 const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
 if(a==='print')return window.print();if(a==='sync')return sync(1);
 if(a==='delr'){if(!confirm('¿Borrar este rubro?'))return;DB[k]=DB[k].filter(r=>r.id!==id)}
 else if(a==='addr'){const n=$('#nn-'+k).value.trim();if(!n)return alert('Poné el nombre del rubro.');DB[k].push({id:uid(),n,u:'u',q:1,x:0,mon:'ARS',p:dig($('#nq-'+k).value)})}
 else if(a==='addg'){const m=dig($('#g-m').value);if(!m)return alert('Poné el monto.');DB.gastos.push({id:uid(),f:$('#g-f').value||hoy(),rid:$('#g-r').value,m,mon:$('#g-c').value,n:$('#g-n').value.trim()})}
 else if(a==='delg'){if(!confirm('¿Borrar este gasto?'))return;DB.gastos=DB.gastos.filter(g=>g.id!==id)}
 else if(a==='adde'){const n=$('#ne').value.trim();if(!n)return;DB.etapas.push({id:uid(),n,ini:'',fin:'',est:'pendiente'})}
 else if(a==='dele'){if(!confirm('¿Borrar esta etapa?'))return;DB.etapas=DB.etapas.filter(x=>x.id!==id)}
 else if(a==='addt'){const t=$('#t-t').value.trim();if(!t)return alert('Escribí la tarea.');DB.tareas.push({id:uid(),t,f:$('#t-f').value||hoy(),pr:$('#t-p').value,ok:0})}
 else if(a==='okt'){const t=DB.tareas.find(x=>x.id===id);t.ok=t.ok?0:1}
 else if(a==='delt'){if(!confirm('¿Borrar esta tarea?'))return;DB.tareas=DB.tareas.filter(x=>x.id!==id)}
 else if(a==='adda'){const t=$('#a-t').value.trim();if(!t)return alert('Poné un título.');DB.avances.push({id:uid(),f:$('#a-f').value||hoy(),t,d:$('#a-d').value.trim()})}
 else if(a==='dela'){if(!confirm('¿Borrar este avance?'))return;DB.avances=DB.avances.filter(x=>x.id!==id)}
 save();render()});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('input.num')){const p=t.selectionStart,l=t.value.length;t.value=t.value?N(dig(t.value)):'';const q=Math.max(0,p+t.value.length-l);try{t.setSelectionRange(q,q)}catch(x){}}});
document.addEventListener('change',e=>{const t=e.target;let ch=0;
 if(t.dataset.p){DB.P[t.dataset.p]=t.value;ch=1}
 else if(t.dataset.pn){DB.P[t.dataset.pn]=dig(t.value);ch=1}
 else if(t.dataset.r){const[k,id,f]=t.dataset.r.split(':'),r=DB[k].find(x=>x.id===id);r[f]=f==='mon'?t.value:dig(t.value);ch=1}
 else if(t.dataset.e){const[id,f]=t.dataset.e.split(':'),r=DB.etapas.find(x=>x.id===id);r[f]=t.value;ch=1}
 if(ch){save();render()}});
let _x=0;document.addEventListener('touchstart',e=>{_x=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!e.target.closest('#hero'))return;const d=e.changedTouches[0].clientX-_x;if(Math.abs(d)>50)showSl(SLI+(d<0?1:-1))},{passive:true});
render();sync(1);setInterval(()=>sync(0),15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(0)});
</script></body></html>
