<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seguimiento">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Seguimiento V+V</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1b1b1f;--mut:#6c6c74;--line:#e4e2dc;--gold:#a8742a;--gold2:#e9c978;--rojo:#d23a2e;--verde:#2c8a4f;--azul:#2e6bd1;--sel:#fbf6ea}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--card:#1f1f24;--ink:#f2f1ed;--mut:#9b9ba4;--line:#2e2e35;--gold:#e3b567;--gold2:#6b5222;--sel:#2a2418}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header .yo{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--mut)}
main{max-width:760px;margin:0 auto;padding:14px 16px}
h2{font-size:22px;margin:6px 0 12px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.row>.g{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.b{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.tile b{display:block;font-size:26px;line-height:1.1}.tile span{font-size:12px;color:var(--mut)}
.tile.alert b{color:var(--rojo)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:linear-gradient(#f0d48a,#d9ac4f);color:#2b1d05;border-color:#c99a3f}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}.btn.del{color:var(--rojo)}
.add{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:13px;color:var(--mut);font-weight:600;cursor:pointer;margin:4px 0 10px}
.badge{background:var(--rojo);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip.pend{color:var(--mut)}.chip.curso{background:#e8f0fd;color:var(--azul);border-color:#c5d8f8}.chip.hecha{background:#e5f4ea;color:var(--verde);border-color:#bfe3cb}
@media(prefers-color-scheme:dark){.chip.curso{background:#1c2a44;border-color:#2c4270}.chip.hecha{background:#1a3324;border-color:#27533a}}
.chip.late{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--verde)}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{flex:1;min-width:0}.task .t b{display:block;overflow-wrap:anywhere}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.chk.curso{border-color:var(--azul);background:linear-gradient(90deg,var(--azul) 50%,transparent 50%)}
.chk.hecha{border-color:var(--verde);background:var(--verde)}
.task.done .t b{text-decoration:line-through;color:var(--mut)}
.gantt{position:relative;margin:8px 0 2px}
.gantt .g1{position:relative;height:30px;margin:3px 0}
.gantt .g1 i{position:absolute;top:5px;height:20px;border-radius:7px;background:var(--gold2);border:1px solid var(--gold);font-style:normal;font-size:11px;padding:2px 6px;white-space:nowrap;overflow:hidden;color:var(--ink);cursor:pointer}
.gantt .g1 i.curso{background:#cfe0fb;border-color:var(--azul)}.gantt .g1 i.hecha{background:#cdebd7;border-color:var(--verde)}.gantt .g1 i.late{background:#f6cfcb;border-color:var(--rojo)}
.gantt .hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--rojo);opacity:.7}
.gantt .eje,.card .eje{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut);margin-top:6px;white-space:nowrap}
.ob{display:block;width:100%;text-align:left;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:transparent;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;position:relative;border-radius:10px}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav .badge{position:absolute;top:0;left:calc(50% + 4px)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin-top:0}
label.f{display:block;margin:0 0 12px;font-size:13px;color:var(--mut);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:400;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:40;font-weight:600;max-width:90vw;text-align:center}
.toast.err{background:var(--rojo);color:#fff}
.login{max-width:420px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 20px}
.login h1{font-size:28px;margin:30px 0 6px}
.quien{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.quien button{padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer}
.quien button.on{border-color:var(--gold);background:var(--sel)}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.tot{font-size:26px;font-weight:700}
.ok{color:var(--verde)}.rojo{color:var(--rojo)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5;
const TODAY=(()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())})();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmt=t=>{if(!t)return '—';const x=new Date(t);return x.getUTCDate()+' '+MES[x.getUTCMonth()]+(x.getUTCFullYear()!==new Date(TODAY).getUTCFullYear()?' '+String(x.getUTCFullYear()).slice(2):'')};
const iso=t=>t?new Date(t).toISOString().slice(0,10):'';
const dt=s=>{if(!s)return 0;const[y,m,a]=s.split('-').map(Number);return Date.UTC(y,m-1,a)};
const money=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const mesDe=t=>{const x=new Date(t);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')};
const mesTxt=m=>{const[y,mm]=m.split('-');return MESL[+mm-1]+' '+y};
const MES_HOY=mesDe(TODAY);

const S={tk:'',quien:'',D:{obras:[],tareas:[],personal:[],gastos:[],sueldos:[]},tab:'hoy',obra:null,otab:'crono',gtab:'gastos',gde:'todos',tfil:'pend',cargado:false,err:''};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const ckGet=()=>{const m=document.cookie.match(/(?:^|; )seg_tk=([^;]*)/);return m?decodeURIComponent(m[1]):''};
const ckSet=v=>{document.cookie='seg_tk='+encodeURIComponent(v)+';max-age=34560000;path=/;SameSite=Lax'+(v?'':';max-age=0')};

async function api(body){
  const r=await fetch('/api/seguimiento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,token:S.tk})});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401){salirLocal();throw new Error('sesion')}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));
  return j;
}
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),err?4200:2200)}

/* ---------- datos ---------- */
const col=c=>S.D[c];
const byId=(c,id)=>col(c).find(x=>x.id===id);
const nombreObra=id=>(byId('obras',id)||{}).nombre||'';
const atrasada=t=>t.estado!=='hecha'&&t.fin&&t.fin<TODAY;
const tareasDe=amb=>col('tareas').filter(t=>t.ambito===amb);
const ordenT=(a,b)=>(a.estado==='hecha')-(b.estado==='hecha')||((a.inicio||a.fin||9e12)-(b.inicio||b.fin||9e12))||(a.orden||0)-(b.orden||0);
const generales=()=>col('tareas').filter(t=>t.ambito==='general');
const pendGen=()=>generales().filter(t=>t.estado!=='hecha');
const atrasadasTodas=()=>col('tareas').filter(atrasada);
function obreros(oid){return col('personal').filter(p=>p.obra===oid&&p.activo!==false)}

async function cargar(silencioso){
  try{const j=await api({op:'todo'});S.quien=j.quien;['obras','tareas','personal','gastos','sueldos'].forEach(c=>S.D[c]=j[c]||[]);S.D.obras.sort((a,b)=>(a.orden||0)-(b.orden||0));S.cargado=true;S.err='';LS('seg_q',j.quien)}
  catch(e){if(e.message==='sesion')return;S.err='Sin conexión. Mostrando lo último que se vio.';if(!silencioso)toast('No se pudo actualizar. Revisá la conexión.',true)}
  badge();if(!document.querySelector('.sheet'))draw();
}
async function guardar(c,item){
  const prev=item.id?JSON.parse(JSON.stringify(byId(c,item.id)||null)):null;
  const tmp=item.id?item:{...item,id:'tmp'+Date.now()};
  const i=col(c).findIndex(x=>x.id===tmp.id);if(i>=0)col(c)[i]={...col(c)[i],...tmp};else col(c).push(tmp);draw();
  try{const j=await api({op:'guardar',col:c,item:item.id?item:{...item}});const k=col(c).findIndex(x=>x.id===tmp.id);if(k>=0)col(c)[k]=j.item;badge();draw();return j.item}
  catch(e){if(e.message==='sesion')return;toast('No se pudo guardar: '+e.message,true);await cargar(true)}
}
async function borrar(c,id){
  const antes=col(c).slice();S.D[c]=col(c).filter(x=>x.id!==id);if(c==='obras'){S.D.tareas=S.D.tareas.filter(t=>t.ambito!=='obra:'+id);S.D.personal=S.D.personal.filter(p=>p.obra!==id)}draw();
  try{await api({op:'borrar',col:c,id});badge()}catch(e){if(e.message==='sesion')return;toast('No se pudo borrar: '+e.message,true);await cargar(true)}
}
function badge(){const n=pendGen().length;try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}

/* ---------- sesión ---------- */
function salirLocal(){S.tk='';LS('seg_tk',null);ckSet('');S.cargado=false;draw()}
async function entrar(){
  const q=document.querySelector('.quien .on');const quien=q?q.dataset.q:'';const codigo=($('#cod')||{}).value||'';
  if(!quien){toast('Elegí quién sos',true);return}
  if(!codigo.trim()){toast('Poné el código',true);return}
  try{const j=await fetch('/api/seguimiento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'login',codigo,quien})}).then(r=>r.json());
    if(!j.ok){toast(j.error||'No se pudo entrar',true);return}
    S.tk=j.token;S.quien=j.quien;LS('seg_tk',j.token);ckSet(j.token);await cargar();}
  catch(e){toast('No se pudo conectar. Probá de nuevo.',true)}
}
async function crearCodigo(){
  const dir=($('#cdir')||{}).value||'',codigo=($('#cnuevo')||{}).value||'';
  try{const r=await fetch('/api/seguimiento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'setup',dir,codigo})});const j=await r.json();
    if(!r.ok){toast(j.error||'No se pudo crear',true);return}
    toast('Código creado. Ahora entrá.');S.config=true;draw()}
  catch(e){toast('No se pudo conectar. Probá de nuevo.',true)}
}

/* ---------- vistas ---------- */
const ICON={
  hoy:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  obras:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/></svg>',
  tareas:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
  gente:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.2 5 2.5 5 5.3"/></svg>',
  nexo:'<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
  gastos:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>'
};
function nav(){
  const T=[['hoy','Hoy'],['obras','Obras'],['tareas','Tareas'],['gente','Personal'],['nexo','Nexo'],['gastos','Gastos']];
  const nP=pendGen().length;
  return `<nav>${T.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${S.tab===k?'on':''}">${ICON[k==='gente'?'gente':k]}${l}${k==='tareas'&&nP?`<span class="badge">${nP}</span>`:''}</button>`).join('')}</nav>`;
}
function login(){
  const cfg=S.config;
  if(cfg===undefined){fetch('/api/seguimiento',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"op":"estado"}'}).then(r=>r.json()).then(j=>{S.config=!!j.configurado;draw()}).catch(()=>{S.config=true;draw()});return '<div class="login"><h1>Seguimiento V+V</h1><p class="mut">Cargando…</p></div>'}
  if(!cfg)return `<div class="login"><h1>Seguimiento V+V</h1><p class="mut">Primera vez: creá el código que van a usar Nicolás y vos. Para crearlo hace falta el código de Dirección de NEXO.</p>
   <label class="f">Código de Dirección de NEXO<input id="cdir" autocapitalize="characters" autocomplete="off"></label>
   <label class="f">Código nuevo para esta app<input id="cnuevo" autocapitalize="characters" autocomplete="off" placeholder="Mínimo 4 letras o números"></label>
   <button class="btn pri full" data-a="crear">Crear código</button></div>`;
  return `<div class="login"><h1>Seguimiento V+V</h1><p class="mut">Privado: Sebastián y Nicolás.</p>
   <h3>¿Quién sos?</h3><div class="quien"><button data-a="quien" data-q="Sebastián">Sebastián</button><button data-a="quien" data-q="Nicolás">Nicolás</button></div>
   <label class="f">Código<input id="cod" type="password" autocapitalize="characters" autocomplete="off"></label>
   <button class="btn pri full" data-a="entrar">Entrar</button><p class="small mut">Entrás una sola vez en cada aparato: después te reconoce.</p></div>`;
}

function filaTarea(t,opts={}){
  const late=atrasada(t),est=t.estado;
  const fechas=t.inicio||t.fin?`${t.inicio?fmt(t.inicio):''}${t.inicio&&t.fin?' → ':''}${t.fin?(opts.limite?'vence '+fmt(t.fin):fmt(t.fin)):''}`:'';
  const real=est==='curso'&&t.inicioReal?`arrancó ${fmt(t.inicioReal)}`:est==='hecha'&&t.finReal?`terminada ${fmt(t.finReal)}`:'';
  return `<div class="task ${est==='hecha'?'done':''}"><button class="chk ${est}" data-a="ciclo" data-id="${t.id}" aria-label="Cambiar estado">${est==='hecha'?'✓':''}</button>
   <div class="t" data-a="editT" data-id="${t.id}" style="cursor:pointer"><b>${esc(t.titulo)}</b>
   <span class="small mut">${[opts.ctx,fechas,t.resp,real].filter(Boolean).map(esc).join(' · ')}</span>
   ${t.nota?`<span class="small mut" style="display:block">${esc(t.nota.slice(0,120))}${t.nota.length>120?'…':''}</span>`:''}</div>
   <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${late?'<span class="chip late">Atrasada</span>':''}${t.prio==='alta'&&est!=='hecha'?'<span class="chip" style="color:var(--rojo)">Alta</span>':''}${est==='curso'?'<span class="chip curso">En curso</span>':''}</span></div>`;
}
function ctxT(t){if(t.ambito==='general')return 'General';if(t.ambito==='nexo')return 'Nexo entorno app';if(t.ambito.startsWith('obra:'))return nombreObra(t.ambito.slice(5));return ''}

function vHoy(){
  const pg=pendGen().length,at=atrasadasTodas().length,ob=col('obras').reduce((a,o)=>a+obreros(o.id).length,0);
  const prox=col('tareas').filter(t=>t.estado!=='hecha').sort((a,b)=>(a.fin||a.inicio||9e12)-(b.fin||b.inicio||9e12)).slice(0,8);
  const sueldo=col('sueldos').find(s=>s.mes===MES_HOY);
  const gMes=col('gastos').filter(g=>mesDe(g.fecha)===MES_HOY).reduce((a,g)=>a+g.monto,0);
  return `<h2>Hola, ${esc(S.quien)}</h2>
  <div class="tiles"><button class="tile ${pg?'alert':''}" data-a="tab" data-k="tareas"><b>${pg}</b><span>tareas pendientes</span></button>
  <button class="tile ${at?'alert':''}" data-a="tab" data-k="obras"><b>${at}</b><span>atrasadas</span></button>
  <button class="tile" data-a="tab" data-k="gente"><b>${ob}</b><span>obreros</span></button></div>
  <h3>Para atender</h3>
  <div class="card">${prox.length?prox.map(t=>filaTarea(t,{ctx:ctxT(t),limite:t.ambito==='general'})).join(''):'<div class="empty">Todo al día. No hay nada pendiente.</div>'}</div>
  <h3>Este mes · ${mesTxt(MES_HOY)}</h3>
  <div class="card row" data-a="tab" data-k="gastos" style="cursor:pointer"><div class="g"><span class="small mut">Sueldo de Nicolás</span><br><b>${sueldo?(sueldo.pagado?'Pagado · '+money(sueldo.monto):'Pendiente · '+money(sueldo.monto)):'Sin cargar'}</b></div><div class="g"><span class="small mut">Gastos del mes</span><br><b>${money(gMes)}</b></div></div>`;
}
function vObras(){
  if(S.obra)return vObra();
  return `<h2>Obras</h2>${col('obras').map(o=>{const T=tareasDe('obra:'+o.id),h=T.filter(t=>t.estado==='hecha').length,at=T.filter(atrasada).length,cu=T.filter(t=>t.estado==='curso').length,n=obreros(o.id).length;

function gantt(T){
  const L=T.filter(t=>t.inicio&&t.fin);if(!L.length)return '';
  const min=Math.min(...L.map(t=>t.inicio),TODAY),max=Math.max(...L.map(t=>t.fin),TODAY),span=Math.max(DAY,max-min);
  const pos=t=>((t-min)/span*100);
  return `<div class="card"><div class="gantt">${L.sort(ordenT).map(t=>`<div class="g1"><i class="${t.estado==='hecha'?'hecha':atrasada(t)?'late':t.estado==='curso'?'curso':''}" data-a="editT" data-id="${t.id}" style="left:${pos(t.inicio)}%;width:${Math.max(4,(t.fin-t.inicio)/span*100)}%">${esc(t.titulo)}</i></div>`).join('')}
   <div class="hoy" style="left:${pos(TODAY)}%"></div></div><div class="eje"><span>${fmt(min)}</span><span style="color:var(--rojo)">| hoy ${fmt(TODAY)}</span><span>${fmt(max)}</span></div></div>`;
}

  menu:()=>sheet(`<h2>${esc(S.quien)}</h2><button class="btn full" data-a="refrescar">Actualizar ahora</button><button class="btn full" data-a="cambiarCod" style="margin-top:8px">Cambiar el código de la app</button><button class="btn del full" data-a="salir" style="margin-top:8px">Salir de este aparato</button><button class="btn full" data-a="cerrar" style="margin-top:8px">Cerrar</button>`),
  refrescar:()=>{closeSheet();cargar()},
  cambiarCod:()=>{const c=prompt('Código nuevo (mínimo 4 letras o números). Los otros aparatos van a pedirlo de nuevo.');if(!c)return;closeSheet();api({op:'cambiar_codigo',codigo:c}).then(()=>toast('Código cambiado')).catch(e=>toast('No se pudo cambiar: '+e.message,true))},
  salir:()=>{closeSheet();api({op:'logout'}).catch(()=>{});salirLocal()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.closest('.chk')&&el!==el.closest('.chk'))return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(f&&SUBMIT[f]){e.preventDefault();SUBMIT[f]()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#cod')&&document.activeElement===$('#cod'))entrar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.tk&&!document.querySelector('.sheet'))cargar(true)});
setInterval(()=>{if(S.tk&&!document.hidden&&!document.querySelector('.sheet'))cargar(true)},45000);

/* ---------- arranque ---------- */
(function(){
  S.tk=LS('seg_tk')||ckGet();S.quien=LS('seg_q')||'';
  if(S.tk){LS('seg_tk',S.tk);draw();cargar()}else draw();
})();
</script>
</body>
</html>
